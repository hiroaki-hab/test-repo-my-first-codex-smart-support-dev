const ITEMS = [{"file": "構想_アイスバス_BtoB展開_2026-06-04.md", "cat": "構想", "title": "構想：チラー付き水風呂（アイスバス）のBtoB展開 2026-06-04", "md": "# 構想：チラー付き水風呂（アイスバス）のBtoB展開 2026-06-04\n\n> 社長アイデア：当社のチラー付き水風呂は冷たい水を手軽に用意/楽しめる(=アイスバス)。スポーツ選手に刺さるのでは。\n> 温暖化で「冷たい水」需要は世界的に増える。スポーツ・農家・工業など冷たい水を必要とする先へ販売したい。\n> まず**大きな実績(有名どころに導入)**を作ってPRに使えるなら**無償設置でもよい**。色々な試し方を挙げたい。\n> 既存：光和は kokolo sauna / Hagoromo1(チラー水風呂) を扱い、KÖWA SAUNAにも設置。水温3〜42℃調整・ステンレス・オゾンろ過。\n\n## 部長の整理（本命と“用途違い”を分ける）\n- **本命＝「人が入る冷水浴(リカバリー/整い)」市場**：スポーツ・ジム・整骨院・温浴・ホテル。アイスバスの形がそのまま価値。\n- ⚠️ **農業/工業の“冷却”は用途が別**：野菜予冷・製造ライン冷却等は「人が入る浴槽」ではなく**冷却水・チラー能力**が欲しい。産業用チラーは**コモディティ＆価格競合**が激しく、当社の強み(浴槽＋手軽さ＋デザイン)が活きにくい。やるなら別製品提案として切り分け。\n- 海外/輸出は中長期の夢として保留(まず国内実績)。\n\n---\n\n## ① ターゲット・セグメント（営業先）\n\n### A. リカバリー/スポーツ（本命）\n| 営業先 | 具体例(宮城/全国) | 刺さる理由 | モデル |\n|---|---|---|---|\n| プロスポーツチーム | 楽天イーグルス・ベガルタ仙台・仙台89ers 等 | 疲労回復・アイシングの常設。**実績PRの目玉** | 無償/デモ→事例化 or 導入 |\n| 大学/強豪高校の運動部 | 駅伝・野球・ラグビー・サッカー強豪校 | 部活単位の回復需要・予算化しやすい | リース/補助金 |\n| 整骨院/接骨院/スポーツ整形 | 地域の治療院チェーン | 施術メニュー化・差別化 | 売切/リース |\n| パーソナル/格闘技ジム | 24時間ジム・クロスフィット系 | “サウナ→アイスバス”で会員価値UP | リース/レンタル |\n| トレーナー/個人アスリート | インフルエンサー選手 | 体験→SNS発信で認知(トリドリ的) | 無償貸与＋発信 |\n\n### B. 温浴/宿泊/レジャー（横展開）\n- サウナ施設・銭湯・スーパー銭湯(水風呂導入/温度可変が売り)、ホテル/旅館スパ、グランピング/キャンプ場、ゴルフ場、フィットネスクラブ。→ **同業＝KÖWAの強みを“卸す”**。\n\n### C. 暑熱対策（温暖化トレンド）\n- 建設/物流/製造現場の**作業員クールダウン**、学校/自治体の**熱中症対策(クーリング)**、屋外イベント/フェスの冷却。\n- ⚠️“人が浸かる”形が現場で許容されるかは要検証。需要トレンドは確実(温暖化)。\n\n### D. 農業/食品/工業（用途違い・要切り分け）\n- 野菜/果物の**予冷**、切り花鮮度保持、鮮魚冷却、醸造の発酵温度管理、機械/成形の冷却水。\n- ⚠️ これらは「浴槽」より「冷却水/チラー」需要。産業用チラーと競合＝別製品・別提案で。現製品の流用は限定的。\n\n---\n\n## ② フラッグシップ戦略（無償/デモ設置で実績→PR）★社長アイデアの核\n- **狙い**：誰もが知る先に「○○も導入」を作り、営業トーク/チラシ/HP/SNSの信頼材料にする。\n- **狙い目(地元×知名度)**：楽天イーグルス等プロチーム／強豪大学・高校／有名サウナ施設／著名アスリート個人。\n- **取引条件(必ず契約で)**：①無償 or 大幅値引きで設置 ②**名称・ロゴ・写真・動画の使用許可**(これが対価)③導入事例コメント/撮影協力。\n- **展開**：事例ページ・チラシ・SNS(「プロも使うアイスバス」)・展示会で横展開。アスリートの発信が一番効く。\n- ⚠️ 名称/肖像の無断使用はNG。必ず書面合意。プロチームはスポンサー/用品契約の制約があり得る(要確認)。\n\n---\n\n## ③ 販売モデル（BtoBは複線で）\n- **売り切り**(導入予算がある先)／**リース**(部活・治療院・ジム=減価/経費化)／**短期レンタル**(イベント・夏季・トライアル)／**サブスク**(保守込み月額)／**無償デモ→成果(事例化)課金的**。\n- **保守/メンテ契約**(チラー点検・水質管理)を継続収益に。\n- 価格は要設計(KÖWA向け原価ベース＋業務用耐久・保守を上乗せ)。\n\n---\n\n## ④ 営業チャネル・試す方法（色々試す）\n1. **KÖWA SAUNAを“体験ショールーム”化**：BtoBバイヤー/トレーナー/施設オーナーを招いて実体験→受注(分析チームの体験ファネルと同じ発想)。\n2. **展示会出展**：スポーツ/フィットネス(SPORTEC等)・温浴・農業/食品・設備の展示会。リード獲得の王道。\n3. **直接営業**：地元チーム・大学・整骨院・ジムへアプローチ。まず数件のデモ設置。\n4. **アスリート/インフルエンサー起用**(トリドリ実績を流用)：体験→SNS発信。\n5. **代理店/ディーラー**：スポーツ用品商社・治療院向け卸・設備業者と組む。\n6. **クラウドファンディング**：話題化＋初期需要＋実績(「○台支援」)を同時に作る。\n7. **業界メディア/PR**：サウナイキタイ・スポーツ系媒体・地元紙へ「温度自在の国産アイスバス」切り口。\n8. **熱中症対策の季節提案**(夏)：自治体/現場/学校へ時季営業。\n\n---\n\n## ⑤ 温暖化・世界的需要の文脈（追い風）\n- **cold plunge/アイスバスの世界的ブーム**(海外ウェルネス)＋**国内の暑熱対策需要**(温暖化)。\n- “整い”だけでなく**リカバリー科学**(運動後アイシング)の認知拡大が追い風。\n- ⚠️ 正直な注意：①複数人利用の**水質/ろ過/衛生**(温浴施設は法規も)②**PL/事故(心臓負担・転倒)**の注意喚起と保険③設置先の**電源容量**④産業/農業は別市場(コモディティ競合)。\n\n---\n\n## ⑥ 価格ポジショニングと“小型・安価”ニッチ（社長補足 2026-06-04）\n- **当社のチラー付き水風呂＝約125万円**。工業用チラーは大型で**5〜600万**が相場(社長)。当社は**小型・低出力ゆえ安価**＝「**500万の産業用チラーは過剰だが、少量の冷たい水が要る小規模事業者**」に刺さる余地。\n- **小規模“冷たい水”ニーズ候補**：染物(友禅/藍染)・リネン/クリーニング/小型洗濯・小規模食品加工/予冷・クラフトビール/日本酒/味噌の発酵温度管理・理美容・研究/実験・ペット(犬の暑熱)など。\n- ⚠️ **製品の切り出しが鍵(正直に)**：これらは「人が入る浴槽」ではなく**冷却水/プロセス冷却**が欲しい。売るなら**浴槽形態でなく“小型チラーユニット(タンク/熱交換型)”として再パッケージ**し、**冷却能力(kW)・連続運転耐久・水質・配管接続**の仕様適合を要確認。現製品(人用ステンレス浴槽・オゾンろ過)そのままでは用途が合わない場合がある。\n- **担当部署**：需要探索は**分析チーム(市場・需要調査=主管)＋集客PRチーム(営業先開拓)**、**部長が統括**。※サウナ運営7チームの本来スコープ外(光和本体の新規事業)だが、AIチームで対応可。\n\n## 🔔 まず動くなら（部長の推し）\n1. **地元の“目玉”1件に無償/デモ設置**(プロチーム or 強豪校 or 有名サウナ)→**名称・写真使用許可をセット**で取り、事例化。\n2. **KÖWA SAUNAを体験ショールーム**にして、整骨院・ジム・トレーナーを招く。\n3. 夏に向けて**熱中症対策＋リカバリー**の切り口で地元営業＋SNS(アスリート発信)。\n→ 小さく実績を作り、事例をテコに横展開。農業/工業は“冷却水ソリューション”として別途検討。\n"}, {"file": "構想_コインランドリー事業_2026-06-04.md", "cat": "構想", "title": "構想：コインランドリー事業（ワンストップ支援）2026-06-04", "md": "# 構想：コインランドリー事業（ワンストップ支援）2026-06-04\n\n> 社長情報：自社でコインランドリー(moco)運営＋**AQUA・Electrolux の代理店**(他メーカーも修理対応)。中古販売・買取、**OEM自社ブランド洗剤**、機械の販売/設置/メンテ、リフォーム屋ゆえ内装・大工・電気設備まで一貫。洗剤提案でランドリーや工場の**固定費削減**も提案可。**アクアと協力し出店希望地域のニーズ調査**も実施。**補助金活用**の提案も可。\n\n## 部長の評価：「機械を売る業者」ではなく「ランドリー開業〜運営のワンストップ支援」へ\n光和は**リフォーム力×代理店×洗剤×補助金×ニーズ調査**を全部持つ。これは単なる機器販売店には無い総合力＝強い差別化。moco を**モデル店/ショールーム**に使える。\n\n## 提供メニュー（収益源を複線化）\n1. **新品機械販売**(AQUA/Electrolux・他メーカー修理対応で間口拡大)\n2. **中古販売・買取**(初期費用を抑えたい開業者／入替需要／撤退店の買取→再販の循環)\n3. **開業ワンストップ施工**(物件選定→内装・大工・電気設備→設置。リフォーム本業の強み)\n4. **メンテナンス契約**(継続収益。多メーカー対応が武器)\n5. **OEM自社ブランド洗剤**(継続消耗品収益＋他店/工場へ卸＝ストック型売上)\n6. **出店ニーズ調査**(アクア協力)＝コンサル的入口で信頼獲得→機械・施工受注へ\n7. **固定費削減提案**(洗剤・水道光熱・動線最適化)＝ランドリー/工場向けの切り口\n8. **補助金活用提案**(開業・省エネ高効率乾燥機・設備)→`構想_補助金_監視提案体制` と連携\n\n## ターゲット\n- **新規開業者**(投資/副業オーナー・遊休地/空き店舗の不動産活用)→ワンストップが刺さる\n- **既存ランドリーオーナー**(入替・中古・洗剤・メンテ・固定費削減)\n- **工場/施設/宿泊**(OEM洗剤＝固定費削減の卸先)\n- **自社moco**=モデル店・体験ショールーム・洗剤の実証\n\n## 差別化\n- 「機械だけ」業者と違い、**開業まるごと(物件→施工→機械→洗剤→メンテ→補助金)**を一社完結。\n- **洗剤OEM＝継続収益**＋**買取/中古＝循環**で、売り切りでないストックビジネス。\n- **ニーズ調査(アクア協力)**で出店成功率を上げる=オーナーの安心。\n\n## まず動くなら\n1. **moco をモデル/ショールーム化**(実機・洗剤・固定費削減効果を見せる)。\n2. **OEM洗剤の卸先開拓**(他店・工場・宿泊＝固定費削減の切り口でストック売上)。\n3. **「ランドリー開業ワンストップ＋補助金」提案パッケージ**を1枚化。\n4. 出店ニーズ調査をリード獲得の入口に。\n\n## ⚠️ 注意・論点\n- moco の現場運営は赤間/佐々(別枠管理)。本構想は**代理店/物販事業**としての展開＝光和の**物販・BtoBライン**(サウナ/水風呂/寝具と同じ束)に入れられる。\n- コインランドリーは**地域過当競争**に注意→**ニーズ調査**が効く。\n- 補助金・洗剤の効能/削減効果は**誇大表現を避け、実証ベース**で。\n"}, {"file": "構想_ブレインスリープ販売計画_2026-06-04.md", "cat": "構想", "title": "構想：ブレインスリープ(正規代理店)販売計画 2026-06-04", "md": "# 構想：ブレインスリープ(正規代理店)販売計画 2026-06-04\n\n> 社長指示：光和はブレインスリープの正規代理店。サウナ・水風呂と並ぶ物販の柱としてしっかり売る計画を。\n> 製品の強み(社長):①**通気性が高く耐水**=水着が濡れたままでも横になれる ②**丸洗いできる**=汚れても水洗いで清潔(高齢者施設に最適) ③**枕の性能が高い**=寝付き向上・短い睡眠でも回復。\n> ターゲット候補:サウナ施設／宿泊施設／高齢者・老人ホーム。\n> ＋組織の論点:サウナ＋水風呂＋ブレインスリープを今のサウナ事業部で回すか、別事業部を建てるか。\n\n## 部長の評価\n**3つの強み(耐水通気・丸洗い・回復睡眠)が、狙う先ごとに別の刺さり方をする**=セグメント別メッセージで効く好商材。サウナ・水風呂との**3点セット販売**と、**KÖWA SAUNAを体験ショールーム**にする導線が効く。\n\n---\n\n## ターゲット × 刺さる理由 × メッセージ × 売り方\n\n### A. サウナ/温浴/整い施設（自社サウナ販売との相乗・本命の一つ）\n- 刺さる理由：**整いの仕上げ＝睡眠**。**水着・汗で濡れたまま寝られる**(通気・耐水)→外気浴/休憩スペースに最適。**丸洗い**で多人数利用も清潔。\n- メッセージ：「ととのいの仕上げは\"眠り\"。濡れたまま寝られて、丸洗いできる\"整いベッド\"」\n- 売り方：**サウナ＋水風呂＋ととのいベッドの3点セット**で提案。KÖWA SAUNAで実体験させる。kokolo/バレル施工先へクロスセル。\n\n### B. 宿泊施設（ホテル/旅館/グランピング/サウナ付き宿）\n- 刺さる理由：**睡眠の質＝宿の評価(口コミ)**。差別化アメニティ。**丸洗い=客室回転の衛生・耐久**。\n- メッセージ：「\"よく眠れた\"がレビューになる。洗える清潔さで連泊・多客に強い寝具」\n- 売り方：客室/スイート差別化、サウナ付き宿へクロスセル、ホテル備品商社経由。\n\n### C. 高齢者/介護（老人ホーム・サ高住・介護施設・病院）★独自性が高い\n- 刺さる理由：**丸洗いできる=失禁・汚れ対応の衛生**(介護の最重要課題)、**通気=蒸れ/床ずれ配慮**、**回復の良い睡眠=QOL**、耐久。\n- メッセージ：「丸洗いで清潔、蒸れにくい、よく眠れる——介護現場のための寝具」\n- 売り方：介護用品ディーラー/福祉備品商社・施設へ直販・リース、福祉系展示会。導入施設を事例化。\n- ⚠️ **誇大NG**：「床ずれ予防」「治療効果」等の医療的効能は断定しない。**防炎/難燃など施設の安全規格**の適合を確認。医療機器ではない旨を明確に。\n\n### D. スポーツ/リカバリー（アイスバスBtoBと束ねる）\n- 刺さる理由：**睡眠＝リカバリーの要**。アイスバス＋ブレインスリープで\"回復\"パッケージ。\n- 売り方：チーム寮・合宿所・トレーニング施設へ、アイスバスとセット提案。\n\n### E. 個人（富裕層・サウナー）\n- 刺さる理由：自宅サウナ導入客への寝具クロスセル(体験→自宅)。\n- 売り方：KÖWAで体験→正規販売店として販売。家庭用サウナ販売の客に同時提案。\n\n---\n\n## 共通の売り方・チャネル\n1. **KÖWA SAUNAを体験ショールーム化**(実際に寝て試せる＝最強の説得)。\n2. **3点セット(サウナ・水風呂・寝具)**のパッケージ提案＋単品販売。\n3. **正規取扱店としての信頼**を前面に。本体(ブレインスリープ)の販促素材・共同販促を活用。\n4. セグメント別ルート：介護=福祉ディーラー/展示会、宿泊=備品商社、サウナ=既存施工先。\n5. SNS：濡れたまま/丸洗い/整い→睡眠の体験動画(既存IGリールにもブレインスリープ投稿あり=継続)。\n\n## ⚠️ 注意（守ること）\n- ブレインスリープ**本体の販促ガイドライン・表示ルール・価格規定**を遵守(正規代理店として)。\n- 効能の**誇大表現を避ける**(睡眠・回復・床ずれ等は体験/特長の範囲で。医療効果を断定しない)。\n- 介護/宿泊の**防炎等の規格**適合を確認。\n\n---\n\n## 🔔 組織の論点への回答（社長の問い）\n**2つを分けて考えるのが要点：**\n- **① KÖWA SAUNA＝直営の\"体験施設運営\"**(予約・店舗オペ)。これは**現サウナ事業部(7チーム)のまま**が自然。\n- **② 物販＝サウナ・チラー水風呂・ブレインスリープの\"販売/施工/BtoB\"**。これは**買い手(施設・富裕層)・営業・施工・リースが共通**＝一つの事業として束ねる価値がある。\n\n**部長の推奨(段階論)**：\n- **いきなり別事業部を作らない**。まず**「物販・BtoB営業ライン」を部長直轄の機能として一束**にして回す(KÖWAをショールームに相互活用)。組織を先に作ると固定費・形骸化のリスク(＝ツール先行・組織先行の罠)。\n- **案件数・売上が安定して見えてきたら、正式に「ウェルネス物販事業部(仮)」として切り出す**(専任・拠点・在庫/リース体制)。\n- AIチーム上は、施設運営7チームに加え、横断の**「物販・BtoB営業チーム」を部長直轄で1つ追加**すると回しやすい(分析＝市場/PR＝営業/経理＝採算と連携)。\n\n## まず動くなら\n1. **3点セット(サウナ＋水風呂＋ブレインスリープ)の提案ストーリー**をKÖWA体験とセットで確立。\n2. **介護施設向け**の「丸洗い・衛生」訴求の1枚提案＋ディーラー/展示会ルート開拓(独自性が高い)。\n3. 物販3本を**部長直轄ラインで運用→実績で事業部化**を判断。\n"}, {"file": "構想_再現系サウナ_温度コラボ_2026-06-04.md", "cat": "構想", "title": "構想：再現系サウナ／温度コラボ（2026-06-04 社長アイデア → 部長で膨らませ）", "md": "# 構想：再現系サウナ／温度コラボ（2026-06-04 社長アイデア → 部長で膨らませ）\n\n> 社長アイデア：KÖWAは温度が自由＝**いろんなサウナの“温度設定”を再現できる**のでは。\n> 「今日はあの施設の設定、今度は別の施設の設定」と、各施設の温度をフィーチャリングして楽しむ仕掛け。\n> ロケーション/動線は再現できないが、**サウナ温度×水風呂温度の組み合わせ**はサウナーが必ず妄想する点。\n> 例え：ラーメン花月嵐＝自社オリジナル(東京とんこつ)をベースに、いろんな店とコラボで多彩なメニューを展開。\n\n## 部長の評価\n**強い。** これは「温度自在」という強みを“体験できる商品メニュー”に変える発明。価格を上げずに**来店動機を毎月リセット**でき(＝リピート理由)、SNSコンテンツも無限に湧く。花月嵐式（自社ベース＋コラボ）で構造化するのが正解。\n\n---\n\n## ネーミング候補（コンセプト名）\n- **「ととのいリミックス」**／**「温度コラボ」**／**「再現サウナ(リプロ・ととのい)」**／**「サ旅、ここで。」**\n- キャッチ例：「行った“あの温度”を、貸切で。」「サウナーの妄想、再現します。」\n\n---\n\n## 仕掛けアイデア集\n\n### 1.【MVP・即できる】自社ベース設定を“メニュー化”\n- 自社の温度組み合わせに名前を付けて**温度メニュー表**化。例：「KÖWA標準(サ95/水15)」「灼熱ストロング(サ108/水10)」「やわらか整い(サ80/水18)」「シングルチャレンジ(サ100/水一桁)」。\n- 予約/来店時に“今日のモード”を選べる。**許可不要・今日から可能**。\n\n### 2.【花月嵐式・本命】コラボ「監修設定」(許可ベース)\n- 他施設・有名サウナー・インフルエンサーに**「監修設定」**を作ってもらい「KÖWA × ○○」として期間限定提供。\n- 相手もWin(宣伝になる)＝相互送客。トリドリ起用とも接続。これが“多彩なメニュー展開”の核。\n- ⚠️ 店名を出すのは**必ず相手の許可を得てから**(無断の「○○公式再現」はNG)。\n\n### 3.【許可不要の再現】“タイプ/系統”で寄せる\n- 特定店名を出さず、**特徴で再現**：「伝説のシングル水風呂(一桁台)を体験」「ロウリュ強めの高温ストロング」「北欧式まろやか低温」等。\n- “聖地っぽさ”を温度で味わう。誇大表現を避け「温度を主軸に寄せる」と正直に表記。\n\n### 4.【参加型】リクエスト＆投票で“次の再現”を決める\n- 「次に再現してほしい設定」をSNS/LINEで募集・投票→翌月実施。\n- 当てたお客様を巻き込み(コメント/ストーリー)→エンゲージとUGCが伸びる。総選挙的に毎月の目玉に。\n\n### 5.【コンテンツ量産】「○○を再現してみた」シリーズ\n- 各再現設定を**動画/カルーセルの型**に流し込む(バズ型投稿案A/Bと接続)。温度計のアップ・水しぶき・整い顔。\n- 「今月の再現＝△△」を毎月の固定ネタに＝毎日投稿AI広報担当のレギュラー枠。\n\n### 6.【リピート装置】マイ設定の保存・命名\n- お客様自身の好みの組み合わせを**「あなたの黄金比」**として保存・命名(CSの“マイ温度カルテ”と統合)。\n- 「前回の◯◯設定で」と再来導線に。常連が“自分の設定”を育てる楽しみ。\n\n### 7.【コンプリート欲】再現スタンプラリー\n- 用意した再現設定を“制覇”するスタンプ(LINEショップカードと統合)。○種制覇で特典＝通い直す理由。\n\n### 8.【季節イベント】時季の再現\n- 「真冬のシングル」「真夏の灼熱」「年末の締めととのい」等、季節・記念日(11/11サウナの日)に合わせた限定再現。\n\n---\n\n## ⚠️ 正直な注意点（先に潰す）\n- **IP/権利**：特定の施設名・ロゴ・写真の無断使用はしない。名前を出すなら**許可(コラボ)前提**。出さないなら**タイプ/系統**表現で。「公式」を騙らない。\n- **再現の限界**：再現できるのは主に**温度(サ室温・水風呂温)**。湿度(ロウリュ)・体感はある程度寄せられるが、**水質・内装・ロケ・動線は別物**。「温度を主軸に寄せる体験」と正直に伝える(誇大NG)。\n- **オペ負荷**：毎回バラバラだと管理・清掃が大変→**月替わり＋事前連絡(カスタム時)**で回す。標準モードは常設。\n- **安全**：高温(〜110℃)・低温(〜3℃)は無理させない注意書き。体調・初心者向けの声かけ必須。\n\n---\n\n## まず動くなら（部長の推し）\n**①自社ベース設定のメニュー化＋⑤“今月の再現”をSNS/LINEで告知**から。許可不要・今日から可能で、リピート理由とコンテンツを同時に生む。手応えが出たら**②コラボ(花月嵐式)**へ拡張。\n\n## 既存施策との接続\n- **LINE**：毎月「今月の再現設定」を配信＋リクエスト投票(開設キットのクーポン/配信枠を活用)。\n- **SNS**：バズ型投稿案の“型”に毎月の再現を流し込む(毎日投稿AI広報担当のレギュラー)。\n- **CS/リピート**：マイ設定保存＋スタンプラリーで常連化。\n- **予約**：カスタム設定は前日までに連絡(既存運用)。CHILLNNのプラン/オプションに“今月の再現”を載せる。\n"}, {"file": "構想_秘書AI_2026-06-04.md", "cat": "構想", "title": "構想：社長の秘書AI（kowa-hisho）2026-06-04", "md": "# 構想：社長の秘書AI（kowa-hisho）2026-06-04\n\n> 社長依頼：秘書が欲しい。誰宛か指定せず話す＝**単一窓口で自動振り分け**。秘書↔部長の上下は任せる。\n> 役割（社長の言葉）：名刺→御礼メール／予定管理・TODO／メール監視→TODO／LINE監視・返信／デスクトップ定期整理／抜け防止の伴走／見積たたき台／必要な公式スキルを自分に付与。\n\n## 位置づけ・上下関係（部長の設計）\n- **社長 → メインセッション(単一窓口)**。社長は誰宛か気にせず話す。窓口が内容で自動振り分け：\n  - **庶務・段取り・個人タスク → 秘書(`kowa-hisho`)**(社長直属)\n  - **事業運営 → 部長**(配下に事業チーム群)\n- **秘書と部長は対等(役割分担)**。秘書は社長の「抜け防止・段取り」に専念し、事業案件は部長へ渡す。両方をメインセッションが束ねる。\n\n## 🔔 実現可能性マトリクス（正直に）\n| 秘書タスク | 今できる? | 手段 | 安全・留意 |\n|---|---|---|---|\n| 名刺→御礼メール**下書き** | ◯(下書きまで) | 名刺画像を読取(ローカル/Drive/Chromeでフォト)→氏名・会社・宛先抽出→Gmailで下書き | **送信は社長承認(都度)**。`pdf`スキルでスキャンも可 |\n| 予定管理・TODO化 | ◯ | Google Calendar(接続済)＋TODOはSheets/MD | — |\n| メール監視→TODO化・作業支援 | ◯ | Gmail(接続済)で検索・読取→要対応をTODO・下書き | **送信は承認** |\n| 添付DL→該当フォルダ格納 | ◯ | メール/Drive添付→デスクトップの該当フォルダ、無ければ作成 | — |\n| デスクトップ定期整理 | ◯ | ローカルで中身確認→分類しフォルダ格納／不明は`未分類`へ | ⚠️**非破壊**(削除しない)・大量移動前に確認 |\n| 抜け防止の伴走(リマインド) | ◯ | TODO＋カレンダー＋定期チェックで督促 | — |\n| 見積たたき台 | ◯(たたき台まで) | 過去見積(サーバー/xlsx)を参照→ケース別たたき台＋必要資料＋サンプルDL→デスクトップ配置 | **仕上げは社長**。→`kowa-estimate` |\n| 会議の**音声**録音→TODO | △ 要セットアップ | ⚠️**現状、音声の文字起こし手段が無い**。録音をDrive等に置き別途STT、または文字起こし済みテキストを渡せば即TODO化 | 文字起こしの段取りが要る |\n| LINE監視・返信要否 | ✕ 現状不可 | ⚠️**LINEのコネクタが無い**。実現にはLINE公式API/別手段が必要。今は不可 | 要・別途構築(公式LINE開設と併せ検討) |\n| 必要な公式スキルの付与 | ◯ | 下記の公式(Anthropic)スキルを秘書が活用 | — |\n\n## 活用する公式スキル（Claude公式・付与済みで使える）\n- `pdf`(名刺/スキャン読取・資料PDF化)／`docx`(御礼状・書類)／`xlsx`(見積・TODO・名簿)／`pptx`(提案資料)\n- `doc-coauthoring`・`internal-comms`(文書・コミュ作成)\n- 反復監視は `schedule` / フック(`update-config`)も候補 ⚠️(過去Cowork的の下書きスパム=dedupe失敗の教訓があるので、自動送信はせず\"下書き+通知\"に留め慎重設計)\n\n## 標準ワークフロー（例）\n- **名刺御礼**：名刺画像を受領/検出→氏名・社名・役職・メール抽出→簡潔な御礼下書き(フレンドリー＆丁寧)→社長承認→送信。\n- **会議→段取り**：(文字起こし前提)要点抽出→TODO化→出た商品/顧客希望を調査→資料を`docx/pptx/xlsx`で作成→**デスクトップに配置**→社長に「置きました」。\n- **メール伴走**：受信を監視→要対応をTODO化＋下書き→社長承認で送信。\n- **デスクトップ整理**：定期(任意間隔)に中身確認→分類→該当フォルダ格納／不明は`未分類`→結果を報告。\n\n## ⚠️ 安全ルール（厳守）\n- **送信(メール/メッセージ)は必ず社長承認**。秘書は下書き・提案まで。\n- ファイル整理は**非破壊**(削除・上書きしない、移動は記録、不明は`未分類`)。\n- 個人情報・名刺情報は最小限に扱い、外部送信は承認を得る。\n- 自動化(監視/定期実行)は**下書き＋通知**に留め、暴走(スパム)防止を最優先。\n\n## まず動かすなら（段階）\n1. **名刺→御礼下書き** と **メール→TODO**(今すぐ可・効果大)。\n2. **デスクトップ定期整理**(非破壊・小さく開始)。\n3. **見積たたき台**(`kowa-estimate`で過去見積を学習)。\n4. 会議音声→TODO(文字起こし手段を決めてから)／LINE(別途構築)。\n"}, {"file": "構想_補助金_監視提案体制_2026-06-04.md", "cat": "構想", "title": "構想：補助金 網羅監視・提案体制（全BtoB共通の武器）2026-06-04", "md": "# 構想：補助金 網羅監視・提案体制（全BtoB共通の武器）2026-06-04\n\n> 社長指示：BtoBは補助金という選択肢を忘れない。お客様の事業に合う・使えそうな補助金を**網羅的に監視し、常に提案できる状態**を作りたい。サウナ事業にも言える。\n> ＝ サウナ／チラー水風呂／ブレインスリープ／コインランドリー／リフォーム、**全部の設備投資提案で\"補助金\"がクロージングの決め手**になる。\n\n## 部長の評価\n「設備を売る」会社は多いが「**使える補助金まで添えて提案できる**」会社は少ない。これは**全事業の成約率を底上げする横断ケイパビリティ**。AIチームの得意領域(網羅監視・マッチング)とも相性が良い。\n\n## 監視対象になりうる補助金（例・⚠️制度/予算は年度で変動＝要・最新公募確認）\n| 補助金 | 主な用途 | 当社事業との接点 |\n|---|---|---|\n| ものづくり補助金 | 設備投資・革新的サービス | サウナ/水風呂/ランドリー機器の設備投資 |\n| 小規模事業者持続化補助金 | 販路開拓・小規模の設備/広報 | 小規模店・開業者の設備＋チラシ |\n| 省エネ補助金(省エネ設備導入) | 高効率機器への更新 | 高効率乾燥機・チラー・空調・ヒーター |\n| IT導入補助金 | 予約/管理/会計システム | サウナ予約・店舗管理・会計効率化 |\n| 業務改善助成金 | 設備＋賃上げ | 事業者の設備投資＋人件費 |\n| 事業再構築補助金 | 新分野転換(※縮小傾向) | リフォーム業→サウナ等の新事業 |\n| 介護・福祉系補助 | 介護環境整備 | 介護施設へのブレインスリープ等 |\n| 自治体の創業/設備/省エネ/熱中症対策補助 | 地域別 | 出店・熱中症対策アイスバス 等(地域で要確認) |\n\n## 監視のしくみ（AIチーム活用）\n1. **公的ソースを定期巡回**：中小企業庁／ミラサポplus／J-Net21／jGrants／宮城県・各自治体の補助金ページ。\n2. **一覧台帳を維持**：補助金名・対象・補助率/上限・公募期間・要件・出典URL を表で更新(月次＋公募期は随時)。\n3. **顧客事業 × 補助金 のマッチング表**：業種/投資内容から「使える候補」を即引ける状態に。\n4. **案件時に即提案**：見積に「活用できる補助金候補」を添える(成約率UP)。\n\n## 運用ルール（正直に・守る）\n- 当社/AIの役割は**「網羅的な情報提供と提案」まで**。**申請代行・要件可否の最終判断・採択保証は専門家(行政書士・認定支援機関)領域**＝橋渡しする。\n- **誇大NG**(「必ず通る」等は言わない)。制度は流動的＝**必ず最新の公募要領を確認**してから提案。\n- 補助金ありきで不要投資を勧めない(顧客本位)。\n\n## 適用（全事業に効く）\n- サウナ/チラー水風呂：省エネ・設備・熱中症対策(自治体)\n- ブレインスリープ：介護施設の福祉系補助\n- コインランドリー：開業・省エネ高効率乾燥機\n- リフォーム本業：各種設備・省エネ\n\n## まず動くなら\n1. **補助金台帳(スプレッドシート)を1枚作成**し、上表の主要補助金を初期登録。\n2. AIチームに**「補助金ウォッチ」機能**を持たせ、月次更新＋公募期アラート。\n3. 各事業の提案資料に**「使える補助金候補」欄**を標準装備。\n4. 連携先(行政書士/認定支援機関)を1つ確保し、申請は橋渡し。\n"}, {"file": "施策_GBP口コミ返信キット_2026-06-04.md", "cat": "施策", "title": "GBP 口コミ返信キット（KÖWA SAUNA）2026-06-04", "md": "# GBP 口コミ返信キット（KÖWA SAUNA）2026-06-04\n\n> 目的：Googleビジネスプロフィール(GBP)の口コミに対して、**すぐ貼れる**返信文を型別に整備する。\n> トーン：親しみ・フレンドリー・絵文字OK（SNS運用.md 確認済）。\n> 差別化メッセージ：**「温度を自在に操れる＝自在ととのい」** を全パターンに自然に織り込む。\n>\n> ⚠️ GBPは公開情報。返信の実反映は**社長の明示許可のうえ**（部長/担当が代行する場合も都度確認）。\n> 本キットは「すぐ貼れる文の用意」までが範囲。反映作業は別途許可を得てから。\n\n---\n\n## テンプレ共通ルール\n\n- `◯` は**実値に置換**する箇所（例：お客様名、温度、使用チェア名）\n- 冒頭でお名前 or お言葉に触れる → 温度自在の強みを一言 → 再来店への誘い\n- 長すぎない（200〜300字目安）。GBPは長文より読みやすさが大事\n- 絵文字は1返信に3〜5個まで（多すぎると安っぽく見える）\n\n---\n\n## 型1：高評価（星4〜5）・温度/水風呂に触れている口コミ\n\n### パターンA\n```\n◯◯さん、口コミありがとうございます🥹\n「◯◯（温度に関するお言葉の引用）」── 嬉しすぎます！\n当店の水風呂は3〜42℃、サウナ室は60〜110℃と、お好みに合わせて自由に設定できるので、\n\"自分だけのととのい温度\"を見つけていただけるのが最大の喜びです🔥🧊\n次回もぜひ違う組み合わせを試しに来てください。スタッフ一同お待ちしております！\n```\n\n### パターンB\n```\n◯◯さん、ありがとうございます✨\n温度のことを気に入っていただけて、本当によかったです！\n実はサウナ◯℃ × 水風呂◯℃という組み合わせ、まだまだ可能性が広がります🌡️\n「今日と違う温度も試してみたい」そんな日にもぜひKÖWA SAUNAへ。\nいつでもお好みの設定でご用意します😊 またのご来店、心よりお待ちしています！\n```\n\n---\n\n## 型2：高評価・貸切/プライベートを褒めている口コミ\n\n### パターンA\n```\n◯◯さん、嬉しいお言葉ありがとうございます🙏\n「◯◯（プライベートに関するお言葉）」── まさにそれを大切にしたくて、1日2組限定にしています。\n他のお客様を気にせず、自分のペースで、好きな温度で整えるのがKÖWA SAUNA流です🔥\n次回もゆっくり自在ととのいを楽しんでいただけるよう、スタッフ一同ご用意してお待ちします！\n```\n\n### パターンB\n```\n◯◯さん、口コミをいただきありがとうございます！\n完全貸切、喜んでいただけて何よりです☁️\n時間を気にせずご自身のペースでサウナ→水風呂の温度を変えながら、\n自分だけのととのいを追求できる──そんな場所を目指しています🏠\nまたぜひリフレッシュしにいらしてください。お待ちしています😊\n```\n\n---\n\n## 型3：高評価・ロウリュ/熱さ/ととのいチェアに触れている口コミ\n\n### パターンA\n```\n◯◯さん、ありがとうございます🥹\nロウリュ、気に入っていただけて嬉しいです！5種のアロマからお選びいただけるので、\n次回は違うアロマで体感の変化も楽しんでみてください🌿\nととのいチェアも3種（インフィニティ・ブレインスリープ・アディロンダック）ご用意しています。\nサウナ温度・水風呂温度・アロマ・チェアの組み合わせが無限大なので、また探しにきてください😊\n```\n\n### パターンB\n```\n◯◯さん、温かい口コミをありがとうございます！\n「◯◯（ロウリュ/チェア/熱さに関するお言葉）」── 本当にありがとうございます🔥\nKÖWA SAUNAは温度設定もアロマもチェアも全部自分で選べるので、\n毎回違う\"自在ととのい\"が楽しめるのが強みです。\n次はどんな組み合わせにするか、ぜひ考えながら来てください✨ またお待ちしています！\n```\n\n---\n\n## 型4：初回来店っぽい口コミ\n\n### パターンA\n```\n◯◯さん、はじめてのご来店ありがとうございます🎉\n初めてでもリラックスしていただけたようで、本当によかったです！\n実は当店、サウナ温度（60〜110℃）も水風呂温度（3〜42℃）もお好みに設定できるので、\n次回は\"自分好みの温度\"を探しに来てみてください🔥🧊\n2回目はさらに楽しくなると思います😊 またのご来店、心よりお待ちしています！\n```\n\n### パターンB\n```\n◯◯さん、初めてのKÖWA SAUNA、いかがでしたか？✨\n口コミを書いてくださって本当にありがとうございます🙏\n当日は◯℃ × ◯℃の設定でしたね（もし分かれば入れる）。\n実は温度は毎回変えられるので、次は違う組み合わせも体験できますよ🌡️\n「自分だけのととのい温度」を見つける旅、またぜひ続けに来てください！\n```\n\n---\n\n## 型5：リピーターっぽい口コミ\n\n### パターンA\n```\n◯◯さん、いつもありがとうございます🙌\n何度も来ていただけているのが本当に嬉しいです！\n毎回温度を変えて\"自在ととのい\"を探していただいているのが、スタッフとしても楽しみです🔥\n次回もご希望の設定でお迎えします。お気軽に「前回と同じで」でも「今日はこの温度で」でもOKです😊\nいつでもお待ちしています！\n```\n\n### パターンB\n```\n◯◯さん、またお越しいただきありがとうございます✨\n「◯◯（リピート来店のお言葉）」── こんなに嬉しいことはないです🥹\n毎回同じようで、温度や水風呂の組み合わせで全然違う体験になるのがKÖWA SAUNAの醍醐味。\n次はどんなととのいを試しますか？ぜひまたお話聞かせてください🔥\nいつでも心よりお待ちしています！\n```\n\n---\n\n## 型6：低評価・不満（星1〜3）\n\n> 返信の基本姿勢：**誠実に・防御的にならない・改善姿勢を示す**。\n> 感情的な反論・言い訳・「ですが〜」という逆接は使わない（GBP上で不利に見える）。\n\n### パターンA（設備・温度・快適性への不満）\n```\n◯◯さん、ご来店いただいたうえに、大切なフィードバックをありがとうございます🙏\n「◯◯（不満点の引用）」につきまして、真摯に受け止めております。\nご期待に沿えず、大変申し訳ありませんでした。\nいただいたご意見を運営改善に生かして、次お越しいただく際はもっと気持ちよく過ごしていただけるよう取り組んでまいります。\nもしよろしければ、改めてご来店いただけますと幸いです。\n```\n\n### パターンB（サービス・対応への不満）\n```\n◯◯さん、口コミをいただきありがとうございます。\n今回の体験でご不満をお持ちにさせてしまい、本当に申し訳ございません🙇\nご指摘の点はスタッフ間で共有し、すぐに改善に動きます。\n少しでも「次は良くなっているかも」と感じていただけるよう努めてまいりますので、\n機会がございましたらもう一度足をお運びいただけますと嬉しいです。\nお時間をいただきありがとうございました。\n```\n\n> #### ⚠️ NGワード・NGパターン（低評価返信での禁止事項）\n> - 「ですが〜」「しかしながら〜」（言い訳に見える）\n> - 「他のお客様にはご好評をいただいています」（比較で反論しない）\n> - 「ルール上〜」「当店のポリシーでは〜」（冷たく見える）\n> - 口コミ内容の事実関係を否定する文（公開の場での言い争いはNGよりさらに悪印象）\n> - 長すぎる返信（500字超は読まれない。謝罪→改善姿勢→招待、この3点に絞る）\n> - 絵文字の多用（低評価返信では1〜2個まで。軽く見える）\n\n---\n\n## 型7：写真付き投稿への感謝\n\n### パターンA\n```\n◯◯さん、素敵なお写真もありがとうございます📸\n◯◯（写真の内容に触れる。例：水風呂の写真が最高です！）\nこうして雰囲気を伝えていただけるのが、すごく嬉しいです🥹\nサウナ温度も水風呂温度も毎回変えられるので、次回はまた違う温度設定でのお写真も楽しみにしています🔥\nまたのご来店、お待ちしています！\n```\n\n### パターンB\n```\n◯◯さん、口コミと一緒にお写真まで、本当にありがとうございます✨\n「◯◯の写真、大好きです」──スタッフ一同で拝見しました！\nこうして記録していただけると、私たちも励みになります📸\n次回も、自分だけの\"自在ととのい\"の瞬間をぜひ収めにきてください😊\nいつでもお待ちしています！\n```\n\n---\n\n## 運用フロー（口コミ返信・5ステップ）\n\n### ステップ1：口コミに気づく\n- **GBPダッシュボード**（`business.google.com`→社長Gアカウント `hiroakikouwa5@gmail.com`）に新着通知が届く\n- または週1のGBPチェックのタイミングで確認\n- 通知設定：GBP管理画面の「通知」→「新しい口コミ」をONにしておく（未設定の場合は社長が設定）\n\n### ステップ2：口コミの型を判断する\n- 本キットの型1〜7に照らし合わせ、最も近いパターンを選ぶ\n- 星数（高評価/低評価）と、何を褒めているか（温度・貸切・ロウリュ等）で選択\n- 複数の要素が混在する場合は、口コミ内で最も強調されていた要素の型を使う\n\n### ステップ3：テンプレを編集してコピー\n- `◯◯` の箇所を実値に置き換える（お名前・引用フレーズ・温度設定等）\n- GBPにお名前が表示されていない場合（匿名/Googleユーザーの場合）は冒頭の呼びかけを省略し「素敵な口コミありがとうございます！🥹」等に変更\n\n### ステップ4：社長に確認・許可を得る（⚠️必須）\n- **GBPは公開情報のため、返信の実反映は社長の明示許可のうえ**\n- 部長/担当者が返信文を用意 → 社長にテキストを見せて「この文で返信してよいか」確認\n- 社長がOKを出したら→社長自身が反映 or 社長の許可を得て部長が代行\n\n### ステップ5：GBP上で返信を投稿\n- `business.google.com` → 対象店舗 → 「口コミ」 → 対象の口コミの「返信する」をクリック\n- 準備したテキストを貼り付け → 投稿\n- 投稿後、文字化け・改行崩れがないか確認\n- 低評価の場合は投稿後に佐藤様へ報告（「◯◯さんの星◯の口コミに返信しました」）\n\n---\n\n## Google口コミ短縮リンク（QRカード・退店フォロー用）の取得手順\n\n口コミを依頼するためのリンク（`https://g.page/r/～/review` 形式）の取得方法：\n\n1. `business.google.com` にアクセス（社長Gアカウントでログイン）\n2. 対象店舗（KÖWA SAUNA）を選択\n3. 左メニューの「ホーム」または「顧客」を開く\n4. 「レビューをリクエスト（口コミを増やす）」ボタンをクリック\n5. 表示された短縮URL（`https://g.page/r/～/review` 形式）をコピー\n6. そのURLを退店フォローメール（施策_口コミ導線とGBP_2026-06-04.md のテンプレA/B）の `[Google口コミリンク]` 部分に貼る\n7. QRコードが必要な場合 → 部長（PR/集客チーム）がURL受領後にQR画像を作成\n\n> ⚠️ このリンク取得作業は社長のGアカウントが必要なため、社長が実施（または社長の画面をその場で確認して部長が代行）。\n\n---\n\n## 社長に確認/依頼が必要な点\n\n1. **GBP短縮リンクの取得**：`business.google.com` でリンクを発行 → 部長へ共有をお願いします（QRカード・退店フォローメール作成に必要）。\n2. **返信代行の許可範囲**：都度確認が原則ですが、「高評価は部長が返信文を用意して即反映してよい/低評価は必ず社長確認」等のルール化を検討いただけますか。\n3. **口コミ通知の設定確認**：GBPの通知設定（新しい口コミ→メール通知）がONになっているかご確認ください（漏れ防止）。\n"}, {"file": "施策_SNS週次投稿パック_2026-06-04.md", "cat": "施策", "title": "KÖWA SAUNA SNS週次投稿パック（2026-06-04）", "md": "# KÖWA SAUNA SNS週次投稿パック（2026-06-04）\n\n> 対象アカウント：Instagram `@kouwa.reform.sauna`（メイン） / TikTok `@kwa.sauna`（クロスポスト）\n> 作成：SNS運用チーム / 部長確認待ち事項は末尾に記載\n\n---\n\n# タスク1：TikTok再投稿「今週の即投稿パック」\n\n> 「おすすめ投稿順（最初の1週間）」（TikTok再投稿キャプション集より）をベースに選定。\n> 週数回ペース・今週（6/4週）に集中して型を作る5本セット。\n\n---\n\n## 共通手順（
