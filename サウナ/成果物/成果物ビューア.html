キャプション集にない\"実況型\"の切り口。\n\n---\n\n## 新規案B：「あなたのサウナ温度診断」保存系カルーセル\n\n**投稿フォーマット：カルーセル（フィード投稿・6〜8枚スライド）**\n**狙い：** 保存率を稼ぐ実用コンテンツ。「自分はどのタイプ？」の診断形式で参加させる。サウナ初心者・ライトユーザーが\"温度カスタムで自分もととのえる\"と思える入口になる。\n\n**表紙（スライド1）：**\n```\nあなたに合う\"サウナ温度\"、知ってる？🔥🧊\n（保存しておくと便利な診断チャート）\n```\n\n**スライド構成：**\n- スライド2：「3タイプに分けてみた」（マイルド派・スタンダード派・ガチ派）\n- スライド3：マイルド派（サウナ苦手・初心者・のぼせやすい）→ サウナ75-85℃ × 水風呂20-30℃ × 外気浴ゆっくり\n- スライド4：スタンダード派（週1-2回サウナー・整いを楽しみたい）→ サウナ90-95℃ × 水風呂12-16℃ × 外気浴10分\n- スライド5：ガチ派（週3以上・熱波師経験・もっと攻めたい）→ サウナ95-110℃ × 水風呂3-8℃（チラー最大冷却） × 短時間クール\n- スライド6：「全部、KÖWAで試せます」→ サウナ60〜110℃・水風呂3〜42℃まで自在に設定（事前連絡で対応）\n- スライド7：「\"最高の組み合わせ\"は人それぞれ。だから温度を選べる場所が必要」\n- スライド8（最後）：「宮城県大和町の完全貸切バレルサウナ KÖWA SAUNA。ご予約はプロフから」\n\n**コピペ用キャプション：**\n```\n「サウナ、好きだけどいつも同じ温度じゃ物足りない」\n「初心者だけど、水風呂が怖い…」\n\nそのモヤモヤ、温度選択で解決できます🌡️\n\nマイルド派もガチ派も、自分に合う温度が必ずある。\nKÖWAはサウナ60〜110℃・水風呂3〜42℃まで調整OK🔥🧊\n\nスライドで\"自分のタイプ\"を確かめてみて！\n→保存しておくとサ活の参考になるよ🙌\n\nKÖWA SAUNA｜完全貸切・宮城県大和町\nご予約はプロフから🔗\n```\n\n**ハッシュタグ：**\n```\n#KOWASAUNA #コーワサウナ #サウナ温度 #自在ととのい #温度が選べるサウナ #サウナ初心者 #ととのい #貸切サウナ #宮城サウナ #仙台サウナ #サ活 #保存版 #fyp #おすすめ\n```\n\n**素材・制作メモ：**\n- Canvaでカルーセル作成推奨（縦1080×1080px、3スライドは図解・残りはテキスト主体）\n- 表紙のみブランドカラー（焦げ茶・白・アースカラー系）で目を引くデザインに\n- 保管先：Google Drive「KÖWA SAUNA / SNS素材 / 2026-06-04カルーセル」\n\n**⚠️ 差別化ポイント：** 診断形式の保存系は既存キャプション集に一切なし。温度のスペック（3〜42℃）を実用情報として伝える新切り口。\n\n---\n\n## 新規案C：「温度カスタムを使ったことがない人へ、伝えます」説明系リール\n\n**投稿フォーマット：リール（縦9:16・20〜30秒・テロップ主体）**\n**狙い：** 「温度カスタムって何？どうやるの？」をゼロから説明する。認知層（まだ来店したことがない人）へのリーチを狙う。「連絡するだけでOK」のハードルの低さを伝えることで予約行動につなげる。\n\n**冒頭2秒フック（テロップ）：**\n「温度カスタムのサウナ、使い方知ってる？🌡️」\n\n**撮影・素材メモ：**\n- サウナ室の温度パネルをゆっくりパン（低温→高温の設定変化が見えると理想）\n- 水風呂チラーの操作部分をアップ（ダイヤル・数字）\n- 水温が変わる様子（氷が解ける・湯気が立つ）どちらかのカット\n- テロップのみで完結できるので既存カットの再利用でも可\n\n**構成（20〜30秒）：**\n1. フック：「温度カスタムのサウナ、使い方知ってる？」（2秒）\n2. 「KÖWAはサウナ室も水風呂も温度を自由に設定できます」（3秒）\n3. 「やり方は簡単。予約時にひと言\"温度の希望\"を添えるだけ」（4秒）\n4. サウナ温度の幅を見せる（テロップ：60℃〜110℃）（3秒）\n5. 水風呂温度の幅を見せる（テロップ：3℃〜42℃）（3秒）\n6. 「\"ぬるめが好き\"も\"極限の冷たさが好き\"も、どっちもOK」（4秒）\n7. 「宮城・大和町の完全貸切バレルサウナ KÖWA SAUNA」→ CTA（プロフへ）（4秒）\n\n**コピペ用キャプション（IG・TikTok共通ベース）：**\n```\n知らないともったいない、KÖWA SAUNAの使い方🌡️\n\n温度カスタムって難しそう？\n→ 予約時に「サウナ○℃・水風呂○℃にしてほしい」と伝えるだけ。それだけ。\n\n「ぬるめが好き」でも「ガチ冷えが好き」でも、全部対応します🔥🧊\nサウナ60〜110℃ / 水風呂3〜42℃まで調整OK。\n\n完全貸切だから、自分のペースで\"自在ととのい\"を体験してみてください☁️\n\nKÖWA SAUNA｜宮城県大和町\nご予約はプロフから🔗\n```\n\n**ハッシュタグ：**\n```\n#KOWASAUNA #コーワサウナ #温度カスタム #自在ととのい #温度が選べるサウナ #貸切サウナ #バレルサウナ #宮城サウナ #仙台サウナ #サウナ初心者 #サ活 #fyp #おすすめ #サウナ好きと繋がりたい\n```\n\n**⚠️ 差別化ポイント：** 「使い方を説明する」切り口は既存キャプション集に皆無。\"予約時にひと言で済む\"というハードルの低さの提示が、来店の一歩を踏み出させる。\n\n---\n\n---\n\n# 社長に確認が必要な点・次の一手\n\n**確認事項（3点）：**\n1. 温度カスタムの正確な連絡手順（「予約時にひと言」でOK？ CHILLNNのメッセージ欄に書けばよい？）→ 新規案Cのキャプションで触れているため確認後に数字・方法を最終化してほしい\n2. 今週の投稿スケジュール（6/9〜）で進めてよいか。6/13はインフルエンサー（@いっし）来訪日のため、その日の投稿がバッティングしないか確認を\n3. 新規案B（カルーセル）はCanvaでデザインが必要 → 「作ってほしい」一言があればすぐ着手します\n\n**次の一手：**\nTikTok本1（施設紹介）を火曜19時に投稿後、48時間で視聴数・保存数を確認。伸び筋をこの投稿パックに反映して「週次更新版」を来週月曜に出します。\n\n---\n\n> 作成：SNS運用チーム / 2026-06-04\n> 参照：`../ナレッジ/SNS運用.md` / `../ナレッジ/TikTok再投稿キャプション集.md` / `../ナレッジ/SNS投稿テンプレ・TikTok転記.md` / `SNS_バズ型投稿案_2026-06-04.md`（同フォルダ）\n"}, {"file": "施策_ホテル旅館向けブレインスリープ_DMとチラシ文案_2026-06-04.md", "cat": "施策", "title": "施策：ホテル・旅館向け ブレインスリープ寝具 営業DM文面＆チラシ文案", "md": "# 施策：ホテル・旅館向け ブレインスリープ寝具 営業DM文面＆チラシ文案\n\n> 作成：物販・BtoB営業チーム（部長直轄ライン）　2026-06-04\n> 対象：ホテル・旅館（サウナ付き宿含む）\n> 主役商材：ブレインスリープ寝具（ピロー／マットレス フロート／オーバーレイ）\n> 位置づけ：叩き台。価格表記は「税込・参考価格」注記を付す。最終表現はブレインスリープ(株)吉田貴則氏確認前提。\n> ⚠️ 本資料は社内用。客先転用前に原価・粗利欄を削除し、販促ガイドライン適合を確認すること。\n\n---\n\n## 価格前提（社長確定 2026-06-04）\n\n| 商品 | メーカー定価 | 客先販売価格（定価×90%） | 光和粗利（定価×20%） |\n|---|---|---|---|\n| ブレインスリープ ピロー | 33,000円 | 29,700円 | 6,600円/枚 |\n| マットレス フロート (S) | 88,000円 | 79,200円 | 17,600円/枚 |\n| オーバーレイ | 44,000円 | 39,600円 | 8,800円/枚 |\n| 寝具2点セット（ピロー+フロートS） | 121,000円 | 108,900円 | 24,200円/セット |\n\n⚠️ 税抜/税込の基準は最終確認中。DMおよびチラシには「税込・参考価格」と明記し断定を避ける。\n⚠️ 仕入＝定価×70%（12人以下の仕入れ数量でのスケールメリット等は吉田氏に確認）。\n\n---\n\n## 1. DM文面 3種\n\n### (a) 郵送・メール用 正式版\n\n**件名：**\n「\"よく眠れた\"が口コミになる寝具のご提案 ／ 株式会社光和工業」\n\n---\n\n【本文】\n\n[施設名] 御中\n[担当者名] 様\n\n突然のご連絡、大変失礼いたします。\n宮城県大和町を拠点にサウナ施工・ウェルネス設備の販売を手掛けております、\n株式会社光和工業と申します。\n\nこの度は、ホテル・旅館様向けに**ブレインスリープ寝具の正規代理店として**\nお取り引きのご提案に参りました。\n\n---\n\n**「よく眠れた」が次の予約をつくる、という考え方をご存じですか？**\n\n宿泊レビューサイトで「睡眠の質」は満足度に直結し、\n「枕が合わなかった」「マットが硬かった」という一言が客単価と再来率を左右します。\n\nブレインスリープの寝具は、睡眠科学に基づいた設計で開発された商品です。\nホテル・旅館様に特に喜ばれている点として、下記の3点が挙げられます。\n\n1. **丸洗いができる清潔さ**\n   ピロー・マットとも家庭洗濯機・業務洗濯機で丸洗い可能。\n   チェックアウト後の衛生管理が簡単になり、連泊・多客時期の運営コストを削減できます。\n\n2. **通気・耐水素材**\n   汗をかいても蒸れにくい素材設計。夏季や温泉後の利用でも快適です。\n\n3. **代理店特価でのご提供**\n   当社は株式会社ブレインスリープの正規代理店です。\n   定価の10%引き（参考価格・税込）でご提供可能です。\n   ・ブレインスリープ ピロー　定価33,000円 → 29,700円（税込・参考価格）\n   ・マットレス フロート（S）定価88,000円 → 79,200円（税込・参考価格）\n\n---\n\nまた、宮城県大和町の弊社貸切サウナ施設「KÖWA SAUNA」にて\n実物のご体験もご案内できます。「まず試してから導入を検討したい」という\nご要望にもお応えします。\n\nご関心がございましたら、まずはお気軽にご連絡ください。\n訪問・オンラインどちらでも対応いたします。\n\nサンプル貸し出しについては別途ご相談ください。\n\n---\n\n【お問い合わせ先】\n株式会社光和工業　物販・BtoB営業担当\n[ 担当者名 ]\nTEL：[ 電話番号 ]\nMAIL：[ メールアドレス ]\n〒981-3602 宮城県黒川郡大和町杜の丘1-10-1\n\n※本メールは当該テーマに関心をお持ちの施設様に限定してお送りしております。\nご不要の場合は上記までご連絡ください。\n\n---\n\n### (b) インスタグラムDM用 短縮版（公式アカウント宛・砕けすぎない）\n\n**件名：（件名なし。DM本文冒頭から）**\n\n---\n\nはじめまして。宮城県大和町でサウナ施工・ウェルネス設備を手掛けております、\n株式会社光和工業の[ 担当者名 ]と申します。\n\n[ 施設アカウント名 ]様の取り組みをいつも拝見しております。\n\nこの度は、**ブレインスリープ寝具の正規代理店**として、\nホテル・旅館様向けにご提案のご連絡をさせていただきました。\n\n「丸洗いできる清潔さ」「通気・耐水素材」「睡眠の質で口コミが変わる」という点で、\n宿泊施設様に特にご好評いただいております。\n代理店特価（定価の10%引き）でのご提供も可能です。\n\n詳しい資料送付・実物体験のご案内も承っております。\nご関心ございましたら、ぜひお返事いただけますと幸いです。\n\n株式会社光和工業　[ 担当者名 ]\nTEL：[ 電話番号 ]\n\n---\n\n### (c) フォロー（再送）用 短文\n\n**件名：**\n「先日ご案内した寝具のご提案、改めてご連絡いたします ／ 光和工業」\n\n---\n\n[ 担当者名 ] 様\n\n先日、ブレインスリープ寝具のご提案資料をお送りした\n株式会社光和工業の[ 担当者名 ]です。\n\nご多忙の折、ご確認いただけていなければ恐縮ですが、\n改めてご連絡させていただきました。\n\n実物のお試しやサンプルのご確認など、\nご都合の良い形でご対応します。\n\n10分程度のオンライン面談でも歓迎です。\nご都合をお聞かせいただければ幸いです。\n\n株式会社光和工業　[ 担当者名 ]\nTEL：[ 電話番号 ]\n\n---\n\n## 2. チラシ文案・構成案（A4想定／Canvaデザイン用）\n\n> Canva担当（SNSチーム）が起こせるよう、エリア別に文言・配置指示を記載する。\n> 配色はブレインスリープの公式ブランドカラー（ダークネイビー・ホワイト系）に準拠し、\n> 光和ロゴとの共存ルールは吉田氏に確認してから最終化すること。\n\n---\n\n### キャッチコピー案（3種）\n\n案1（口コミ訴求）：\n**「\"よく眠れた\"が口コミになる宿へ。」**\nサブ：洗える。蒸れない。また泊まりたくなる寝具。\n\n案2（清潔訴求）：\n**「業務洗濯で丸洗いできる寝具が、ここにある。」**\nサブ：チェックアウトのたびに清潔。連泊・多客も怖くない。\n\n案3（差別化訴求）：\n**「枕1つで、また来たくなる宿になる。」**\nサブ：睡眠科学に基づいた回復寝具を、代理店特価でお届けします。\n\n---\n\n### チラシ構成レイアウト（A4縦）\n\n```\n┌─────────────────────────────────────────┐\n│  [エリアA: 上部1/3 ─ ファーストビュー]        │\n│                                          │\n│  キャッチコピー（上記3案から1つ選択）          │\n│  フォント：大きめ・太字。背景：ダークネイビー    │\n│  商品写真1枚（ピロー＋フロートを並べた静物）    │\n│    → ブレインスリープ公式提供素材を使用         │\n│  光和工業ロゴ（右上隅）                       │\n├─────────────────────────────────────────┤\n│  [エリアB: 中部1/3 ─ 3大ベネフィット]         │\n│                                          │\n│  ベネフィット1：「よく眠れた口コミ」            │\n│    アイコン(口コミ・星)                       │\n│    文言：「睡眠の質が変わると、口コミが変わる。   │\n│    \"枕が良かった\"の1行が次の予約をつくります。」  │\n│                                          │\n│  ベネフィット2：「丸洗いで清潔」               │\n│    アイコン(洗濯機・雫)                       │\n│    文言：「ピローもマットも業務洗濯機で丸洗いOK。 │\n│    汚れを気にせず、清潔を保てます。」            │\n│                                          │\n│  ベネフィット3：「通気・耐水素材」              │\n│    アイコン(風・温泉)                         │\n│    文言：「汗をかいても蒸れにくい。            │\n│    温泉・サウナ後の休憩や外気浴にも最適。」       │\n│                                          │\n├─────────────────────────────────────────┤\n│  [エリアC: 下部1/3 ─ 価格・体験・導線]        │\n│                                          │\n│  価格の見せ方：                             │\n│    「正規品を代理店特価でご提供」               │\n│    ブレインスリープ ピロー                     │\n│      定価33,000円 → 29,700円               │\n│    マットレス フロート（S）                    │\n│      定価88,000円 → 79,200円               │\n│    2点セット（ピロー+フロートS）                │\n│      定価121,000円 → 108,900円             │\n│    ※税込・参考価格。まとめてのご相談も承ります。  │\n│                                          │\n│  体験ショールーム導線：                       │\n│    「KÖWA SAUNAで実物をご体験いただけます」     │\n│    住所：宮城県黒川郡大和町杜の丘1-10-1        │\n│    小さな宿写真orKÖWA外観写真（1枚）          │\n│                                          │\n│  QRコード（右下）                           │\n│    → 問い合わせLPまたは光和工業HPへ           │\n│                                          │\n│  問い合わせ先：                             │\n│    株式会社光和工業　物販・BtoB営業           │\n│    TEL：[ 電話番号 ]                        │\n│    MAIL：[ メールアドレス ]                   │\n│                                          │\n├─────────────────────────────────────────┤\n│  [フッター注記エリア ─ 小さな文字で]           │\n│  「本資料に記載の価格は参考価格（税込）です。    │\n│  実際の価格・仕様は個別にお見積りします。        │\n│  ブレインスリープ製品は株式会社ブレインスリープ   │\n│  の正規品です。掲載写真・商品説明は公式情報に    │\n│  準拠していますが、医療的効能を保証するものでは  │\n│  ありません。詳しくはお問い合わせください。」     │\n└─────────────────────────────────────────┘\n```\n\n---\n\n### サウナ付き宿向け追加エリア（オプション：裏面またはフライヤー別紙）\n\nサウナ付き・温浴付きの旅館・宿向けには下記を追加する。\n\n文言：\n「サウナがある宿なら、3点セットがあります。\nサウナ（加熱・施工）＋チラー水風呂＋ブレインスリープ寝具を\n一括でご提案・施工します。\nKÖWAで実物体験もどうぞ。」\n\n配置：ベネフィットエリアCの下にボックスで追加。背景色を変えて目立たせる。\n\n---\n\n## 3. 想定問答（旅館・ホテル特有）\n\n### Q1：客室に置けますか？普通のベッドに使えますか？\n\n**A（回答）：**\nブレインスリープ マットレス フロートは、既存のベッドフレーム・マットレスの上に重ねて使うオーバーレイ設計と、単独でご使用いただけるスタンドアロン設計があります。\nオーバーレイはベッド構成を変えずに現在の設備のまま導入できるため、\n大規模な改装なしに客室にご導入いただけます。\nご施設の客室タイプ（シングル・ツイン・和室 等）に合わせた仕様を個別にご相談ください。\n⚠️ 具体的な客室適合確認はブレインスリープ(株)吉田氏に確認する（床板の耐荷重・既存ベッドとの組み合わせ）。\n\n---\n\n### Q2：業務洗濯機の頻度に耐えますか？耐久性はどのくらいですか？\n\n**A（回答）：**\nブレインスリープ ピローは丸洗い対応を前提に設計されており、\n一般的な業務洗濯での繰り返し使用に対応しています。\n洗濯表示に基づいた適切な温度・脱水設定でご使用ください。\n耐用回数・保証内容の詳細については、ご発注前に正式仕様書でご確認いただきます。\n⚠️ 業務洗濯での具体的な耐久回数データは吉田氏に確認する。\n\n---\n\n### Q3：まとめ買いの割引はありますか？\n\n**A（回答）：**\n通常は定価の10%引きでのご提供です（参考価格）。\nまとまった数量でのご発注の場合は、別途ご相談に応じます。\n数量・仕様・納期を合わせてご相談ください。\n⚠️ ロット割引の有無・条件はブレインスリープ(株)に確認する（仕入条件次第）。\n\n---\n\n### Q4：サンプルは借りられますか？まず試してから判断したい。\n\n**A（回答）：**\n宮城県大和町の弊社施設「KÖWA SAUNA」にて、実際の商品を体験していただけます。\n宿泊・サウナ体験のついでにご確認いただくことも可能です。\n（事前にご連絡ください。）\n貸し出しサンプルについては現在調整中ですが、\n少量のトライアル購入からのご相談にも応じています。\n⚠️ サンプル貸し出し在庫の確保は未定。吉田氏に「貸し出し機材の有無」を確認する。\n\n---\n\n### Q5：正規品の証明はありますか？偽物を心配しています。\n\n**A（回答）：**\n株式会社光和工業は株式会社ブレインスリープの正規代理店です。\n正規品である旨の証明書・取引確認書の発行については、\nご要望に応じて対応いたします。\n\n---\n\n### Q6：和室（布団スタイル）の旅館でも使えますか？\n\n**A（回答）：**\nブレインスリープ ピローは和布団スタイルにもご使用いただけます。\nマットレスについては和室の床敷きでの利用について、適合仕様を個別に確認させてください。\n⚠️ 和室フローリング・畳敷き対応の確認は吉田氏へ。\n\n---\n\n## 4. 補助金候補（提案に添える）\n\n> 補助金台帳（`成果物/台帳_補助金_2026-06.md`）との連動。\n> 顧客への提案時は「候補」として提示し、最新公募要領の再確認を必ず促すこと。\n\n| # | 補助金名 | 内容 | 当社案件との接点 | 状況 |\n|---|---|---|---|---|\n| A | 小規模事業者持続化補助金（一般型） | 販路開拓・設備・広告費。補助率2/3・上限50万 | 小規模宿泊施設がアメニティ強化・客室備品として導入する場合 | 2026年11月受付開始予定。顧客へ今から準備促進 |\n| B | ものづくり補助金 | 設備投資・革新的サービス開発。補助率1/2〜2/3・上限750万〜 | 宿泊施設の客室設備投資（新サービス開発として）※少額品目への適用は要確認 | 次回公募時期要確認 |\n| C | 新事業進出補助金 | 自社初の新市場・新サービス。補助率1/2・上限2,500万〜 | リフォーム業・サウナ施工業が「宿泊ウェルネス設備」に新規参入する顧客 | 第4回締切2026-06-19 残りわずか |\n\n⚠️ 寝具単体は「省エネ設備」「IT設備」には該当しないため、#3省エネ補助金・#4IT補助金は対象外。\n⚠️ 介護施設向けであれば「介護・福祉系補助金（地域医療介護総合確保基金等）」が有力候補（台帳#8参照）。\n\n---\n\n## 5. 確認事項と次の一手（部長へ）\n\n### ⚠️ 未確定・要確認 一覧\n\n| # | 確認先 | 内容 | 優先度 |\n|---|---|---|---|\n| 1 | ブレインスリープ(株)吉田貴則氏 | **価格の税抜/税込基準の確定**。現状は社長方針を税込として扱っているが正式確認必要 | 高（DM・チラシ発送前に必須） |\n| 2 | ブレインスリープ(株)吉田氏 | **チラシ・DM文面の表現承認**（販促ガイドライン適合チェック）。特に「睡眠科学に基づく」「回復睡眠」の表現可否 | 高（客先出し前に必須） |\n| 3 | ブレインスリープ(株)吉田氏 | **業務洗濯対応の耐久データ・仕様書**。旅館・ホテルの想定問答Q2で必要 | 中（商談が具体化したら） |\n| 4 | ブレインスリープ(株)吉田氏 | **ロット割引・数量条件**。まとめ買い提案が出た場合に必要（Q3） | 中 |\n| 5 | ブレインスリープ(株)吉田氏 | **サンプル貸し出し品の有無・条件**（Q4） | 中 |\n| 6 | ブレインスリープ(株)吉田氏 | **チラシ使用可能な公式写真・ブランドガイドライン**（Canvaデザイン前に必要） | 高（デザイン着手前に必須） |\n| 7 | 社長 | **光和側の問い合わせ先（TEL・MAIL）の確定**。DMの[ ]プレースホルダを埋める | 高 |\n| 8 | 社長 | **DM送付先リストの有無・入手方法**。旅館・ホテルの名簿はTravelMate系/JRN/観光協会から取れるが、当社ルートの確認 | 中 |\n| 9 | SNSチーム | **インスタDMの送付元アカウント確認**（KÖWA SAUNAのIG公式 or 光和工業の別アカ） | 中 |\n\n---\n\n### 次の一手（部長へ1つ）\n\n**最優先：吉田氏へ連絡して「表現確認・写真素材・税込税抜」を3点まとめて聞く**\n\nこのDM・チラシは吉田氏から「GO」をもらわないと客先に出せない。\n早ければ1回のメール・電話で3点まとめて確認できる。\n吉田氏への問い合わせ下書きは `成果物/下書き_ブレインスリープ本社問い合わせ_2026-06-04.md` に雛形がある。\n今回追加確認すべき項目（税込税抜・チラシ表現・写真・業務洗濯耐久データ）を\nそのメールに追記して1通で送るのが最速。\n\n> 部長への自発提案：\n> 旅館・ホテルへのDMと並行して、KÖWA SAUNAを体験した宿泊施設オーナー・\n> 関係者への口コミルートも有効。「泊まりに来たホテルオーナーが導入」という\n> 事例は最もリアルなクチコミになる。体験予約時のアンケート(職業/業種)を\n> 1行追加するだけで見込み客の自動スクリーニングになる。\n> → SNSチームと集客PRチームに「業種別フォロー導線の検討」を連携すると良い。\n\n---\n\n*保存：`サウナ/成果物/施策_ホテル旅館向けブレインスリープ_DMとチラシ文案_2026-06-04.md`*\n*作成チーム：物販・BtoB営業（部長直轄）*\n*次回更新：吉田氏確認後、⚠️項目を埋めて v2 として上書き*\n"}, {"file": "施策_ホテル旅館向けブレインスリープ_インスタ投稿案_2026-06-04.md", "cat": "施策", "title": "施策：ホテル・旅館向けブレインスリープ BtoB インスタ投稿案", "md": "# 施策：ホテル・旅館向けブレインスリープ BtoB インスタ投稿案\n\n> 作成：SNS運用チーム　2026-06-04\n> 目的：ホテル・旅館への**ブレインスリープ寝具BtoB販売**のための Instagram 発信 + DM誘導導線\n> 位置づけ：叩き台。文言の最終版は物販チームのDM・チラシ文案を受けて統合する。\n> ⚠️ 誇大NG・医療効能の断定NG。ブレインスリープ販促ガイドライン最終確認後に公開。価格は「税込・参考」注記必須。\n\n---\n\n## 0. 発信の軸（BtoB版）\n\n| 軸 | メッセージ |\n|---|---|\n| 主役 | ブレインスリープ寝具（ピロー・マットレス フロート） |\n| 訴求の核 | **\"よく眠れた\"が口コミになる宿**を作れる |\n| 差別化 | 丸洗い×耐水通気×睡眠科学＋光和は正規代理店＋KÖWA SAUNAで実物体験可 |\n| 行動導線 | 投稿で興味喚起 → **アカウントにDM** → KÖWA SAUNA体験 → 商談 |\n| 価格訴求 | 定価の90%（代理店特価）。ピロー29,700円／フロート(S)79,200円／2点108,900円（税込・参考） |\n\n---\n\n## 1. フィード投稿案（カルーセル構成）\n\n### 投稿案A「\"よく眠れた\"が口コミになる」\n\n**ゴール：** 宿泊施設オーナーの「睡眠＝レビュー」課題に刺さる\n\n**カルーセル構成（5枚）**\n\n| スライド | 見出し | サブテキスト |\n|---|---|---|\n| 1（表紙） | \"よく眠れた\"が、レビューになる。 | 宿泊体験を変える寝具、ご紹介します |\n| 2 | 睡眠の質が、宿の評価を決める時代 | 口コミに「ぐっすり眠れた」が増える宿と増えない宿、差はどこにあるのか |\n| 3 | 丸洗いOK。連泊・多客に強い清潔さ | 多忙な運営でも衛生管理が楽に。お客様に清潔な寝具を毎回提供できます |\n| 4 | 睡眠科学に基づく回復の眠り | ブレインスリープのピロー・マットレスで、寝た翌日の「また来たい」を生む |\n| 5 | 光和工業は正規代理店。体験できます | KÖWA SAUNA（大和町）で実物をお試しいただけます。まずはDMをどうぞ |\n\n**キャプション（案）**\n\n```\n宿の口コミに「よく眠れた」が増えたら、どうなると思いますか？ 🌙\n\n寝具1つで、宿泊体験は大きく変わります。\n\nブレインスリープのピロー・マットレスは\n✅ 丸洗いできる清潔さ（連泊・多客にも安心）\n✅ 通気性が高く蒸れにくい素材\n✅ 睡眠科学に基づく設計で、翌朝の回復感が違う\n\n光和工業はブレインスリープの正規代理店。\n宮城県大和町の KÖWA SAUNA で実物を体験いただけます。\n\n導入のご相談・体験のご予約は、\nプロフィールのリンク、またはDMからどうぞ📩\n\n※価格は税込・参考。ブレインスリープの販促ガイドラインに基づいて表示しています。\n```\n\n**ハッシュタグ**\n\n```\n#ブレインスリープ #brainsleep #ホテル備品 #旅館備品 #宿泊施設 #睡眠の質\n#よく眠れた #回復睡眠 #丸洗い寝具 #光和工業 #KOWASAUNA #宮城 #仙台\n#BtoB #ホテル経営 #旅館経営 #口コミ #宿泊体験\n```\n\n---\n\n### 投稿案B「丸洗いできる寝具が、運営を変える」\n\n**ゴール：** 清潔管理・運営効率に課題を感じているオーナーへ\n\n**カルーセル構成（4枚）**\n\n| スライド | 見出し | サブテキスト |\n|---|---|---|\n| 1（表紙） | 丸洗いできる寝具が、運営を変える。 | 多客・連泊に強い清潔さ |\n| 2 | 多忙な運営ほど、洗える寝具が効く | 従来の寝具は洗いにくく、汚れると交換コストがかかる。丸洗いOKなら、管理が楽に |\n| 3 | 通気・耐水素材で、蒸れ・ニオイも軽減 | お客様の快適さと、客室の衛生を同時に守る |\n| 4 | 正規代理店の光和工業へ、まずDMを | 宮城・仙台エリアの宿泊施設様、体験会も随時開催中 |\n\n**キャプション（案）**\n\n```\n「寝具の衛生管理、どうしてますか？」🛏️\n\n多客・連泊シーズン、一番困るのが寝具のケアではないでしょうか。\n\nブレインスリープのマットレス・ピローは\n✅ 丸洗いができる（高耐久・形崩れしにくい）\n✅ 通気性の高い素材で蒸れにくく、ニオイが残りにくい\n✅ 耐水加工で急な対応もしやすい\n\n清潔な寝具は、お客様の満足度に直結します。\n\n光和工業（正規代理店）では、導入前の体験も歓迎。\nKÖWA SAUNA にお越しいただき、実際に触れてご確認ください。\n\nお問い合わせは DMまたはプロフィールリンクから📩\n\n※価格は税込・参考。詳細はDMで。\n```\n\n**ハッシュタグ**\n\n```\n#丸洗い寝具 #ブレインスリープ #旅館備品 #ホテル備品 #宿泊施設の悩み\n#衛生管理 #連泊対応 #通気素材 #光和工業 #KOWASAUNA #宮城 #仙台\n#施設備品 #寝具導入 #BtoB営業\n```\n\n---\n\n### 投稿案C「サウナのあとの眠りが、宿の強みになる」\n\n**ゴール：** サウナ付き旅館・グランピング施設への3点セット訴求\n\n**カルーセル構成（4枚）**\n\n| スライド | 見出し | サブテキスト |\n|---|---|---|\n| 1（表紙） | サウナのあとの眠りが、宿の強みになる。 | ととのい＋回復睡眠で差別化 |\n| 2 | ととのった体に、最高の眠りを | サウナで緩んだ自律神経をそのまま睡眠につなぐ。翌日の満足感が変わります |\n| 3 | 3点セットで「体験コース」を作れる | サウナ・水風呂・ブレインスリープ寝具。光和工業は3点とも正規取扱 |\n| 4 | KÖWA SAUNAで体験から商談まで | 実際に体験してから導入を検討。まずはDMください |\n\n**キャプション（案）**\n\n```\n「ととのった」の次を、どう演出していますか？ 🔥🧊🌙\n\nサウナ付きの宿なら、眠りまで設計すると\nリピーターが増えます。\n\n光和工業がご提案する「3点セット」：\n1. サウナ（バレル・CUBE・kokolo等）\n2. チラー水風呂（温度コントロールで\"毎回同じととのい\"）\n3. ブレインスリープ寝具（回復睡眠で翌日のパフォーマンスも変わる）\n\nブレインスリープは正規代理店として代理店特価でご提供。\n3点まとめて、施工・設置まで光和工業にお任せください。\n\nKÖWA SAUNA（宮城県大和町）で実物体験できます。\nDM・お問い合わせをお待ちしています📩\n\n※価格は税込・参考。\n```\n\n**ハッシュタグ**\n\n```\n#サウナ付き旅館 #グランピング #ととのい #回復睡眠 #ブレインスリープ\n#チラー水風呂 #3点セット #ウェルネス施設 #光和工業 #KOWASAUNA\n#宮城 #仙台 #サウナ好き #BtoB #施設備品 #宿泊体験\n```\n\n---\n\n## 2. リール案（BtoB訴求・実体験動画）\n\n### リール案「KÖWA SAUNAで実際に体験できます」\n\n**目的：** 体験ショールームとしてのKÖWA SAUNAを見せる。見た施設オーナーが「行ってみよう」と思う構成。\n\n**尺：** 30〜45秒\n\n**構成（テロップ付き）**\n\n| 秒数 | 映像 | テロップ |\n|---|---|---|\n| 0〜3秒（フック） | バレルサウナの外観 or 水風呂の水しぶき | 「この寝具、ホテルに置きませんか？」 |\n| 3〜10秒 | ブレインスリープのマットレス・ピローのクローズアップ（KÖWA SAUNA内） | 「丸洗いOK・通気素材・睡眠科学設計」 |\n| 10〜20秒 | ととのいスペースで実際に横になる場面 | 「サウナ後に使うととのいマットとしても、着替え後の仮眠ベッドとしても」 |\n| 20〜30秒 | KÖWA SAUNAの外観・住所テロップ | 「宮城県大和町のKÖWA SAUNAで実物体験できます」 |\n| 30〜45秒 | ロゴ＋連絡先 | 「ご導入の相談はDMへ。光和工業 正規代理店」 |\n\n**キャプション（案）**\n\n```\nホテル・旅館の備品担当様へ 🏨\n\n「寝具を変えたら口コミが変わった」——そんな宿を作りませんか？\n\nKÖWA SAUNA（宮城県大和町）では\nブレインスリープのマットレス・ピローを実際に体験できます。\n\n丸洗いできる清潔さ、通気性、回復睡眠——\n数字より、まず体で感じてください。\n\n導入相談・体験予約はDMまたはリンクから📩\n\n#ブレインスリープ #ホテル備品 #旅館備品 #回復睡眠 #光和工業 #KOWASAUNA #宮城 #BtoB\n```\n\n---\n\n## 3. ストーリーズ案（DM誘導導線）\n\n### ストーリーズ案「ご相談、DMで受け付けています」\n\n**目的：** フィード投稿・リールを見た施設担当者をDMに誘導する。気軽に動けるよう「ハードルを下げた誘導」にする。\n\n**スライド構成（3枚）**\n\n**1枚目（問いかけ）**\n- 背景：深めのネイビー or ダークグリーン\n- テキスト大：「宿の口コミに\"よく眠れた\"って書かれてますか？」\n- テキスト小：「タップして次へ」\n\n**2枚目（訴求）**\n- テキスト大：「寝具1つで、変わります」\n- 箇条書き：「丸洗いOK / 通気素材 / 代理店特価」\n- テキスト小：「光和工業はブレインスリープ正規代理店」\n\n**3枚目（誘導）**\n- テキスト大：「まずDMください。無料で相談受け付けています」\n- DMリンクスタンプ\n- テキスト小：「KÖWA SAUNA（大和町）で実物体験も可能です」\n\n**運用メモ：**\n- フィード投稿のシェアをストーリーズに流す（投稿→ストーリーズ共有機能）\n- 「DM送信」スタンプを入れる\n- 週1回程度、フォロワーが施設関係者に増えてきたら継続配信\n\n---\n\n## 4. 「投稿で見せる→DMへ」運用フロー\n\n```\n[インスタ フィード/リール投稿]\n  訴求：寝具の強み・体験ショールーム・価格帯の示唆\n  頻度：週1〜2本（BtoBターゲットに特化した投稿は月2〜3本を目安）\n        ↓\n[ストーリーズ（既存投稿のシェア＋DM誘導）]\n  目的：フォロワーに「DMしやすい空気」を作る\n  頻度：投稿日翌日に連動してストーリーズシェア\n        ↓\n[DM着信]\n  対応：部長 or 社長が返信（テンプレ参照）\n  目標：KÖWA SAUNA体験への誘導\n        ↓\n[KÖWA SAUNA 体験]\n  ブレインスリープ実物体験（サウナも含めた3点体験）\n  → 商談・見積提出へ\n```\n\n**DM返信テンプレ（1通目）**\n\n```\nご連絡ありがとうございます！\nブレインスリープ寝具のご関心、とても嬉しいです😊\n\n光和工業は正規代理店として、ホテル・旅館様への\n導入サポートをしております。\n\nまずは宮城県大和町の KÖWA SAUNA に\nお気軽にお越しください。\n実際にマットレス・ピローを体感していただけます。\n\nご都合のよい日時をお知らせいただければ、\n体験の調整をさせていただきます。\n\nどうぞよろしくお願いします！\n光和工業 [担当者名]\n```\n\n---\n\n## 5. Canva ビジュアル（作成結果）\n\n### 作成結果\n\nCanva MCP で以下の2点を**実際に生成・保存**しました。\n\n| 種別 | タイトル | Canva 編集URL | 備考 |\n|---|---|---|---|\n| インスタ投稿画像（1080x1350px） | Instagram投稿 - 「良質な睡眠は、宿泊レビューを変える」 | https://www.canva.com/d/YmVamrrq9_GogvG | 叩き台。文言・配色は編集で調整 |\n| A4 チラシ（フライヤー） | チラシ - BrainSleep Premium 寝具で快眠を | https://www.canva.com/d/OSurjxq2He_pS4c | 叩き台。価格・連絡先は要差し込み |\n\n**生成候補（保存しなかった追加案）**\n\nインスタ投稿の追加候補（社長・部長が好みで選べます）：\n- 候補2: https://www.canva.com/d/-G63Pp6AejDvR8o\n- 候補3: https://www.canva.com/d/f0GsHgBukv8byVO\n- 候補4: https://www.canva.com/d/Bj_zACs1iSF9whD\n\nチラシの追加候補：\n- 候補2: https://www.canva.com/d/qgTsZyCgIx_QGZK\n- 候補3: https://www.canva.com/d/6Tt_7FXd4oRraIi\n- 候補4: https://www.canva.com/d/4LgyJ7dtMNQ5fth\n\n### Canva デザイン指示書（手動編集用・要点）\n\n上記の叩き台を社長・部長が編集する際の指示メモ：\n\n**インスタ投稿画像**\n- サイズ：1080×1350px（縦型4:5）\n- 配色：深ネイビー（#1a2744）/ クリーム（#f5f0e8）/ ゴールドアクセント（#c8a96e）\n- フォント：見出しはセリフ系（高級感）／本文はゴシック（視認性）\n- 要差し込み：ブレインスリープ製品写真（公式から取得・使用許可確認）/ 価格テキスト（税込・参考の注記）/ @kouwa.reform.sauna のアカウント名\n\n**A4 チラシ**\n- サイズ：A4（210×297mm）/ 塗り足し3mm追加\n- 要差し込み：光和工業ロゴ / ブレインスリープ製品写真・ロゴ（使用許可確認） / 価格（税込・参考） / 連絡先（TEL・メール・Instagram）/ QRコード（Instagramアカウント or KÖWA SAUNA予約ページ）\n- ⚠️ ブレインスリープのロゴ・写真使用は**正規代理店契約の範囲内でガイドラインに従う**こと\n\n---\n\n## 6. ⚠️ 確認が必要な事項\n\n| # | 確認事項 | 理由 |\n|---|---|---|\n| 1 | ブレインスリープの**販促ガイドライン**（ロゴ・写真・表現のルール） | 投稿・チラシで使う前に確認が必須 |\n| 2 | 「睡眠科学に基づく」「回復睡眠」等の表現の可否 | 誇大・医療効能断定にならないかの最終確認 |\n| 3 | 製品写真の**使用許諾**（公式素材の転用可否） | インスタ・チラシへの掲載前に確認 |\n| 4 | 価格の**表示基準**（税込/税抜の明示・定価の90%表記方法） | 不当景品類及び不当表示防止法への対応 |\n| 5 | インスタのターゲット設定（BtoBなら法人フォロワーへリーチするため**スポンサード広告**も検討） | 有機投稿だけでは施設担当者にリーチしにくい可能性あり |\n\n---\n\n## 7. 自己採点\n\n| 評価軸 | 点数 | コメント |\n|---|---|---|\n| BtoB訴求の的確さ | 90/100 | \"よく眠れた口コミ\"・丸洗い・正規代理店の3軸は刺さる構成 |\n| 文体・トーン | 85/100 | フレンドリー寄りにしたが、BtoBなので適度に品格を保っている。社長好みかは要確認 |\n| Canvaビジュアル | 75/100 | 叩き台は生成完了。製品写真・価格・ロゴ差し込みが未完で、そこが完成度の鍵 |\n| 運用フローの具体性 | 88/100 | DM返信テンプレ・ストーリーズ連動まで整理済み |\n\n> 作成：SNS運用チーム → 次アクション：社長にCanvaデザインを確認いただき、ブレインスリープ販促ガイドラインの制約を踏まえた文言最終確認を部長経由で依頼する。\n"}, {"file": "施策_公式LINE開設キット_2026-06-04.md", "cat": "施策", "title": "公式LINE 開設＆運用キット（2026-06-04 社長アイデア → 部長プラン）", "md": "# 公式LINE 開設＆運用キット（2026-06-04 社長アイデア → 部長プラン）\n\n> 社長アイデア：店舗来店者を公式LINEに案内し、リピートクーポン・継続的な情報発信・予約動線をLINEから作りたい（現状 公式LINEなし→新規）。\n> 部長評価：**強く推奨**。完全貸切・1日2組・高単価の業態は、メール/SMSより公式LINEがリピート/CRMに最適。会議で出た「リピート施策ゼロ」「退店フォロー導線」を一本化できる。\n\n---\n\n## なぜ公式LINEが正解か（部長の評価）\n- リピートが生命線の貸切業態で、**再来店を促す常設チャネル**になる（友だち＝見込みリピーター名簿）。\n- **クーポン／ショップカード（スタンプ）** で「3回来店で特典」等を自動運用（会議のCS案がそのまま実装できる）。\n- **リッチメニュー**から料金・アクセス・温度カスタム説明・**CHILLNN予約**へ常時導線。\n- IG/TikTok/GBPの全集客の“受け皿”になり、フォロワー→友だち→予約の流れが繋がる。\n- ⚠️ ただし予約の**真実源はGoogleカレンダー／CHILLNN**。LINEは「集客・リピート・告知・導線」レイヤーで、予約実体はCHILLNNへ送る（二重管理しない）。\n\n---\n\n## 開設手順（無料で始められる）\n1. **LINE Official Account Manager**（`manager.line.biz`）で公式アカウント作成。**フリープラン（月200通まで無料）**で開始。\n   - ⚠️ アカウント作成・電話/メール認証・パスワード入力は **社長または美慧専務が実施**（AIは認証情報を扱わない＝安全ルール）。部長は設定内容を全て用意。\n2. アカウント名「KÖWA SAUNA」、アイコン＝既存ロゴ、基本情報（住所・営業時間・予約リンク）。\n3. **応答モード**：基本「Bot（自動応答）」＋営業対応時間だけ「チャット」に切替、が省力。\n4. 下記コンテンツを設定 → 友だち追加導線を各所に設置 → 運用開始。\n\n---\n\n## 初期設定コンテンツ（コピペ）\n\n### あいさつメッセージ（友だち追加直後に自動送信）\n```\n友だち追加ありがとうございます🧖‍♀️ KÖWA SAUNAです！\n完全貸切・温度ぜんぶ自分好みの“自在ととのい”をどうぞ☁️🔥🧊\n\n🎁 友だち限定クーポンを下に貼っています。次回ぜひお使いください！\nご予約はメニューの「予約する」から（CHILLNN）。\n温度カスタムのご希望はこのトークで気軽にどうぞ😊\n```\n\n### リッチメニュー（6枠の構成案）\n| 予約する(CHILLNN) | 料金・プラン | アクセス |\n| 温度カスタムとは | クーポン | お問い合わせ(トーク) |\n- 「予約する」→ `https://www.chillnn.com/ja/19c7a1b53493d2`\n- 「温度カスタムとは」→ サウナ60-110℃/水風呂3-42℃の説明（自在ととのい）\n\n### クーポン（2種）\n- **友だち追加クーポン**：「次回オプション1つ無料」or「ワンドリンクサービス」（値引きより体験を厚く＝会議のCS方針）\n- **リピータークーポン**：来店後に配布「次回また使えるクーポン」\n\n### ショップカード（スタンプ）\n- 来店1回=1スタンプ、**3個で特典**（例：カスタム温度の事前連絡優先 / ドリンク無料）。会議CS案「3回で常連特典」と一致。\n\n### 配信（月2〜4通・フリー枠200通内）\n- ネタ例：季節の温度提案／新しいととのいチェア／空き枠のお知らせ／お客様の声紹介。\n- ⚠️ 友だちが増えて200通/月を超えそうになったら有料（ライト ¥5,000/月〜）を検討。\n\n---\n\n## 友だち追加の導線（ここが一番大事）\n- **店内QR**：退店時に「次回クーポンお渡しします、よかったらLINEを」と一言（口コミQRと同じ1枚に同居）。\n- **Instagramプロフィール／TikTok @kwa.sauna のbio** にLINEリンク。\n- **GBP**：投稿・説明文にLINE友だち追加を案内。\n- **CHILLNN予約完了メール／退店フォロー**：LINE案内を添える。\n\n---\n\n## 退店フォロー導線（①施策）との統合\n従来「メール/SMSで送信」としていた退店フォローを、**LINEに一本化**するのが理想：\n1. 退店時カード（QR2つ）：**①Google/サウナイキタイ口コミ ②LINE友だち追加**\n2. LINE追加→あいさつ＋クーポン自動送信（手動送信すら不要に＝省力化）\n3. 以後、ショップカードと配信で自然にリピート化\n→ `施策_口コミ導線とGBP_2026-06-04.md` の送信テンプレは「LINE未追加の方向けメール/SMS」として併用。\n\n---\n\n## 役割分担\n- **社長/美慧専務**：アカウント作成・認証（AIは関与しない）。最終文面の承認。1対1トークの対応。\n- **部長(AI)**：上記コンテンツの用意・改訂、リッチメニュー構成、クーポン/配信文面、導線QLカードのCanvaコピー、IG/TikTok/GBPへのLINE導線反映の下準備。\n\n---\n\n## ⚠️ 注意（混同しないこと）\n- これは **LINE公式アカウントの標準機能** を使う運用。過去に停止した Cowork のLINE下書きbot（`kowa`系・dedupe不具合）とは**別物**で、あれは再有効化しない。\n- 予約の二重管理をしない（真実源＝Googleカレンダー/CHILLNN、LINEは導線）。\n- 個人情報・トーク内容は最小限に扱う。\n"}, {"file": "施策_口コミ導線とGBP_2026-06-04.md", "cat": "施策", "title": "着手施策：①退店フォロー＆口コミ導線 ／ ②GBP/MEOてこ入れ（2026-06-04 社長GO）", "md": "# 着手施策：①退店フォロー＆口コミ導線 ／ ②GBP/MEOてこ入れ（2026-06-04 社長GO）\n\n> アイデア会議(`アイデア会議録_2026-06-04.md`)の「まず動く5つ」から、社長が①②を選択。\n> 本ファイル＝コピペで使える実物（テンプレ・GBP最適化内容）。トーンはフレンドリー・絵文字OK。\n\n---\n\n# ① 退店フォロー ＆ 口コミ導線（CS＋SNS）\n\n## 運用フロー（最小・新ツール不要）\n1. 退店時：美慧専務が「当日の設定(サウナ◯℃/水風呂◯℃/使ったチェア)」をメモ（顧客リストの温度メモ欄へ）。\n2. 退店当日〜翌朝：下のテンプレを **予約メールへの返信 or SMS** で送信（LINE公式は未運用のため当面これ）。\n3. 店内には **口コミQRカード** を設置（お見送り時に一言「よかったら…」）。\n4. 届いた口コミ/タグ付けには **必ずフレンドリーに返信**＋（許諾のうえ）ストーリー再掲。\n\n## 送信テンプレ（コピペ可・◯は実値に置換）\n\n**A. 初回のお客様**\n```\n本日はKÖWA SAUNAをご利用いただき、ありがとうございました🧖‍♀️\n今日はサウナ◯℃ × 水風呂◯℃、◯◯チェアでのととのい、いかがでしたか?☁️\n当店は温度も水風呂も“自分好み”に変えられるので、次回はぜひ違う組み合わせも試してみてください🔥🧊\nよろしければ、感想を一言いただけると本当に励みになります🙏\n▶ Googleの口コミ：[Google口コミリンク]\n▶ サウナイキタイ：https://sauna-ikitai.com/saunas/114736\nまたのお越しを心よりお待ちしております！\n```\n\n**B. リピーターのお客様**\n```\n本日もありがとうございました🙌 いつも来てくださって嬉しいです！\n今日はサウナ◯℃ × 水風呂◯℃でしたね。前回との違い、楽しんでいただけましたか?😊\n次回「前回の◯℃で」もご用意できますので、お気軽にお申し付けください🔥\nよろしければ最近の感想も…▶ [Google口コミリンク]\n```\n\n**C. 口コミ御礼（投稿してくれた方へ）**\n```\n口コミありがとうございます…！🥹 「◯◯◯」のお言葉、スタッフ一同で読ませていただきました。\n温度を自由に組み合わせる“自在ととのい”、これからも磨いていきます🔥 またのご来店お待ちしてます！\n```\n\n## 店内QRカードの文言（Canvaで作成）\n```\nととのいましたか？☁️\nよかったら、感想をひとことお願いします🙏\n［Google口コミ QR］　［サウナイキタイ QR］\n#KOWASAUNA で投稿してもらえたら、ストーリーで紹介させてください✨\n```\n\n## 必要なもの / 段取り\n- **Google口コミの短縮リンク**：GBP（business.google.com）→ 対象店舗 →「顧客」or「ホーム」→「レビューをリクエスト/共有」でコピー（`https://g.page/r/～/review` 形式）。\n  → 部長(私)がQR画像も作成可能（リンクをもらえれば）。\n- サウナイキタイURL：`https://sauna-ikitai.com/saunas/114736`（既知）。\n- 顧客リストに「温度メモ」列を1つ追加（自動管理ID行のみ追記・手書き行は不可侵）。\n\n---\n\n# ② GBP / MEO てこ入れ（集客・PR）\n\n> 目的：「仙台 サウナ 貸切」「大和町 サウナ」等での地図表示順位UP＝予約直結。社長Gアカウント(hiroakikouwa5@gmail.com)で管理中＝追加コスト/新ツールゼロ。\n\n## チェックリスト（business.google.com で設定）\n- [ ] **メインカテゴリ＝「サウナ」**／追加カテゴリ「スパ」「ホットスパ」「公衆浴場」など該当するもの\n- [ ] **属性**：個室/貸切利用可、予約制、駐車場あり 等 該当を全てON\n- [ ] **ビジネス説明文**（下記をコピペ）\n- [ ] **写真**を5〜10枚：バレル外観／サウナ室内（薪・ストーン）／水風呂（温度計が映るもの）／ととのいチェア3種／夜のイルミ外気浴／メニュー・料金\n- [ ] **予約リンク**：`https://www.chillnn.com/ja/19c7a1b53493d2`\n- [ ] **営業時間**：1部13:00-16:00／2部18:00-21:00 が分かる形（16-18は清掃）。※運用に合わせて調整\n- [ ] **NAP統一**：店名「KÖWA SAUNA」／住所「宮城県黒川郡大和町杜の丘1-10-1」／電話 ＝ IG・サウナイキタイ・CHILLNNと完全一致\n- [ ] **GBP投稿（最新情報）を週1**で更新（下記ネタ）\n\n## ビジネス説明文（コピペ・750字以内）\n```\nKÖWA SAUNA（コーワサウナ）は、宮城県大和町杜の丘にある完全貸切のバレルサウナです。1日2組限定、他のお客様を気にせず、ご自分のペースで“ととのい”を楽しめます。\n\n最大の特徴は「自在ととのい」。サウナの温度（60〜110℃）も、水風呂の温度（3〜42℃）も、お好みに合わせて設定可能。さらにインフィニティチェア・ブレインスリープ・アディロンダックチェアから“ととのい方”も選べ、組み合わせは無限大です。\n\n本場フィンランド式バレルに5種のアロマ、オゾンろ過のまろやかな水質。リフォーム会社（有限会社光和工業）が本気で作り込んだ、こだわりの完全プライベート空間です。\n\nご予約は公式サイトから。仙台市中心部から車でアクセス良好。サウナ好きの方も、はじめての方も、自分だけのととのいを見つけにいらしてください。\n```\n\n## GBP投稿（最新情報）最初の3本\n1. **水風呂3〜40℃**：「水温を自分で選べる水風呂、知ってますか?自分だけの“ちょうどいい冷たさ”を。」＋予約リンク\n2. **完全貸切・1日2組**：「他の人を気にせず、サウナも水風呂も独り占め。完全貸切のバレルサウナです。」＋予約リンク\n3. **アロマロウリュ**：「5種のアロマから選べるロウリュ。深呼吸するたび、ととのう。」＋予約リンク\n\n## ⚠️ 注意（公開情報の編集）\nGBPは**公開情報**のため、編集は社長の明示許可のうえで実施（部長が代行する場合も都度確認）。まずは内容を用意 → 社長が反映、または許可をもらって部長がブラウザで反映。\n"}, {"file": "施策_家庭用サウナ_叩き台3点_2026-06-04.md", "cat": "施策", "title": "家庭用サウナ販売：叩き台3点（2026-06-04）", "md": "# 家庭用サウナ販売：叩き台3点（2026-06-04）\n\n> 社長指示「全部1回 叩き台で作ってみよう」。①ポスティング用チラシ案 ②リース会社の比較観点 ③現地調査チェックリスト。\n> すべて**叩き台**。数字・表記は要確定（最終は人間/専門家/リース会社）。トーンは高級感＋安心、誇大表現はしない。\n\n---\n\n# ① ポスティング用チラシ案（A4両面想定）\n\n## 表面（つかみ）\n- **メインコピー案**（いずれか）：\n  - 「自宅が、“ととのう”場所になる。」\n  - 「賃貸でも置ける、本格サウナ。」\n  - 「エアコン感覚で、マイサウナ。」\n- **サブコピー**：完全プライベート／温度は自分好み／床付き据置でラクラク設置／**PSC認証取得**\n- ビジュアル：バレル/キャビンの上質な写真＋自宅に置いたイメージ。\n\n## 裏面（本文）\n**1. こんな方へ**\n- 多忙で“ととのう時間”を自宅で確保したい経営者・アスリート・在宅ワーカー\n- ジム/サウナ通いの手間を省きたい／人目を気にせず整いたい\n\n**2. 3つの安心**\n- ✅ **据置・床付きユニット**（給排水なし＝漏水の心配なし）\n- ✅ **PSC認証取得**（製品安全の裏付け）\n- ✅ **賃貸OK**：エアコンと同じ“専用回路”の電気工事。退去時は**原状回復**まで当社が対応\n\n**3. 料金（叩き台・税抜）**\n- ご購入：**1,580,000円〜**（本体＋搬入＋設置＋専用回路工事 コミコミ）\n- 月々払い：**月 30,000円台〜**のリースも（サブスク感覚で導入）\n- ※ ⚠️金額は目安。現地条件でお見積り。\n\n**4. 施工はリフォームのプロ**\n- 有限会社光和工業。住宅・店舗リフォーム＋サウナ施工の実績。電気工事士が法令に則り施工。\n\n**5. まずは“体感”できます**\n- 貸切サウナ **KÖWA SAUNA**（宮城県大和町杜の丘）で、温度自在の“自在ととのい”を体験 → 気に入ったら自宅へ。\n\n## CTA・記載必須項目\n- **無料 現地調査＆お見積り** ／ QRコード（LINE・予約/問い合わせ）・電話番号\n- 会社名・所在地・建設業/電気工事の登録、サウナイキタイ・Instagram(@kouwa.reform.sauna)\n- ⚠️ 特商法・景表法に配慮（「必ず」「No.1」等の断定/誇大は避ける）。\n\n## オファー設計（反応率を上げる）\n- 「**今月、現地調査＆体験無料**」「体験予約でお見積り○○特典」等の軽い誘導。\n- ⚠️ ポスティングは反応率が低い前提。**体験ファネル/法人にも同チラシを流用**し、複数導線で。\n\n## ⚠️ ポスティング実施上の注意\n- 集合住宅は**「チラシ投函お断り」掲示の確認**（トラブル防止）。\n- 高級賃貸はブランド配慮（紙質・デザインを上質に、安売り感を出さない）。\n\n---\n\n# ② リース会社の比較観点（選定チェック）\n\n> サウナ＝動産リース。賃貸への設置・撤去が絡むため、扱える会社か見極めが要る。まず2〜3社に相見積。\n\n| 比較軸 | 見るポイント |\n|---|---|\n| **リース料率/総支払** | 月額・総額・残価設定。60回/48回での料率差 |\n| **与信の通しやすさ** | 個人・個人事業主・法人で条件が変わる。富裕層個人の通しやすさ |\n| **動産/特殊物件の可否** | サウナのような据置設備を扱えるか（断られる会社もある⚠️） |\n| **中途解約・残価・撤去/引揚げ** | 短期解約時の精算、**撤去・搬出の費用と段取り**、所有権の所在 |\n| **再リース/使い回し** | 状態良好品の再活用に対応できるか（木材再生で残価が残る前提） |\n| **ベンダー登録のしやすさ** | 光和が販売店として提携しやすいか、申込フローの簡便さ |\n| **保険・保証連携** | 動産総合保険・PL/施工保証との組み合わせ |\n\n- **候補タイプ**（⚠️具体条件は各社へ直接確認）：\n  - 信販/ショッピングクレジット系（オリコ/ジャックス/アプラス等）＝個人向け分割に強い\n  - リース専業（動産リース）＝法人・事業者向けに強い\n  - メーカー/商材提携リース＝サウナ商材で提携実績があれば最短\n- **進め方**：①2〜3社に「サウナ(据置・賃貸設置・撤去あり)を扱えるか」を一次確認 → ②料率・与信・撤去対応で比較 → ③1社を主、1社を予備に。\n\n---\n\n# ③ 現地調査チェックリスト（販売前・必須）\n\n## A. 物件・区分\n- [ ] 賃貸 / 持ち家　[ ] 戸建 / 集合住宅　[ ] 設置場所：屋内 / ベランダ / 庭・ルーフ\n- [ ] 賃貸の場合：管理会社・オーナー、**承認要否**、管理規約、原状回復条件\n\n## B. 設置スペース\n- [ ] 設置寸法（W×D×H）と本体サイズの余裕、天井高\n- [ ] **床荷重**（本体100〜130kg＋使用者）／床材・防水・水平\n- [ ] 換気（窓/換気扇）、湿気・結露対策、近隣との距離（熱・音・匂い）\n\n## C. 搬入経路\n- [ ] 玄関ドア幅・廊下幅・曲がり角、エレベーター/階段、養生の要否\n- [ ] 分解搬入の可否（組立式か）／搬入車両の駐車\n\n## D. 電源（専用回路）\n- [ ] 契約アンペア・既存容量の余裕、分電盤の空き\n- [ ] 機種電源（100V / 200V）・消費電力(kW)、**専用ブレーカー増設位置**、配線距離、アース\n- [ ] エアコン専用回路と同様の工事である旨を顧客・管理会社へ説明\n\n## E. 安全・保険\n- [ ] 可燃物の近接、子供/ペット、低温やけど・転倒の注意喚起\n- [ ] PL保険・施設賠償保険の付保確認\n\n## F. 商談メモ\n- [ ] 設置希望時期、予算感、**購入 / リース**希望、体験(KÖWA)有無\n- [ ] 写真：設置場所・分電盤・搬入経路（見積精度を上げる）\n\n---\n\n## まとめ（叩き台→次の精度上げ）\n- チラシは**コピー/価格/特典**を社長確認後にCanvaで版下化。\n- リースは**2〜3社へ一次確認**して料率・撤去対応を実数化。\n- 現地調査リストは**初回案件で実運用→改訂**。\n"}, {"file": "施策_家庭用サウナ_料金リースと管理会社連絡_2026-06-04.md", "cat": "施策", "title": "家庭用サウナ販売：料金・リース設計 ＆ 管理会社連絡の口上案（2026-06-04）", "md": "# 家庭用サウナ販売：料金・リース設計 ＆ 管理会社連絡の口上案（2026-06-04）\n\n> 前提：据置・床付きユニット(100〜130kg)・PSC認証取得・電気は専用回路工事(エアコン後付けと同じ標準フロー)。\n> 原状回復は契約に事前明記。リースは提携リース会社経由。原価≒仕入78万＋設置工事＋電気工事(専用回路)。\n> ⚠️ 金額はすべて目安(税抜)。最終の価格・リース料率・税務は人間/リース会社/税理士の確定が前提。\n\n---\n\n# ① 料金・リース設計\n\n## 原価の整理（1台）\n| 項目 | 目安 |\n|---|---|\n| 本体仕入(定価約130万×60%) | ≒78万 |\n| 設置工事(内製) | 15〜20万 |\n| 電気工事(専用回路・内製) | 4〜5万 |\n| **原価合計** | **≒97〜103万**(内製のため圧縮余地あり) |\n\n## A. 一括販売\n| プラン | 販売価格(税抜) | 粗利 | 粗利率 |\n|---|---|---|---|\n| 控えめ | 1,380,000 | ≒37万 | 27% |\n| **標準(推奨)** | **1,580,000** | **≒57万** | **36%** |\n| 強気(富裕層) | 1,780,000 | ≒77万 | 44% |\n- 受注生産＋**前金30〜50%**で在庫・資金リスクを回避。\n- 価格に「本体＋搬入＋設置＋専用回路工事」を含む“コミコミ”表示が分かりやすい(別途は明示)。\n\n## B. リース／サブスク（提携リース会社経由＝推奨）\n- スキーム：**光和 → リース会社へ一括卸(粗利を即現金化)** ／ 顧客はリース会社へ月額支払。与信・回収・残価はリース会社が負担＝**自社資金はショートしない**。\n- 卸値の例：リース会社へ ¥1,500,000 で卸 → 粗利 ≒50万を即計上。\n- 顧客月額(⚠️推測・リース会社の料率次第)：\n\n| 期間 | 月額の目安 | 備考 |\n|---|---|---|\n| 60回(5年) | **月 ¥30,000 前後** | サブスク感覚で導入しやすい |\n| 48回(4年) | 月 ¥34,000 前後 | 期間短め |\n\n- **使い回し/再生が効く**：状態良好なら短期解約でも次の顧客へ。木材は削れば再生＝残価が残り、リース採算に有利。\n- ⚠️ サブスクの実質が割賦なら割賦販売法、対消費者販売は特商法(書面・クーリングオフ)の対象になりうる→契約はリース会社/弁護士監修。\n\n## 含めるべき条項・付帯\n- **保証**：製品保証(メーカー/PSC)＋施工保証(○年)。\n- **原状回復条項**：退去時に専用回路を元に戻す・配線撤去・サウナ搬出(費用負担の所在を明記)。\n- **メンテ**：定期点検＋木材リフレッシュ(削り直し)をオプション化(継続接点＆残価維持)。\n- **PL保険＋施設賠償保険**に加入のうえ販売開始。\n\n---\n\n# ② 管理会社への連絡 口上案（エアコン専用回路と同じ標準フロー）\n\n> 考え方：賃貸で専用回路を引くのは**エアコン後付けと同様の普通の電気工事**。顧客 or 当社から管理会社へ承認依頼するだけ。「積水の委託先だから特別」と身構えず、**一般的な工事屋のスキーム**で進める。\n\n## 標準フロー\n1. お申込み → **現地調査**(搬入経路・設置位置・電源容量・専用回路の要否)\n2. 専用回路が必要 → **管理会社へ承認依頼**(顧客から or 当社が代行)\n3. 承認後に施工(電気工事士が専用ブレーカー1系統増設＋サウナ設置)\n4. 退去時 → **原状回復**(配線撤去・分電盤復旧・サウナ搬出)\n\n## 管理会社向け 連絡文例（電話/書面）\n```\nお世話になります。○○(物件名)○号室の入居者様より、家庭用サウナ設置に伴う\n「専用回路の増設工事」のご依頼をいただいております。\n内容はエアコン専用回路の新設と同様で、分電盤に専用ブレーカーを1系統増設するものです。\n本体は床付きの据置型(PSC認証取得・約100〜130kg)で、給排水を伴わないため漏水の懸念はございません。\n退去時には配線の撤去・分電盤の復旧など原状回復を当社にて行います。\nつきましては、貸主様の設置ご承認をいただけますようお願い申し上げます。\n（電気工事は当社の電気工事士が、関係法令に則り施工いたします。）\n```\n\n## 顧客向け 説明文例\n```\nエアコンを後付けする時と同じで、サウナ専用の電気回路を1つ増設します🔌\n賃貸の場合は管理会社さんの承認が必要なので、ご連絡はこちらで代行も可能です(お客様からの一言でもOK)。\n退去の際は配線の撤去・元通りの復旧までこちらで対応するので、ご安心ください😊\n```\n\n---\n\n## 次アクション候補\n- リース会社の選定・料率取得 → 月額を実数で確定。\n- 現地調査チェックリスト(搬入/電源/設置位置/原状回復条件)の整備。\n- (別途ご指定があれば)ポスティング用チラシ案、体験→自宅の導線設計。\n"}, {"file": "提案_物販3点セット_サウナ水風呂寝具_2026-06-04.md", "cat": "提案", "title": "提案：物販3点セット「サウナ＋チラー水風呂＋ブレインスリープ寝具」営業資料・導線 たたき台", "md": "# 提案：物販3点セット「サウナ＋チラー水風呂＋ブレインスリープ寝具」営業資料・導線 たたき台\n\n> 作成：物販・BtoB営業チーム（部長直轄ライン）　2026-06-04\n> 位置づけ：社長チェック用たたき台。確定価格・仕入条件・採算は別途社長確認後に数字を固める。\n> ⚠️ 本資料は社内用。客先転用の際は原価・粗利の記載箇所を削除し、ブレインスリープの販促ガイドライン適合を確認してから使うこと。\n\n---\n\n## 1. 3点セットの提案コンセプト\n\n### 「ととのい」→「回復睡眠」の一気通貫ストーリー\n\n現代のウェルネス需要は「疲れを取る」から「パフォーマンスを上げる」へシフトしている。\nこの3点は、身体の温冷サイクルと睡眠を一本のストーリーで繋げられる唯一の組み合わせである。\n\n```\n[サウナ]高温で身体を温める → 発汗・血流促進・筋弛緩\n    ↓\n[チラー水風呂/アイスバス]15℃前後の冷水に浸かる → 血管収縮・炎症抑制・アドレナリン分泌\n    ↓\n[ととのいスペース]ブレインスリープのマット(カバーを外せば耐水=ととのい用マットに転用)で横になりととのう\n    ↓\n[着替え後・休憩室/更衣室]服を着てブレインスリープのベッドで仮眠 → 深い睡眠・疲労回復\n    ↓\n翌日のパフォーマンス向上・身体資本の継続的な維持\n```\n\n> ✅ 現場の使い方（社長確認 2026-06-04）：ブレインスリープは1つで2役。\n> ①「ととのいスペース」ではカバーを外して耐水マットとして使う（濡れた体でもOK）。\n> ②着替えた後は更衣室・休憩室の「仮眠ベッド」として服を着て休む。\n> ※「濡れたまま寝具に寝る」という動線ではない（机上の誤り。修正済み）。\n\n### なぜ3点が相性いいのか（5つの理由）\n\n1. **寝具1つで「ととのい」と「仮眠」の2役**\n   ブレインスリープはカバーを外せば耐水マットになり、ととのいスペースの\"ととのい用マット\"として使える。着替えた後は更衣室・休憩室の\"仮眠ベッド\"にもなる。1商材で施設の2か所に効く。\n\n2. **「ととのい」の補完・強化**\n   水風呂の温度をチラーで一定に保つことで、温冷の振れ幅が制御でき、ととのいの再現性が上がる。自然水温では出せない「毎回同じ体験」が付加価値になる。\n\n3. **回復睡眠でサイクルが完結**\n   ととのいで緩んだ自律神経・副交感神経優位の状態をそのまま睡眠に入れることで、回復効果が最大化する。「ととのったけど眠れない」を解消する導線として寝具が機能する。\n\n4. **施設・宿・介護のどのターゲットでも語れる**\n   「疲労回復」「パフォーマンス向上」「衛生・丸洗い」「法令コンプライアンス」と、相手によって切り口を変えながら3点を束ねて提案できる。\n\n5. **光和の競争力が3点で掛け合わさる**\n   リフォーム本業の施工力（設置）＋正規代理店ステータス（ブレインスリープ）＋アイスバス扱い（Hagoromo）＝他社が真似しにくい組み合わせ。\n\n### KÖWA SAUNAをショールームとして活用\n3点セットをそのままKÖWA SAUNAで体験させる。「今日体験したのとまったく同じセットを貴施設に」という導線が最強のクロージング材料になる（出典：`構想_ブレインスリープ販売計画_2026-06-04.md`）。\n\n---\n\n## 2. ターゲット別の売り方\n\n> ★方針（社長判断 2026-06-04）：**まず Ⓓ スポーツ・企業の熱中症対策に集中する。**\n> 理由＝2025/6施行の改正安衛則で「職場の身体冷却」が義務化＝売り込まなくても買わざるを得ない強制需要だから（＝勝ち筋）。\n> Ⓐ温浴・Ⓑ宿泊・Ⓒ介護は、Ⓓで実績・事例を作ってからの横展開フェーズに回す。\n\n### A. 温浴・サウナ施設（横展開フェーズ／既存サウナ施工先へのクロスセル）\n\n| 項目 | 内容 |\n|---|---|\n| 具体ターゲット | スーパー銭湯・新設サウナ施設・バレル/箱サウナの新規開業者・既存温浴施設のリニューアル |\n| 刺さる理由 | 「水風呂温度のばらつきをなくしたい」「外気浴/休憩スペースで差別化したい」「ととのいコースとして完結させたい」 |\n| 提案の組み合わせ | サウナ（kokolo / バレル / CUBE等）＋Hagoromo1（チラー水風呂）＋ブレインスリープ（外気浴・休憩用） |\n| 強調するメッセージ | 「\"ととのい\"を施設の看板メニューにする3点一式。濡れたまま寝られる、丸洗いできる、毎回同じ水温」 |\n| 営業入り口 | バレル・サウナ施工先へのクロスセル（既存施工実績から）。KÖWAで体験→BtoBヒアリング |\n| リース適性 | 高（法人の設備として経費化しやすい） |\n\n### B. 宿泊施設（ホテル・旅館・グランピング・サウナ付き宿）\n\n| 項目 | 内容 |\n|---|---|\n| 具体ターゲット | サウナ付き旅館・コテージ・グランピング施設・ブティックホテル |\n| 刺さる理由 | 「宿泊の口コミ（\"よく眠れた\"）を作りたい」「サウナ体験を差別化したい」「客室・スパを高付加価値化したい」 |\n| 提案の組み合わせ | サウナ＋Hagoromo1s（小型チラー水風呂）＋ブレインスリープ（客室備品・スパ休憩用） |\n| 強調するメッセージ | 「\"よく眠れた宿\"が口コミになる。洗える清潔さで多客・連泊にも強い」 |\n| 営業入り口 | 宿泊施設のリノベ・新築相談（リフォーム本業との連動）。観光・宿泊系展示会 |\n| リース適性 | 中〜高（客室備品としてリース化可） |\n\n### C. 介護・高齢者施設（ブレインスリープの独自性が最も高い）\n\n| 項目 | 内容 |\n|---|---|\n| 具体ターゲット | 老人ホーム・サービス付き高齢者向け住宅・介護施設・病院の療養病棟 |\n| 刺さる理由 | 「丸洗いできる＝失禁・汚れへの衛生対応」「通気素材＝蒸れ・床ずれ配慮（断定表現NG）」「回復の良い睡眠＝QOL向上」 |\n| 提案の組み合わせ | **ブレインスリープ単品が入り口。**信頼関係ができたら、浴場・機能訓練スペースへの水風呂（Hagoromo1s）を次フェーズで提案 |\n| 強調するメッセージ | 「丸洗いで清潔、蒸れにくい、よく眠れる——介護現場の課題に直接応える寝具」 |\n| 営業入り口 | 介護用品ディーラー・福祉用品展示会・施設の設備購買担当へ直販 |\n| リース適性 | 中（リース・分割は法人向け施設と相性良。介護補助金ルートも） |\n| ⚠️ 注意 | 「床ずれ予防」「治療効果」等の医療的効能は断定しない。防炎・難燃などの施設安全規格の適合をメーカーに確認すること（出典：`構想_ブレインスリープ販売計画_2026-06-04.md`） |\n\n### D. スポーツ施設・企業の熱中症対策（★本命・最優先 — 社長指定）\n\n| 項目 | 内容 |\n|---|---|\n| 具体ターゲット | プロ・アマチュアスポーツ施設（チーム寮・合宿所・トレーニングセンター）、建設/物流/製造の現場（職場）、学校・自治体の熱中症対策 |\n| 刺さる理由（法令） | **2025年6月施行の改正労働安全衛生規則により「職場での身体冷却措置」が義務化。**建設/物流/製造現場は買わざるを得ない「強制需要」（出典：`分析_冷たい水需要_市場調査_2026-06-04.md`） |\n| 刺さる理由（スポーツ） | 運動後のアイシング・リカバリー科学の認知拡大。「アイスバス＋良い眠り」でリカバリーパッケージ化 |\n| 提案の組み合わせ | Hagoromo1s（熱中症対策・小型）またはHagoromo1（スポーツ施設・複数人）＋ブレインスリープ（チーム寮・合宿所の就寝用） |\n| 強調するメッセージ（現場） | 「改正安衛則に対応する救命・コンプライアンス設備。リースで月額○万円から導入可」 |\n| 強調するメッセージ（スポーツ） | 「冷やして・眠る。科学的リカバリーを2点セットで」 |\n| 営業入り口 | 現場：建設/物流法人の安全衛生担当へ。スポーツ：整骨院・パーソナルジム・地元クラブチームへ直営業。フラッグシップ=プロチーム or 強豪校へ無償/デモ設置→事例化（出典：`構想_アイスバス_BtoB展開_2026-06-04.md`） |\n| リース適性 | 高（現場設備の経費化・期末補正予算の活用） |\n| ⚠️ 注意 | 浴槽形態で「人が入る」前提が現場で許容されるか要確認。建設/物流の安全衛生担当とのヒアリング必須 |\n\n---\n\n## 3. 価格・提示の型\n\n> ⚠️ 本章の数字は既存ファイルの引用または概算。客先提示価格は社長・経理が最終確定すること。原価・粗利は社内用のみ（客先転用不可）。\n\n### 単品価格（出典：`分析_冷たい水需要_市場調査_2026-06-04.md` / `施策_家庭用サウナ_料金リースと管理会社連絡_2026-06-04.md`）\n\n| 商材 | 型番/区分 | 希望小売価格（税抜・参考） |\n|---|---|---|\n| サウナ（家庭用・据置） | 標準モデル | 1,380,000〜1,780,000円（設置・専用回路工事込み） |\n| チラー水風呂（アイスバス） | Hagoromo1s（小型） | 1,240,000円（→キャンペーン価格1,040,000円） |\n| チラー水風呂（アイスバス） | Hagoromo1（標準） | 1,980,000円（→1,580,000円） |\n| チラー水風呂（アイスバス） | Hagoromo1n（全自動・小型） | 580,000円 |\n| ブレインスリープ（主力・ピロー） | ブレインスリープ ピロー | 33,000円〜（税込・公式定価） |\n| ブレインスリープ（主力・マットレス） | マットレス フロート（S） | 88,000円〜（税込・公式定価）※上位：プラス フロート154,000円〜／プレミアム フロート220,000円〜 |\n| ブレインスリープ（場所により） | マットレス オーバーレイ | 44,000円〜（税込・公式定価） |\n\n> 出典：ブレインスリープ公式（社長共有 `collections/all`）。主力SKU＝**ピロー／マットレス フロート／（場所により）オーバーレイ**（社長確認 2026-06-04）。最新定価は必ず公式で再確認。\n\n#### 🔒 ブレインスリープ 価格方針・粗利（社内用・粗利欄は客先転用不可）\n\n**社長方針（2026-06-04）：仕入（うちに入る）= 定価 × 70% ／ 客先販売 = 定価 × 90% ／ 光和粗利 = 定価 × 20%**\n\n| SKU | 定価(税込) | 仕入（×0.70） | 客先販売（×0.90） | 粗利（×0.20） |\n|---|---|---|---|---|\n| ピロー | 33,000円 | 23,100円 | 29,700円 | 6,600円 |\n| マットレス フロート（S） | 88,000円 | 61,600円 | 79,200円 | 17,600円 |\n| マットレス オーバーレイ | 44,000円 | 30,800円 | 39,600円 | 8,800円 |\n| （参考）寝具2点：ピロー＋フロート | 121,000円 | 84,700円 | 108,900円 | 24,200円 |\n\n> 客先には **定価の90%（10%引き）** で提示できる＝「正規品を代理店特価で」という訴求が可能。粗利は定価の20%。\n> ⚠️ 掛け率70%/90%が**税抜基準か税込基準か**は要確認（上表は表示定価＝税込に乗じた概算）。サイズ違い（SD/D）・上位フロート（プラス/プレミアム）も同率かは吉田さん（営業窓口 takanori.yoshida@brain-sleep.com）に念のため確認。\n\n### 3点セット バンドル提示の考え方\n\nセット提示は「価格の足し算」ではなく「体験価値の束売り」として提案する。\n\n**提示の型（3パターン）**\n\n| プラン名 | 組み合わせ | 参考総額（税抜） | 狙うターゲット |\n|---|---|---|---|\n| エントリーセット | Hagoromo1n（全自動水風呂58万）＋ブレインスリープ寝具2点（ピロー＋フロート） | 約 68.9万（水風呂58万＋寝具 客先10.89万） | 小規模施設・スポーツ現場・熱中症対策 |\n| スタンダードセット | 家庭用サウナ（158万）＋Hagoromo1s（104万）＋ブレインスリープ寝具2点 | 約 272.9万（＋寝具 客先10.89万） | 温浴施設・宿泊・介護施設 |\n| フルスペックセット | 家庭用サウナ（178万）＋Hagoromo1（158万）＋ブレインスリープ寝具2点 | 約 346.9万（＋寝具 客先10.89万） | 施設オープン・フラッグシップ・富裕層個人 |\n\n> ⚠️ 寝具は「ピロー＋マットレス フロート」の2点を標準想定。**寝具は客先販売＝定価の90%＝108,900円（税込）**で計上（仕入84,700円）。介護等でオーバーレイ主体なら差し替え。サウナ/水風呂は税抜・寝具は税込で税区分が混在＝客先提出版で統一すること。\n\n**バンドル提示のルール**\n- セット価格での値引きを設定する場合は経理と粗利確認の上で決定する（現時点で仮の値引き率は置かない）。\n- 「3点を揃えると体験が一気通貫になる」というコンセプト価値で訴求し、単品の足し算との差異は「使い方の提案・施工の一括対応・補助金の一括活用」で出す。\n\n### リース・分割の選択肢（出典：`施策_家庭用サウナ_料金リースと管理会社連絡_2026-06-04.md`）\n\nスキーム：**光和 → 提携リース会社へ一括卸（粗利を即現金化）→ 顧客はリース会社に月額支払**\n\n| 対象 | 期間 | 月額目安（⚠️推測。リース会社料率次第） |\n|---|---|---|\n| サウナ単品（標準158万卸） | 60回(5年) | 月 30,000円前後 |\n| サウナ単品（標準158万卸） | 48回(4年) | 月 34,000円前後 |\n| 3点セット（⚠️合算額・リース会社確認要） | 60回(5年) | ⚠️未確定 |\n\n- 法人顧客にはリース＝経費化・節税メリットを訴求する。\n- 期末・予算消化タイミングでの提案が刺さりやすい。\n\n---\n\n## 4. 営業導線（リード獲得→クロージング）\n\n### 全体フロー\n\n```\n[リード獲得]\n  A. 体験ショールーム（KÖWA SAUNA）\n  B. 展示会（SPORTEC・温浴・設備・福祉）\n  C. 既存施工先へのクロスセル（バレル/サウナ設置先）\n  D. フラッグシップ無償/デモ設置 → 事例化 → 横展開\n  E. 熱中症対策・季節営業（夏前：建設/物流/学校/自治体）\n  F. SNS・インフルエンサー起用（集客PRチームと連携）\n        ↓\n[ヒアリング]（下記ヒアリングシートに従う）\n        ↓\n[提案]\n  - ターゲットに合わせた組み合わせ（章2参照）\n  - 補助金候補を見積に添える（クロージング武器として）\n        ↓\n[クロージング]\n  - 補助金の「採択されたら実質負担XX万」トーク\n  - リース月額提示で初期費用ハードルを下げる\n  - KÖWAで無償体験会（「今日試して決める」）\n        ↓\n[受注・施工・設置]（リフォーム本業と連動）\n        ↓\n[メンテ契約・継続接点]\n  - チラー点検・木材リフレッシュ・寝具洗い替えで継続収益\n  - 事例化（名称・写真は書面許可取得後）\n```\n\n### ヒアリング時に必ず確認する項目\n\n- 導入の目的・背景（コンプライアンス/差別化/QOL/集客/選手強化 など）\n- 設置場所の条件（電源容量・100V専用回路の可否・搬入経路・床荷重）\n- 賃貸/自社物件の別 → 賃貸の場合は管理会社承認フローを案内\n- 利用人数・頻度（チラーのサイズ選定に直結）\n- 予算の意思決定プロセスと期末（補助金活用の有無）\n- 事例化・写真使用の可否\n\n### 補助金をクロージング武器として挟む方法\n\n**タイミング：提案書の最後に「活用できる補助金候補」欄を標準添付**\n\n> 📒 最新の補助金候補・補助率・締切・商材別の添付文例は **`成果物/台帳_補助金_2026-06.md`**（補助金ウォッチ作成・月次更新）を参照してコピー利用する。以下は概要。\n\n```\n【活用できる補助金候補（あくまで候補・最新公募は要確認）】\n- 省エネ・非化石転換補助金（設備単位型）：高効率チラー・乾燥機等に対応（★2次公募〜2026/7/9 受付中）\n- エイジフレンドリー補助金 熱中症対策コース：チラー水風呂提案に親和（受付中〜2026/10/31・対象機器は公募要領で要確認）\n- 新事業進出補助金：リフォーム業からの新事業転換（★第4回〜2026/6/19 締切間近）\n- ものづくり補助金：設備投資として適用可能性あり（次回公募時期は要確認）\n- 業務改善助成金：設備投資＋賃上げセット（2026/9 申請開始）\n- 介護・福祉系補助：介護施設への寝具・設備整備（宮城県の公募は要確認）\n\n※補助金の採択保証はできません。申請手続きは認定支援機関・行政書士にご紹介します。\n  詳細は別途「補助金候補ご提案書」でご案内します。\n```\n\n**トーク例：**\n「補助金が通れば実質負担が半額以下になる場合もあります。公募時期に合わせてスケジュールを組むことも可能ですので、一緒に動きましょう」\n\n→ 成約率向上と「一緒に動く会社」としての信頼構築を同時に得られる（出典：`構想_補助金_監視提案体制_2026-06-04.md`）\n\n### フラッグシップ無償設置の位置づけ\n\n- 狙い：プロチームや有名施設に「まず置く」→ 名称・写真使用許可を対価として事例化 → 横展開営業のトップ材料に。\n- ⚠️ 名称・ロゴ・写真は必ず書面合意（口頭約束は不可）。プロチームはスポンサー制約があり得るため事前確認必須。\n- 無償設置の回収ターゲット：3〜5件の有料受注で回収できる計算を先に作る（経理と連携）。\n\n---\n\n## 5. 営業トークスクリプト・想定問答（叩き台）\n\n### A. 温浴・サウナ施設オーナー向け\n\n**アプローチトーク（電話/メール）**\n「光和工業と申します。弊社は仙台でKÖWA SAUNAという貸切サウナを運営しながら、サウナ・チラー水風呂・寝具のBtoB提案もしております。貴施設の水風呂の温度管理にチラーを導入すると\"毎回同じととのい\"が提供できるようになります。体験も含めてお話しできますでしょうか」\n\n**想定問答**\n| 質問 | 回答の型 |\n|---|---|\n| 「サウナは既に持っているが水風呂だけ欲しい」 | 「Hagoromo1s（小型）なら単品で104万から。後付け設置も対応可。まず現地調査をさせてください」 |\n| 「リースはできるか」 | 「提携リース会社経由で月額3万円台から対応可能です。正確な月額は機種と期間でご提案します」 |\n| 「設置に工事が必要か」 | 「電気の専用回路（エアコン増設と同じ）だけです。弊社で施工まで一括対応します」 |\n| 「補助金は使えるか」 | 「設備投資系の補助金（ものづくり補助金等）との親和性があります。公募状況を確認してご案内します」 |\n\n### B. 宿泊施設（旅館・グランピング）向け\n\n**アプローチトーク**\n「サウナと水風呂と、濡れたまま寝られる寝具をセットで導入した旅館・宿泊施設が、口コミ評価\"よく眠れた\"で差別化に成功しています。弊社は3点を一括施工・一括導入でご対応できます。一度KÖWA SAUNAを体験にいらしてください。実際に体験されてから導入をご検討いただいています」\n\n**想定問答**\n| 質問 | 回答の型 |\n|---|---|\n| 「客室に置ける寝具か」 | 「ブレインスリープは丸洗い可能な素材で、多客・連泊でも衛生管理が楽になります。客室・スパ休憩どちらにも対応します」 |\n| 「温泉旅館だが水風呂だけ欲しい」 | 「水温の再現性が上がり\"温冷交代浴\"のコンテンツとして打ち出せます。外気浴スペースに寝具を加えると差別化が一段上がります」 |\n\n### C. 介護・高齢者施設向け\n\n**アプローチトーク**\n「介護現場で最も困る寝具の課題は\"洗えない\"\"蒸れる\"の2点と聞きます。ブレインスリープは丸洗い可能で通気性に優れており、現場の衛生管理を楽にします。一度サンプルをお試しいただけますか」\n\n**想定問答**\n| 質問 | 回答の型 |\n|---|---|\n| 「床ずれに効くか」 | 「医療効果の断定はできませんが、通気性・蒸れにくさという特長が快適な就寝環境に貢献します。詳しくはメーカー資料でご確認ください」 |\n| 「防炎規格は合っているか」 | 「施設の安全規格への適合はメーカーに確認します。回答後に改めてご提案します（⚠️現時点で即答不可：社内確認要）」 |\n| 「補助金で導入できるか」 | 「介護環境整備向けの福祉補助や、業務改善助成金との組み合わせに可能性があります。最新の公募を確認してご案内します」 |\n\n### D. スポーツ施設・企業の熱中症対策向け\n\n**アプローチトーク（熱中症・現場向け）**\n「2025年6月施行の改正労働安全衛生規則で、職場での身体冷却措置が義務になりました。弊社のチラー付きアイスバスは100V専用電源で設置でき、リースなら月額3万円台から対応可能です。救命・コンプライアンス設備としてご検討いただけますか」\n\n**アプローチトーク（スポーツ・リカバリー向け）**\n「冷やす→眠る、この2ステップがリカバリーの核心です。チラー水風呂とブレインスリープを組み合わせることで、合宿所・チーム寮に科学的なリカバリー環境をそのまま整備できます」\n\n**想定問答**\n| 質問 | 回答の型 |\n|---|---|\n| 「現場に置けるか（防水・屋外対応）」 | 「室内設置を前提としています。屋外の場合は別途設置条件の確認が必要です（⚠️屋外耐候仕様の可否はメーカー確認要）」 |\n| 「何人まで使えるか」 | 「Hagoromo1sは1〜2名、Hagoromo1は少人数施設規模です。多人数の連続使用は冷却能力に限界があります（1〜2名・小容量向け）」 |\n| 「法令義務への証跡として使えるか」 | 「導入・運用の記録として活用していただけます。行政への報告書類については安全衛生の専門家にご確認ください」 |\n\n---\n\n## 6. 次アクション・社長確認事項\n\n### 即動けること（営業チーム着手可）\n\n- [ ] KÖWAショールームでの体験招待リストを作成（温浴オーナー・宿泊施設・スポーツ関係者）\n- [ ] 熱中症対策（改正安衛則）に絞った夏前営業リスト（建設/物流法人・学校）を分析チームと作成\n- [ ] 既存サウナ施工先リストを抽出し、チラー水風呂クロスセルのヒアリングアポを打診\n\n### ⚠️ 社長に確認・決定をもらう項目\n\n**価格・仕入条件**\n- [ ] ブレインスリープの正規代理店価格・販促ガイドライン・表示ルールを本社から取得（本資料に価格未記載の最大の理由）\n- [ ] Hagoromo各型番の現在の仕入値・在庫状況・リードタイム\n- [ ] 3点セット時のバンドル値引き率（経理と協議）\n- [ ] リース会社との提携条件・料率の実数（現状は推測値のみ）\n\n**製品・施工**\n- [ ] Hagoromo1nの「全自動」の実態（冷却以外の自動機能、設置条件）→ 提案資料に正確に記載するため\n- [ ] 連続運転デューティの公式値・正確な冷却kW（現場向け提案に必要）（出典：`分析_冷たい水需要_市場調査_2026-06-04.md` で未確認とされた項目）\n- [ ] ブレインスリープ寝具の防炎・難燃規格への適合（介護施設向け提案の前提）\n- [ ] Hagoromo各型番の屋外設置・耐候性の可否（スポーツ現場向け）\n\n**フラッグシップ戦略**\n- [ ] 無償/デモ設置のターゲット先（プロチーム・強豪校・有名施設）の候補を社長が決める\n- [ ] 無償設置のコスト上限・回収シナリオの社長承認\n\n**組織・体制**\n- [ ] 物販・BtoB営業チームとしての名刺・会社紹介資料の準備（現状で客先に持っていけるものがあるか）\n- [ ] 補助金台帳の整備をどのチームが主担当するか（横断ケイパビリティとして分析チームと協議）\n- [ ] PL保険・施設賠償保険の加入状況（販売開始の前提条件）\n\n**事例化の準備**\n- [ ] 導入事例の書面許可テンプレートの作成（名称・写真・コメント使用の許諾書）\n\n---\n\n## 付録：3点セット 営業トーク1枚サマリー（客先転用の叩き台）\n\n> ⚠️ 以下は客先向けに転用する際の素材。転用前に：原価・粗利・仕入値の記載を除去 / ブレインスリープの定価・表示をガイドライン確認 / 補助金記載は「候補・最新公募要確認」の注記を必ず添付のこと。\n\n---\n\n**光和工業「3点セット」ご提案**\n\n「ととのい→回復睡眠」を一気通貫で。\n\n| | 商材 | 光和の強み |\n|---|---|---|\n| 1 | サウナ（バレル・CUBE・kokolo 等） | 施工・設置まで一括。設置後のメンテ契約まで対応 |\n| 2 | チラー水風呂 Hagoromo シリーズ | 100V設置・SUS304・3〜42℃自在。熱中症対策にも対応 |\n| 3 | ブレインスリープ寝具（正規代理店） | 耐水・通気・丸洗い。濡れたまま横になれる整い寝具 |\n\n「まずKÖWA SAUNAで体験してから、ご判断ください。」\n\n---\n\n> 作成：物販・BtoB営業チーム　確認：部長 → 社長チェック待ち\n> 次アクション（部長へ）：本資料を社長にレビューいただき、⚠️確認事項の優先順位を決める。価格確定後に客先転用版を分離作成する。\n"}, {"file": "分析_冷たい水需要_市場調査_2026-06-04.md", "cat": "分析", "title": "分析レポート：チラー付き水風呂(約125万)の「冷たい水」BtoB需要 徹底調査 2026-06-04", "md": "# 分析レポート：チラー付き水風呂(約125万)の「冷たい水」BtoB需要 徹底調査 2026-06-04\n\n> 社長指示で分析チーム3班がWebリサーチ。当社品=チラー付き水風呂/小型チラー(約125万・低出力・ステンレス・オゾンろ過・3〜42℃)。\n> 結論：**当初想定(農家・染物)より、法令義務化された「熱中症対策(現場の身体冷却)」が最強の本命**。価格125万は明確なギャップに収まる。\n\n---\n\n## 🔔 ヘッドライン（部長の統合判断）\n1. **最有望＝熱中症対策(法令義務)**。2025年6月施行の改正労働安全衛生規則で、職場の**「身体を冷やす措置」が罰則付きで義務化**。建設/物流/製造現場・学校/自治体・スポーツで“買わざるを得ない”需要。競合(氷不要ポータブルアイスバス)は**価格非公開=125万でも比較されにくくマージンを取りやすい**。Jリーグ清水エスパルス導入実績あり。→ **リース/レンタル＋「救命・コンプラ設備」訴求**で攻める。\n2. **次点＝スポーツ・リカバリー(小規模)＋温浴/サウナ施設へのクロスセル**。コールドプランジは世界的ブーム(市場$870M・CAGR8%、Equinox/Life Time採用)。当社の**3〜42℃温冷兼用**は整骨院/スポーツ整形に刺さる。KÖWA/バレル施工先へ水風呂チラーをクロスセル。\n3. **三番手＝産業小規模＝製麺・豆腐などの食品**。「締め水・夏の練り水冷却」など少量冷水・真水OK。宮城に母数(食品産業協議会)。ただし**浴槽を外した“冷水循環ユニット”に切り出す**必要＋同価格帯に専業(オリオン等79-118万)あり=地元アフター等で差別化。\n4. ⚠️ **社長仮説の修正**：**染物(藍染/友禅)は冷却需要が薄く非推奨**(課題は水量・水質)。**農家予冷は真空予冷が主流**で当社は補助的(中〜低)。**水産は需要大だが海水対応=耐食化が必須**(第二波)。\n5. ✅ **スペック確認済み(2026-06-04 / kokolo資料・チラシ・価格表)**：\n   - チラー＝**1.0馬力(1.0P, 市/地用 単体18.8万)** または **1.5馬力(1.5P 単体22.8万, 寒冷地24.8万)** の**小型**。\n   - **100V・専用電源(専用回路)推奨**(=社長の「エアコン専用回路と同じ」と完全整合)。\n   - 水槽は**SUS304ステンレス＋カナダ産レッドシダー**、**塩噴霧試験 実施済**、水漏れ防止。**標準水量は数百L級**。\n   - 冷却は「**数時間で数℃**」級＋最大冷却設計・ワンタッチ水温設定(＝**間欠/小容量向け**。大量・連続の高速冷却ではない)。\n   - サイズ/価格：**Hagoromo1s 1100×600×700mm＝希望小売124万(→104万)** / Hagoromo1 1570×1076×710mm＝198万(→158万) / 全自動Hagoromo1n 58万。\n   - → **小規模(1〜2名・小容量)が最適**。大型施設の多人数連続は能力不足。**海水(水産)はSUS304で長期腐食懸念→要検討**。\n   - ⚠️残り未確認：連続運転デューティの公式値・正確な冷却kW・PSE/PSC表記(現物/メーカーに確認)。\n\n---\n\n## 価格マップ（実勢・当社125万の立ち位置）\n| カテゴリ | 価格帯 | 当社125万との関係 |\n|---|---|---|\n| 小型チラー単体(サウナ/水風呂・観賞魚) | 18〜70万 | **当社は高い**→「ただの冷却機」では負ける |\n| 産業小型チラー(オリオン等) | 79〜118万 | 同バンド→\"安い\"では勝てず差別化要 |\n| **オールイン浴槽セット(チラー内蔵)** | 106〜148万 | **ちょうど同レンジ**→“届いて即使える完成品”なら戦える |\n| 海外Plunge業務用 | 195〜250万 | **当社が3〜5割安い** |\n| 現場用 氷不要ポータブルアイスバス | **価格非公開(問合せ)** | 比較されにくく**マージン取りやすい**(熱中症の本命) |\n| 本格業務用/産業プラント・真空予冷・スラリーアイス | 数百万〜数千万 | 中小には過剰投資(=当社のニッチ余地) |\n\n## セグメント有望度\n| セグメント | 有望度 | 要点 |\n|---|---|---|\n| 熱中症対策(現場・学校・自治体・スポーツ救命) | **高★** | 法令義務=強制需要・競合価格不透明・リース必須 |\n| スポーツ/リカバリー(小規模)・整骨院 | 高〜中 | 温冷兼用が刺さる。大型施設は冷却能力の検証要 |\n| 温浴/サウナ施設・ホテル(クロスセル) | 中〜高 | バレル/サウナ施工先へ水風呂チラー横展開 |\n| 製麺・豆腐等 小規模食品 | 中〜高 | 少量冷水・真水OK・宮城に母数。冷水循環ユニットに切り出し |\n| 水産加工(冷海水・活魚) | 中 | 需要大だが**海水対応(耐食)必須** |\n| 農業予冷 | 中〜低 | 真空予冷主流・JAは数百万機=価格軸違い |\n| 醸造/理美容/ラボ/ペット/染物 | 低 | 方式違い・別技術・単価不一致・需要薄→深追い不要 |\n\n## 製品の切り出し（市場別）\n- **浴槽セットのまま**：熱中症・スポーツ・温浴(人が入る/即設置が価値)。\n- **浴槽を外し“冷水循環ユニット(タンク/熱交換型)”へ**：食品・産業(プロセス冷却)。水産は海水対応化。\n- 販売：**リース/レンタル併用が必須**(競合が月1.1万〜のサブスクで現場予算を取りに来ている)。\n\n## まず動くなら（攻める順）\n1. **熱中症対策(法令義務)**：建設/物流/製造法人・自治体/学校へ、**リース＋救命/コンプラ**でアプローチ。フラッグシップは自治体/有名現場/地元プロチームに無償・デモ→事例化。\n2. **スポーツ小規模＋温浴クロスセル**：整骨院/パーソナルジム/サウナ施工先。KÖWAを体験ショールームに。\n3. **製麺・豆腐(食品)**：宮城県食品産業協議会の会員へヒアリングから(冷水循環ユニット提案)。\n- **着手前に必ず**：当社の冷却能力(kW)・連続運転・海水対応・PSE/PSCを社内確定。\n\n## 主な出典\n- コールドプランジ世界市場/CAGR(Grand View Research)、日本リカバリー市場7.6兆(日本リカバリー協会)\n- 価格:ゼンスイ/オリオン/EYELA/Harvia/冷エール/Plunge Business、kokolo sauna 価格ガイド\n- 熱中症義務化:厚労省(令和7年6月1日施行)、改正労働安全衛生規則解説、エア防災(Jリーグ導入)\n- 産業:菱熱/オリオン/ホシザキ/三浦、宮城県食品産業協議会、宮城の水産加工企業一覧\n- 衛生:厚労省 循環式浴槽レジオネラ対策(オゾンは塩素併用前提)\n※詳細URLは各班の調査ログ(本会議の生データ)に保持。必要なら一覧化します。\n"}, {"file": "検討_アイドマ契約解除_戦略メモ_2026-06-04.md", "cat": "検討", "title": "検討：アイドマ契約解除・違約金紛争 戦略メモ（2026-06-04 / 部長＋社長で壁打ち中）", "md": "# 検討：アイドマ契約解除・違約金紛争 戦略メモ（2026-06-04 / 部長＋社長で壁打ち中）\n\n> ⚠️ 法的助言ではない。ビジネス戦略の整理。**送信・最終判断の前に弁護士/行政書士の確認を推奨**（金額次第）。\n> 状態：🟡検討中（社長「もう少し考える・一緒に考えたい」2026-06-04）\n\n## 1. 経緯（事実関係・メールから確認済み）\n- アイドマ・ホールディングス（東証グロース 7373）＝営業代行/テレアポ支援を光和に提供。\n- 5/28：光和が「契約解除申し入れ書」を送付。\n- 6/1：アイドマ片山氏が回答。要旨＝\n  - 協議の場（オンライン）は可。**ただし違約金・解約条件の変更/緩和は前提にしない**（約款どおり）。\n  - 「成果不振」と「業務不履行」は別問題。業務提供を放棄した事実はない、と主張。\n  - 4月以降の業務停止は「光和と協議のうえ、ポイント消化を抑え新担当アサイン前提で実施した」と説明。\n  - 5/11に新担当採用後に連絡した、と。\n  - 「動いていない期間は請求しない」発言は**確認できない**と否定。\n  - やり取りはメール中心希望（記録目的）。\n- 6/2：光和（社長）が**強い反論メールを下書き作成（未送信・DRAFT）**。要旨＝\n  - 問題は成果不振でなく、①長期間 架電/アプローチ履歴が確認できない ②連絡・進捗・改善提案不足 ③「増員する」と言ったのに実施未確認 ④請求対応が二転三転 ⑤事前説明と実態の齟齬。\n  - **根拠資料7項目の提示要求**（4月以降停止の承諾記録／体制立て直し説明の日時・担当・内容／採用期間中の業務提供記録／改善提案の具体資料／5/11連絡の詳細／「請求しない」発言の確認結果／履行と判断する基準）。\n  - 一方的な違約金処理でなく、**責任者・法務を含めた正式協議**を要求。記録は保全済み。\n  - **本メール到達後5営業日以内に書面回答**を要求。\n\n## 2. 争点の核心\n**「アイドマは契約上の業務を履行していたか？」**\n- 履行していなかった（＝債務不履行）と言えれば → 光和は**債務不履行解除**を主張でき、違約金支払い義務を争える/相殺できる余地。\n- アイドマは「月1連絡・改善提案で履行済み」＝不履行ではない、約款どおり違約金を、という構え。\n- → **勝負は「架電実績の記録があるか」**。アイドマが架電ログ・稼働報告を出せないなら、光和の主張が強くなる。出せるなら苦しくなる。\n\n## 3. 社長に確認したい鍵（これで助言の精度が上がる）\n1. **違約金の金額はいくら？**（対応コスト＝弁護士費用と見合うかの分岐点）\n2. **契約書/約款の中途解約条項**は手元にある？（違約金の算定根拠・解約予告期間）\n3. 契約期間中、**架電実績レポート/稼働報告を実際に受け取っていたか？**（受け取っていない＝強い証拠）\n4. 「動いていない期間は請求しない」発言の**証拠**（録音・メール・打合せメモ）はある？\n5. **ゴールの優先順位**は？ → (a)違約金ゼロにしたい (b)減額で早く手を切りたい (c)とにかく関係終了が最優先で多少払ってもいい\n\n## 4. 選択肢（たたき台）\n| 案 | 中身 | 長所 | 短所 |\n|---|---|---|---|\n| **A. 強気のまま送信** | 6/2下書きを（微修正して）送信。資料7項目＋5営業日期限。 | 立証圧力・記録構築。相手が資料を出せなければ有利。 | 上場企業＝法務が固い。長期化・対立先鋭化。期限設定は後で自分も縛る。 |\n| **B. 強気＋出口提示** | 資料要求は維持しつつ「事実に齟齬がなければ円満な解約条件を協議する用意」と一文。 | 立証圧力を保ちつつ着地点を残す。早期和解の芽。 | 「払う気がある」と読まれ減額交渉が弱くなる可能性。 |\n| **C. 専門家を先に通す** | 送信前に弁護士/行政書士に下書きと契約書をチェック。必要なら代理人名で送る。 | 金額が大きいなら最も安全。言質リスクを潰せる。 | 費用と時間。少額なら過剰。 |\n\n## 5. 部長の現時点の読み（暫定）\n- **下書きの中身（資料7項目要求）は筋が良い**。相手が一番出したくない「架電実績」を正面から突いている。\n- ただし「5営業日以内に書面回答」「保全しております」は**法的紛争モードの言葉**。送るなら覚悟が要る。中途半端だとブラフに見える。\n- 推奨の流れ：**まず§3の5つを埋める → 金額が大きい(目安：数十万〜)なら C（専門家）→ 送るなら A か B**。金額が小さく「早く縁を切りたい」なら B で和解を急ぐのも合理的。\n- いずれにせよ**今日いきなり送らない**判断（社長の「もう少し考える」）は正しい。\n\n## 6. 次アクション\n- [ ] 社長が §3 の5項目を回答 → 本メモ更新\n- [ ] 方針（A/B/C）決定\n- [ ] 決定後、下書きを最終調整 or 専門家へ\n"}, {"file": "検討_家庭用サウナ販売_賛否_2026-06-04.md", "cat": "検討", "title": "検討：家庭用サウナ販売（ベレオ入居者ポスティング案）賛否レビュー 2026-06-04", "md": "# 検討：家庭用サウナ販売（ベレオ入居者ポスティング案）賛否レビュー 2026-06-04\n\n> 社長依頼：積水ハウス不動産のハイブランド賃貸『ベレオシリーズ』入居者にポスティングし、電気式家庭用サウナ(サウナ単体)を販売。一括＋リース/サブスクも。料金・契約・法規を含め各部署で賛成/反対を揉む。\n> 仕入＝定価約130万×60%(≒78万)＋設置15-20万＋電気4-5万(原価≒100万/台)。\n> ※法務は一般的論点整理。最終判断は弁護士・税理士・保険/消防/建築の専門家確認が前提。\n\n---\n\n## 🔔 部長の結論\n- **原案(積水管理ベレオ入居者への“無断ポスティングで据置サウナ単売”)＝NO-GO。** 5部署とも同判定。\n- **ただし「家庭用サウナ販売」という事業テーマ自体は“条件付きGO”。** チャネルとターゲットを差し替えれば筋が良い。\n- **決定的論点は法規より“積水ハウス不動産との取引関係”。** ここを誤ると本業(受託)を失う＝サウナ売上の一桁上の損失。\n\n## 各部署の判定一覧\n| 部署 | 判定 | 最大の論点 |\n|---|---|---|\n| 経理・採算 | 一括=条件付きGO／自社リース=NO-GO | 単価採算は良好(粗利27-44%)。自社サブスクは資金繰り・与信・残価・撤去で割に合わない→提携リース経由に |\n| 集客PR・広報 | 手段(ポスティング)=NO-GO／商材=条件付きGO | 高額耐久財はポスティング反応率0.1-0.3%・集合住宅は投函禁止・高級賃貸にチラシ=ブランド毀損 |\n| 法務・契約・法規 | 無断案=NO-GO／積水と組めば条件付きGO | **積水物件入居者への無断直販＝守秘義務/利益相反/委託契約違反リスク**＋賃貸の原状回復・200V増設・PL |\n| 現場・施工 | 条件付きGO（賃貸屋内据置は実質NO-GO） | 集合住宅の床荷重・搬入・200V大家承諾・退去毎の撤去原状回復・水風呂なしは“自在ととのい”と矛盾 |\n| 分析・市場 | 原案=NO-GO寄り／テーマ=条件付きGO | ベレオ母数が薄い・賃貸富裕層は身軽さ重視で据置と逆行・体験ファネル/持ち家/法人の方が筋 |\n\n## 決定的論点：積水ハウス不動産との関係（最優先で社長が決める変数）\n- 光和は積水の業務受託者。**その管理物件の入居者へ無断営業**は、委託契約の守秘義務・利益相反に抵触しうる＝**本業(定巡・退去・アフター)の受託を失う事業存続リスク**。\n- 裏返すと、**積水と“組めば”最強の販路**(質の高いリストに貸主公認のオプション設備として提案)。→ コンフリクトをアライアンスに転換するのが正攻法。\n\n## 社長の問いへの回答\n### 料金設定（経理試算・⚠️推測／最終は税理士確認）\n- 原価≒100万/台。**一括販売：標準158万・粗利約57万(粗利率36%)**、強気178万で粗利約77万も。受注生産＋前金30-50%で在庫・資金リスク回避。\n- **サブスクは“提携リース会社経由”推奨**：光和はリース会社へ一括卸(粗利を即現金化)、月額はリース会社設定(⚠️目安 月3〜3.5万/4年)。自社リースは1台ごと約100万の持ち出し＝資金繰り難でNG。\n### 契約に関わる制約\n- 賃貸借契約の**無断造作・重量物・改造禁止＋原状回復義務**。設置・電源増設は**貸主(積水/オーナー)の許可が原則必須**。\n- リース/サブスクの実質が割賦なら**割賦販売法**、反応者への販売は**特定商取引法(書面交付・クーリングオフ)**の対象になりうる。\n### 法規（社長想定「消防はあまり絡まない」の評価）\n- **概ね妥当**：電気ストーブ式は薪/ガスのような消防の直接規制は薄い。\n- ただし残る論点：**電気火災・低温やけど(PL責任)／200V増設は電気工事士＋大家許可／室内設置の換気・防水・結露→階下漏水賠償／火災保険の告知・改造扱い／共同住宅の管理規約**。→ **PL保険＋施設賠償保険は必須**。100V据置型に機種を絞ると②③が大幅に緩和。\n\n## 推奨ピボット（部長案・原案の差し替え）\n1. **積水ハウス不動産と公式に組む(B2B2C)**：高級賃貸の付加価値オプション/モデルルーム導入として共同提案。家主承認スキームとセット。←コンフリクト解消＆販路化。\n2. **KÖWA SAUNA 体験 → 自宅導入ファネル**：体験者・IG/GBP接点の“温かい見込み客”に案内(体験→見積→据付)。最も低コストで筋が良い。\n3. **ターゲット差し替え**：持ち家富裕層・別荘・新築/リノベ客・**法人福利厚生/BtoB(整体・エステ・サロン・小規模宿)**。光和のリフォーム/施工力と自然に噛む。リース/サブスクは法人と相性良。\n\n## もしやるなら最低条件（共通）\n1. **積水ハウス不動産の書面合意**(直販可否・情報利用・退去時撤去ルール・本業との切り分け)。無断展開は封印。\n2. 機種は**100V・工事不要・据置型に限定**(200V増設＝原則扱わない)。\n3. **設置可否の事前現地調査を必須化**(搬入・床荷重・電源・換気・原状回復条件)。\n4. リース/サブスクは**提携リース会社＋弁護士監修契約**(割販法/特商法・所有権留保・撤去/引揚げ)。\n5. **PL保険＋施設賠償保険**に加入してから販売。受注生産・前金で在庫リスク回避。\n\n## 要確認（実数を取り寄せて再計算）\n- 仙台圏ベレオの供給戸数・入居世帯(母数)／入居者属性の実態(⚠️“富裕層”はイメージか)\n- 想定機種の本体重量・電源(100V/200V・kW)＝設置可否判定の前提\n- 撤去/移設の標準費用(リース採算の生命線)・中古再販の可否\n- 光和の立場(販売店か輸入/製造元か＝PL責任主体)\n\n---\n**部長の具申**：技術論(消防)より先に「**チャネル＝無断か／積水と組むか**」を社長が決めるのが最優先。原案のまま広報がチラシ→ポスティング、は止めるべき。差し替え案(積水と組む or 体験ファネル/法人)なら本気で勝てる。\n\n---\n\n## 社長補足(2026-06-04)による更新 → 判定を前進\n\n社長から実物の事実が補足され、複数の懸念が解消・低減した：\n- **据置型・床付きユニット／重量100〜130kg**：階下漏水リスクは「床付き」でほぼ無し（現場/法務の漏水懸念を低減）。\n- **PSC認証取得済み**：製品安全の裏付けあり（安全面の安心材料。※ただし販売者/施工者のPL責任は残るため**PL保険は引き続き推奨**）。\n- **顧客情報は扱わない**：一般のポスティングと同様で、積水の入居者リスト等は使わない（個人情報・情報利用の懸念は解消）。\n- **原状回復**：契約書に「退去時に電線を切る・元に戻す・サウナを外す」を**事前明記**して対応可。\n- **リース会社と契約**：自社リースの資金ショート懸念に対し、**提携リース会社経由**で進める意向（経理の推奨と一致）。\n- **残価/再販**：状態が良ければ短期解約でも**次の顧客に使い回し可**、木材は**削れば再生**＝残価が残る（リース採算の弱点を大きく改善）。\n\n### 残る現実的論点（部長が正直に）\n1. **電気の専用回路工事はオーナー=管理会社の承認が必要**だが、これは**エアコン後付けの専用回路と同じ標準フロー**(社長整理 2026-06-04)。顧客から or 当社から管理会社へ承認依頼すれば足り、「積水の委託先だから特別」と身構える必要はない＝**一般的な工事屋と同じスキーム**で進める。退去時は原状回復(電線撤去・復旧)。\n2. **ポスティングの反応率は高額品ゆえ低い**前提は変わらず。→ ポスティングは“複数導線の1つ”に位置づけ、**体験ファネル/持ち家・法人BtoB**を併走させると効率が上がる。\n3. PSC認証は安心材料だが**PL保険＋施設賠償保険は加入**しておく。\n\n### 更新後の部長判定：**条件付きGOに前進**\n- 商材・据置・リース会社経由・原状回復の契約明記・再生による残価——条件が揃い、**事業として現実的にGO**できる水準。\n- ポスティングは実施してよい（一般配布として）。ただし**電気工事のオーナー承認が要る以上、積水への一言すり合わせを推奨**。販路はポスティング単独でなく体験/法人も併走。\n- 次アクション候補：①**リース提示込みの料金設計**(一括/リース月額・保証・原状回復条項) ②**チラシ(ポスティング用)案** ③積水へのすり合わせ要否の判断。\n"}, {"file": "SNS_バズ型投稿案_2026-06-04.md", "cat": "SNS", "title": "SNS バズ型 投稿案（サウナ系の勝ち構成を真似る）2026-06-04", "md": "# SNS バズ型 投稿案（サウナ系の勝ち構成を真似る）2026-06-04\n\n> 社長依頼：サウナ系アカウントのバズ投稿を探し、似た“構成”でKÖWA SAUNAの動画・フィード案を作る。\n> ※ 構成・型を参考にするのみ。他者の文章/画像は流用しない(オリジナルで作成)。\n> トーン：フレンドリー・絵文字OK。差別化の軸＝温度自在「自在ととのい」。\n\n## 参考にしたサウナ系アカウントとバズの共通構成\n- 参考：`@saunacollection`(サウコレ/154K・最大手メディア) / `@sauna_ao`(24K) / `@sauna_sisu_`(11K) / `@saunajoshi`。\n- バズ原則(2026)：①**冒頭2秒のフック**(テロップで言い切る) ②**保存率・完視聴率が最重要**→知識/保存系が強い ③**トレンド音** ④構成は**フック→中身→CTA** ⑤**縦9:16**・テンポ速いカット。\n- サウナ系で伸びる型：**保存される知識カルーセル**／**没入ASMR(湯気・水しぶき)**／**“○○な人へ”名指しフック**／**あるある共感**／**Before-After(作り込み)**。\n\n---\n\n# A. 動画案（リール / TikTok）\n\n### A-1.【保存版・知識系】水風呂が苦手な人ほど来てほしい理由\n- **型**：知識系リール(保存狙い)\n- **冒頭2秒フック(テロップ)**：「水風呂、無理して入ってない?🥶」\n- **構成(15-25秒)**：①フック→②「実は“冷たすぎ”が苦手の原因」→③「KÖWAは水風呂3〜42℃まで調整できる」(温度パネル/水面カット)→④「自分の“ちょうどいい”から始めれば、誰でも整える」→⑤CTA「保存して次のサ活に」\n- **音**：穏やか系トレンド音／**テロップ多め・ナレ無しでOK**\n- **キャプション**：「水風呂が怖い…そんな人こそ“自分好みの温度”から。KÖWAは3〜42℃で調整できる貸切サウナです🧊 ご予約はプロフから🔗」\n- **#**：`#サウナ初心者 #水風呂 #温度が選べるサウナ #自在ととのい #貸切サウナ #宮城サウナ #仙台サウナ #サ活 #fyp #おすすめ`\n\n### A-2.【没入ASMR・ルーティン】誰にも邪魔されない“ひとりととのい”\n- **型**：ASMR/ルーティン(完視聴狙い)\n- **冒頭2秒**：湯気のスローモーション＋テロップ「完全貸切のととのい、見せます☁️」\n- **構成**：ロウリュ(湯気)→水風呂(水しぶきslow-mo)→チェアへ→ブレインスリープでとろける顔/空。各3-4秒・テロップ最小。\n- **音**：環境音＋静かなトレンド音\n- **キャプション**：「サウナ→水風呂→外気浴→眠り。完全貸切だから、全部自分のペースで🛢️ KÖWA SAUNA」\n- **#**：`#ととのい #整いルーティン #バレルサウナ #完全貸切 #ブレインスリープ #宮城サウナ #サ活 #fyp`\n\n### A-3.【“○○な人へ”名指しフック】わがままサウナーに朗報\n- **型**：ターゲット名指し(刺し込み)\n- **冒頭2秒**：「“あの施設の温度が最高だった”が口ぐせのサウナーへ📢」\n- **構成**：共感→「温度って店ごとに固定だから、好みに当たるかは運」→「KÖWAはサウナ60-110℃・水風呂3-42℃を自分で設定」→「“最高の組み合わせ”を毎回作れる」→CTA\n- **キャプション**：「温度は“選ぶ”時代。自分だけのととのいを作れる貸切バレル🔥🧊」\n- **#**：`#サウナー #サウナ好きと繋がりたい #温度カスタム #自在ととのい #貸切サウナ #宮城サウナ #fyp`\n\n### A-4.【あるある共感】サ活の“あの不満”、うちで解決\n- **型**：あるある→解決\n- **冒頭2秒**：「サウナの“あるある不満”、3つ解決します😤→😌」\n- **構成**：「①水風呂ぬるい/冷たすぎ→温度調整可」「②人が多くて気まずい→完全貸切」「③整い椅子が埋まってる→チェア独り占め」テンポよくテロップ。\n- **キャプション**：「サ活の小さなストレス、貸切＋温度自在で全部解決🙌」\n- **#**：`#サウナあるある #貸切サウナ #ととのい #宮城サウナ #仙台サウナ #fyp #おすすめ`\n\n### A-5.【Before-After】倉庫を本気でサウナにした結果\n- **型**：Before-After/作り込み(リフォーム屋の強み)\n- **冒頭2秒**：「ただの倉庫が→こうなりました🔨」\n- **構成**：Before(倉庫)→施工カット早送り→After(バレル/水風呂/デッキ)→「リフォーム屋がサウナ好きの本気で作った」\n- **キャプション**：「本業はリフォーム屋。だから細部までこだわれる🛠️ KÖWA SAUNA」\n- **#**：`#リフォーム #DIY #サウナ作ってみた #バレルサウナ #宮城サウナ #fyp`\n\n---\n\n# B. フィード案（カルーセル＝保存系・サウナ系で最強の伸び）\n\n### B-1. 初心者向け「サウナの正しい入り方 5ステップ」\n- **表紙**：「初めてのサウナ、これだけ知れば大丈夫🔰(保存推奨)」\n- **スライド**：①体を洗う/拭く ②サウナ8-12分(下段から) ③水風呂30秒〜(無理しない) ④外気浴で“ととのい” ⑤2-3セット繰り返す ＋最後「貸切なら人目を気にせず練習できる→KÖWA」\n- **キャプション**：保存を促す一文＋予約リンク。`#サウナ初心者 #サウナの入り方 #ととのい #貸切サウナ #保存版`\n\n### B-2.「ととのいの黄金比」温度の早見表\n- **表紙**：「“ととのう”には黄金比がある🔥🧊」\n- **スライド**：サウナ温度×水風呂温度×外気浴時間の目安を数パターン表に(初心者向け/しっかり整えたい/マイルド)。→「KÖWAは全部“自分で設定”できる＝自在ととのい」\n- **狙い**：保存される実用知識＋差別化訴求を両立。`#ととのい #温度が選べるサウナ #自在ととのい #サ活 #保存版`\n\n### B-3.「水風呂が苦手な人へ」克服のコツ\n- **表紙**：「水風呂、無理しなくていい話🥶→😌」\n- **スライド**：①いきなり全身入らない ②手足から ③温度を上げてもOK ④羽衣を感じる ⑤KÖWAは3〜42℃で“ぬるめ”から練習できる\n- `#水風呂 #サウナ初心者 #ととのい #貸切サウナ #保存版`\n\n### B-4.「KÖWAの楽しみ方ガイド」(自店オリジナル)\n- **表紙**：「KÖWA SAUNAを120%楽しむ方法🧖‍♀️」\n- **スライド**：①温度を“自分仕様”に ②5種アロマから選ぶ ③3種チェアを使い分け ④ブレインスリープで眠る ⑤完全貸切＝全部独り占め\n- `#貸切サウナ #自在ととのい #宮城サウナ #仙台サウナ`\n\n---\n\n# C. 「毎日投稿AI広報担当」への接続\n- 上記 A/B は**“型(テンプレ)”**。型さえ決まれば、季節・天候・初心者ネタを当てはめて**毎日量産**できる(社長構想の広報担当AIの中身がこれ)。\n- 運用：AIが型に沿って日次ドラフト生成→社長/広報が承認→投稿。画像はCanvaテンプレ(表紙だけ差し替え)。\n- まず A-1/B-1 を1本ずつ試作→伸びを見て型を磨く(完視聴率・保存率を指標に)。\n\n> 参考: サウコレ等サウナ系メディアの保存系投稿/リール構成、及び2026年のリール・アルゴリズム動向(冒頭2秒・保存率・完視聴率重視)。\n"}, {"file": "アイデア会議録_2026-06-04.md", "cat": "会議録", "title": "サウナ事業 アイデア会議録（2026-06-04）", "md": "# サウナ事業 アイデア会議録（2026-06-04）\n\n> 社長依頼「各部門からアイデアを出し、部長が取りまとめて報告」。7チーム(サブエージェント)を招集し各5案=計35案を収集。\n> 本ファイル＝全案の記録。部長の取りまとめ・社長判断事項は末尾。\n\n---\n\n## 全体像：共通して浮かんだ3本柱\n\n1. **口コミ/UGCの獲得**（SNS・CS が重複提案）… 完全貸切=1組の満足度が濃い今が旬。サウナイキタイ(積極運用中)とGoogleへ誘導。\n2. **リピートの仕組み化**（CS・予約管理）… 現状ゼロ。退店後フォロー＋「温度カルテ」で再来理由を作る。\n3. **数字の見える化（月商10万の逆算）**（分析・経理）… 「あと何組」を毎朝表示し、全打ち手の優先度を決める起点に。\n\n横断テーマ：**差別化(温度自在/自在ととのい)をコンテンツ化・常連化に変換**／**空き枠(特に平日昼)を埋める**／**運用の安定と省力化**。\n\n---\n\n## 各チームの提案（◎＝そのチームの今すぐやる一推し）\n\n### 予約管理\n- 前日12時「空き枠ラスト1日」リマインド投稿の定例化（手間中/インパクト大）◎\n- リピート促進「次回お声がけ」テンプレ＋顧客リスト連携（小/中〜大）\n- ノーショー/直前キャンセルの「再販トリガー」（中/中）\n- クロスロック「取りこぼし監査」週次レポート（小〜中/中）\n- 法人/グループ「貸切まるごと」問い合わせ窓口テンプレ（中/大）\n\n### SNS運用\n- 「自在ととのいレシピ」シリーズ化（温度×水風呂×ととのい方を固定フォーマット）（中/大）\n- 投稿カレンダー＋ネタ在庫表（曜日×テーマを固定・脱\"毎回考える\"）（小/中）\n- UGC/口コミ誘発の「お見送り導線」固定化（中/大）◎\n- TikTok「トレンド音×フック」型ライブラリ（小〜中/中）\n- リール定期再投稿の半自動リマインド（小/中）\n\n### 経理\n- ¥-100調整漏れ(HPBポイント)ゼロ化・自動チェック（小〜中/中）◎\n- 客単価KPIを「組単価」と「1人単価」の2軸で可視化（小/大）\n- オプションを「3階層(ドリンク/体験/グレードアップ)」で固定化（中/大）\n- 月次「数字1枚」サマリー（無料→有料転換後のベースライン管理）（中/中〜大）\n- ノーショー/キャンセル料の請求もれ防止 記録ルール（小/中）\n\n### 顧客対応(CS)\n- 退店当日「お礼＋温度メモ＋口コミ依頼」フォロー（小/大）◎\n- 「マイ温度カルテ」リピート再来カード（中/大）\n- 3回来店で「常連」特典(値引きでなく体験厚め)（中/中〜大）\n- 予約直後の「初めての方ガイド」自動フォロー（小〜中/中）\n- 口コミ・SNSを「拾って返す」常連エンゲージ運用（小/中〜大）\n\n### 運用保守(bot)\n- **SBセッション切れ即時通知**(v3.7最優先)（小〜中/大）◎\n- ハートビート監視(各タスクの死活を外形監視)（中/大）\n- 日次ヘルスサマリー(朝1通)（中/中〜大）\n- no_block0 自動リトライ＋残置一覧化（中/中）\n- 祝日判定の単一ソース化(jpholiday＋手動上書き)（小〜中/中）\n\n### 集客・PR\n- トリドリ起用の「型」化＋投稿ジオタグ徹底（小/中〜大）\n- **GBP/MEO**「サウナ」での発見性てこ入れ（小〜中/大）◎\n- 地元・杜の丘 近隣事業との相互送客（中/中）\n- 法人/団体・福利厚生の窓口＋1枚提案資料（中/中〜大）\n- 取材実績の資産化＋次の取材先リスト化（中/中）\n\n### 分析\n- 月商10万円「逆算ボード」週次トラッキング（中/大）◎\n- 稼働率KPIの自動算出(カレンダー基準)（中/大）\n- 曜日×時間帯×チャネル ヒートマップ（中/中〜大）\n- リピート率ダッシュボード（小〜中/中）\n- 月次ワンページ・サマリー（中/中）\n\n---\n\n## 🔔 部長の取りまとめ：まず動く5つ（横断・費用対効果順）\n\n1. **退店時の口コミ＆フォロー導線**（CS◎＋SNS◎を統合）\n   退店当日に「当日の温度設定メモ＋お礼＋口コミ依頼(Google/サウナイキタイ)」をテンプレ送信＋店内QR。手間小・効果大、満足度が濃い\"今\"が旬。口コミとリピートに同時に効く。\n2. **GBP/MEOてこ入れ**（PR◎）\n   社長Gアカウントで即着手・費用ゼロ・「仙台 サウナ 貸切」から予約直結。他施策の土台。\n3. **月商10万 逆算ボード＋稼働率**（分析◎＋経理）\n   既存シートに「あと何組必要か」を毎朝表示。全打ち手の優先度の起点。\n4. **投稿の仕組み化**（SNS：投稿カレンダー＋再投稿リマインド）\n   いま立ち上げ中のTikTok再投稿を「貼るだけ」で続く形に。週数回を仕組みで維持。\n5. **SBセッション切れ即時通知**（bot◎）\n   v3.7最優先・最大の運用弱点。「止まったのに気づかない」を撲滅。既存LINE流用で手間小。\n\n中期で効く差別化資産化：**自在ととのいレシピ(SNS)＋マイ温度カルテ(CS)**＝温度自在をコンテンツと常連化に変換。\n\n---\n\n## ⚠️ 社長に決めてほしいこと（これが決まると複数施策が前進）\n\n1. 経理は **光和工業と合算 / サウナ単体** どちらか（月次・税務設計の前提）\n2. **温度カスタムの有料オプション化** 可否（客単価UPの本命候補）\n3. **法人/団体** の料金・最大人数・受付可否（平日昼の空き枠を埋める）\n4. **リピート特典/口コミ特典** の方向（値引きより\"体験を厚く\"を推奨）と可否\n5. 逆算の精度上げのため、**直近の予約データ(平日:土日比・1名:複数名比)を部長が集計**してよいか\n\n---\n\n## 次の一手\n上記「まず動く5つ」から着手対象を選ぶ。部長の一推しは **①退店時の口コミ導線 ＋ ②GBP** を同時着手、並行で **③逆算ボード**。\n"}, {"file": "下書き_GBP口コミ返信_2026-06-04.md", "cat": "下書き", "title": "GBP口コミ返信 下書き（KÖWA SAUNA）2026-06-04", "md": "# GBP口コミ返信 下書き（KÖWA SAUNA）2026-06-04\n\n> **前提：GBPは公開情報です。この下書きの実反映は必ず社長（佐藤様）の明示許可を得てから行ってください。**\n> Gmail検索結果：businessprofile-noreply@google.com から7件の口コミ通知を確認。\n> 🔔 **未返信は No.1 oimoさんの1件のみ**（社長確認 2026-06-04）。**No.2〜7は返信済み**＝対応不要（記録として下に残置）。\n> → **今すぐ投稿対象は No.1 だけ**です。\n\n---\n\n## No.1 — oimo さん（★★★★★ / 2026-05-31）🔔【未返信＝今すぐ投稿対象】\n\n### 口コミ全文（社長より共有 2026-06-04）\n> 水風呂最高だしブレインスリープのマットと枕が特に良過ぎた。\n> 個室サウナ初めて行ったけど周りに他人がいないのが凄い快適だから、混んでるのが嫌だって人は行ってみた方が良い。\n\n（★4枚の写真付き）\n\n### 返信下書き（推奨・コピペ可）\n\n```\noimoさん、嬉しい口コミ本当にありがとうございます🥹\n水風呂を「最高」と言っていただけて感激です🧊 実は水温は3〜40℃まで自由に変えられるので、次回はぜひ\"自分のちょうどいい冷たさ\"も探してみてください🔥\nそしてブレインスリープのマット＆枕…あのとろける感じ、わかってもらえて嬉しいです☁️\n「周りに他人がいない快適さ」は完全貸切でいちばん大切にしているところなので、そう感じていただけて作り込んだ甲斐がありました🙏 混雑が苦手な方にもぜひ薦めてもらえたら嬉しいです😊\nまたのお越し、心よりお待ちしています！\n```\n\n### 返信下書き（短め・あっさり版）\n\n```\noimoさん、最高の口コミありがとうございます🥹🔥\n水風呂とブレインスリープ、気に入っていただけて嬉しいです☁️ 水温は3〜40℃までお好みに変えられるので、次回もぜひ🧊\n完全貸切の「周りを気にしない快適さ」、これからも守り続けます🙏 またお待ちしてます😊\n```\n\n### 当てた型\n型1（高評価・温度/水風呂）＋型3（ブレインスリープ）＋型2（貸切・個室の快適さ）の合わせ技。口コミの3つの誉めどころすべてに触れて返す。\n\n---\n\n## No.2 — ソウフルサトさん（★★★★★ / 2026-05-26）\n\n### 口コミ要約\nサウナ上級者の知人に連れてきてもらったのが初来店。サウナ内でのおしゃべりが楽しかった様子（英訳の冒頭「おしゃべりしながら…知らなかった」という内容）。全文はGBP管理画面でご確認ください。\n\n### 返信下書き（コピペ可）\n\n```\nフルサトさん、口コミありがとうございます！🥹\nサウナ上級者の方に連れてきていただいたとのこと、嬉しいです☁️\n完全貸切だから、自分のペースでゆっくりおしゃべりしながら整える——\nそういう使い方、まさに大歓迎です😊\n実は温度も毎回変えられるので、次はご自分好みの\"自在ととのい温度\"を\nぜひ探しにきてください🔥 またのご来店お待ちしています！\n```\n\n### 当てた型\n型2（高評価・貸切/プライベートを褒めている口コミ）パターンB + 型4（初回来店）アレンジ\n\n---\n\n## No.3 — 山元天斗さん（★★★★★ / 2026-05-23）\n\n### 口コミ要約\n評価のみの投稿（テキスト本文なし）。星5つ。\n\n### 返信下書き（コピペ可）\n\n```\n山元天斗さん、5つ星をありがとうございます🥹\nご来店いただけたこと、スタッフ一同とても嬉しいです！\nまたいつでもお気軽にどうぞ☁️\n次回は温度の組み合わせを変えて、また違う\"自在ととのい\"を\n楽しんでいただけたら嬉しいです🔥\nぜひまたのご来店お待ちしています！\n```\n\n### 当てた型\n型4（初回来店っぽい口コミ）パターンA アレンジ（本文なしのため汎用的に）\n\n---\n\n## No.4 — 伊藤謙さん（★★★★★ / 2026-05-12）\n\n### 口コミ要約\n「大富エリア（大和町・富谷市）でこれから注目される…」という書き出しで、地域の貴重なサービスとして評価している内容。全文はGBP管理画面でご確認ください。\n\n### 返信下書き（コピペ可）\n\n```\n伊藤謙さん、温かい口コミをありがとうございます！✨\n大和町・富谷エリアの皆さんに気軽に\"本格ととのい体験\"を\n届けられればと思っているので、そう言っていただけて励みになります🙏\n当店はサウナ温度も水風呂温度も自由に設定できるので、\n大富エリアのご自宅から近い感覚で、気分に合わせた温度に変えながら通ってもらえたら最高です🔥\nまたぜひお越しください！いつでもお待ちしています😊\n```\n\n### 当てた型\n型1（高評価・温度に触れている口コミ）パターンB アレンジ（地域性・リピート誘導を加味）\n\n---\n\n## No.5 — 大村斗真さん（★★★★ / 2026-04-26）\n\n### 口コミ要約\n初来店でリラックスした時間を過ごせた、という内容（英訳冒頭「初めて来た場所でくつろぎの時間を楽しんだ。The…」で終わっており全文はGBP管理画面でご確認ください）。星4つ。\n\n### 返信下書き（コピペ可）\n\n```\n大村斗真さん、はじめてのご来店ありがとうございます！🎉\nリラックスしていただけたようで本当によかったです☁️\n初回で「ととのう感覚」をつかんでいただけたなら、\n2回目はさらに楽しくなると思います😊\n温度も毎回変えられるので、次はもう少し熱め・冷ためなど\nご自分好みの組み合わせを試しに来てみてください🌡️\nまたのご来店、心よりお待ちしています！\n```\n\n### 当てた型\n型4（初回来店っぽい口コミ）パターンA アレンジ\n\n---\n\n## No.6 — いぶりがっこさん（★★★★★ / 2026-04-25）\n\n### 口コミ要約\n初めての貸切サウナ体験で期待以上だったという内容（英訳冒頭「初めての貸切サウナで期待を超えた…」全文はGBP管理画面でご確認ください）。\n\n### 返信下書き（コピペ可）\n\n```\nいぶりがっこさん、口コミありがとうございます🥹\n「期待以上だった」——こんなに嬉しい言葉はないです！\n初めての貸切サウナ体験、楽しんでいただけて本当によかったです☁️\n完全貸切だからこそ、温度も時間の使い方も全部自分流にできる——\nそんな\"自在ととのい\"を毎回楽しんでいただけたら😊\nぜひ次回は違う温度の組み合わせも試しにいらしてください🔥\nまたのご来店、お待ちしています！\n```\n\n### 当てた型\n型2（高評価・貸切/プライベートを褒めている口コミ）パターンA + 型4（初回来店）ミックス\n\n---\n\n## No.7 — あいさん（★★★★★ / 2026-04-23）\n\n### 口コミ要約\n「一言で言うと最高のサウナ。完全貸切でバレルサウナを楽しめる…」という内容（英訳）。全文はGBP管理画面でご確認ください。\n\n### 返信下書き（コピペ可）\n\n```\nあいさん、「最高のサウナ」——ありがとうございます！🥹\nこんなに嬉しいお言葉、スタッフ一同で読ませていただきました😊\n完全貸切のバレルサウナで、他のお客様を気にせず\n自分だけのペースで整えられる——それが私たちが大切にしていることです☁️\nサウナ温度も水風呂温度も毎回変えられるので、\n次回もぜひ\"自在ととのい\"の探求を続けにきてください🔥\nいつでもお待ちしています！\n```\n\n### 当てた型\n型2（高評価・貸切/プライベートを褒めている口コミ）パターンB アレンジ\n\n---\n\n## 返信作業の手順（リマインド）\n\n1. GBP管理画面（`business.google.com` → 社長Gアカウント `hiroakikouwa5@gmail.com`）にアクセス\n2. 「口コミ」セクションで各口コミの**全文を確認**し、内容と下書きのズレがないか照合\n3. 上記下書きをコピーして「返信する」欄に貼り付け\n4. 必要に応じて口コミ全文に合わせて微調整（`◯◯`の実値置換など）\n5. **社長の確認・OKをもらってから投稿**\n\n---\n\n## ⚠️ 社長への確認事項\n\n- 各口コミの**全文はGBP管理画面でのみ確認可能**（メール通知には冒頭の英語翻訳のみ）。投稿前に全文を読んで下書きとの整合確認をお願いします。\n- No.3（山元天斗さん）は評価のみの投稿のため汎用的な文面にしています。実際にGBPで本文があるか確認してください。\n- **返信済みかどうか**はメールからは判定不可です。GBP管理画面でご確認の上、未返信の分のみ投稿してください。\n- No.5（大村斗真さん）は星4つです。本文に不満のニュアンスがあるようなら型6（低評価対応）に差し替えをご検討ください。\n\n---\n\n*作成：PR/集客チーム（2026-06-04） / 反映作業は社長許可のうえで*\n"}, {"file": "下書き_ブレインスリープ本社問い合わせ_2026-06-04.md", "cat": "下書き", "title": "下書き：ブレインスリープ営業窓口への確認（※価格は取得済・本問い合わせは原則不要）", "md": "# 下書き：ブレインスリープ営業窓口への確認（※価格は取得済・本問い合わせは原則不要）\n\n> 作成：物販・BtoB営業チーム（部長直轄ライン）　2026-06-04 ／【2026-06-04 更新】\n> 位置づけ：**価格・掛け率は社長の手元で確定済みのため、当初の「価格問い合わせ」は不要になった。** 残るのは客先提案を仕上げる際に要る書類のみ。\n\n---\n\n## 🔔 結論（2026-06-04 更新）：聞くことは下記4点だけ・しかも商談時でOK\n\n**確定済み（聞かなくてよい）**\n- 主力SKU＝**ピロー（定価33,000円〜）／マットレス フロート（S 88,000円〜）／（場所により）オーバーレイ（44,000円〜）**\n- **掛け率 70%**（卸＝定価×0.70）。定価は公式サイト `collections/all` で取得可能。\n\n**営業窓口・吉田さんに確認するのは、客先提案を出す段になったら下記だけ：**\n\n| # | 聞くこと | なぜ要るか | いつ |\n|---|---|---|---|\n| 1 | **防炎・難燃の適合証明書（PDF）はあるか** | 介護・宿泊施設は消防法で施設側が書面提示を求める | 介護/宿泊の商談時 |\n| 2 | **商品画像・ロゴ・使ってよい表現リスト**をもらえるか | チラシ・提案書への転用（誇大NG回避） | チラシ作成時 |\n| 3 | **代理店経由のリース・分割**はメーカー的に可か | 提携リース会社で月額提示する場合 | リース提案時 |\n| 4 | （念のため）**掛け率は税抜/税込どちらの定価基準か・サイズ違い/上位フロートも同率か** | 卸・粗利の正確な算定 | 次回打合せで口頭で十分 |\n\n> 営業窓口：**吉田 貴則 様（株式会社ブレインスリープ）takanori.yoshida@brain-sleep.com** ／ 既に商談中（打合せ実績・Teams会議あり）。次回打合せの場で1・2を口頭で頼めば足りる。\n\n---\n\n## 0. 会社情報（参考・2026-06-04 公式サイトで確認）\n\n| 項目 | 内容 |\n|---|---|\n| 運営会社 | 株式会社ブレインスリープ |\n| 本社所在地 | 〒100-7026 東京都千代田区丸の内2-7-2 JPタワー26F |\n| 代表者 | 代表取締役 廣田 敦 |\n| 営業窓口 | 吉田 貴則 様 takanori.yoshida@brain-sleep.com |\n| 法人フォーム（担当不在時） | https://brain-sleep.com/pages/c-contact |\n\n---\n\n> 📎 以下は当初作成した詳細チェックリスト・問い合わせ文の全文。**価格取得済みのため大半は不要**だが、将来「正式な取引条件書をまとめて取り寄せたい」場合の素材として残置。通常は上の4点で足りる。\n\n---\n\n## 1. 取得すべき情報チェックリスト（優先度付き）\n\n### A. 価格・ラインナップ（最優先：提案書の最大ブロッカー）\n\n- [ ] **正規代理店としての卸価格（モデル別）**\n  - マットレス（サイズ別：シングル / セミダブル / ダブル / 施設用特注サイズ 等）\n  - ピロー（通常モデル / 高さ調整モデル 等）\n  - 掛布団・ベッドカバー類（セット販売の構成あれば）\n  - その他の主力ラインナップ（クッション・トッパー等）\n- [ ] **希望小売価格（消費者向け定価）のモデル別一覧**（客先に提示できる参考価格として）\n- [ ] **BtoB法人向けの特別価格・数量割引条件**（○点以上からの割引率、施設向け特別プラン等）\n- [ ] **価格改定の予定時期・有効期間**（提案書の価格情報が陳腐化しないよう管理するため）\n\n### B. 販促ガイドライン・表示ルール（必須：誇大表現NG遵守のため）\n\n- [ ] **代理店向けの販促ガイドライン・表示基準の最新版資料**（あれば送付を依頼）\n- [ ] **使ってよい表現・NG表現の明確な線引き**\n  - 「睡眠の質向上」「回復睡眠」「疲労回復」などの表現の可否\n  - 「耐水」「濡れたまま使用可」という表現を代理店の販促物に使えるか（公式見解）\n  - 「丸洗いできる」「丸洗い可能」という表現の可否と条件\n  - 「蒸れにくい」「通気性が高い」という表現の可否\n  - 「床ずれ配慮」「介護向け」という表現の可否と注意事項（医療効果断定はNG前提）\n- [ ] **「科学的エビデンス」「睡眠科学に基づく」等の引用可能な表現の範囲と出典条件**\n\n### C. 施設向け安全規格・認証（介護・宿泊施設への提案に必須）\n\n- [ ] **防炎・難燃性に関する公的規格への適合状況**（消防法施行令の適用・防炎物品の指定等）\n  - 旅館・ホテル等の宿泊施設への設置に使用できるか\n  - 老人ホーム・サービス付き高齢者向け住宅・介護施設への設置に使用できるか\n  - 病院・療養病棟への設置に使用できるか\n- [ ] **適合規格の証明書・試験報告書の入手方法**（営業先から「規格証明を見せてほしい」と言われたときに提示できる書面）\n- [ ] **衛生面の認証・ガイドライン適合**（ホテル・介護施設が要求する感染対策・清潔管理の規準）\n\n### D. 「耐水・丸洗い・濡れたまま使用可」の公式見解（提案書中核訴求の裏取り）\n\n- [ ] **「耐水」「防水」の正確な仕様説明**（どの部位が耐水で、どの条件まで対応か）\n- [ ] **「丸洗い」の具体的な洗濯条件**（家庭用洗濯機 / 業務用洗濯機 / 手洗いの別、温度・回転数の推奨値）\n- [ ] **「濡れた状態での使用」の公式な推奨有無**（サウナ後・水着のままでの使用を公式として許容しているか）\n- [ ] **繰り返し洗濯後の耐久性・品質保証の範囲**（法人向けの多頻度洗濯を想定したデータがあれば）\n\n### E. リース・分割・代理店経由の取り扱い条件\n\n- [ ] **代理店経由でのリース・分割販売は可能か**（提携リース会社を通じた取り扱いの可否）\n- [ ] **リース・レンタル形態の際のメーカーポジション**（メーカーとして推奨するか、禁止事項等）\n- [ ] **代理店の販売形態の制約**（ネット通販の可否、展示会販売の条件、二次卸の可否）\n\n### F. 納期・最低発注ロット・在庫状況\n\n- [ ] **通常納期**（注文から納品までの標準リードタイム。モデル別に異なれば別途）\n- [ ] **最低発注ロット（MOQ）**（モデル別・数量・金額の基準）\n- [ ] **大口・施設向けの一括発注時の納期・在庫対応**（10点以上・100点以上のロット対応可否）\n- [ ] **欠品・取り寄せになる場合の代替手配の仕組み**\n\n### G. 3点セット・バンドル販売時の条件・共同販促\n\n- [ ] **「サウナ＋水風呂＋ブレインスリープ」というバンドル提案・セット販売に関する可否・条件**\n- [ ] **共同販促物（チラシ・POP・動画・Webバナー等）の有無・入手方法**\n- [ ] **正規代理店として使用できるブランドロゴ・商品画像・販促素材のガイドライン**\n- [ ] **展示会への共同出展・サポートの実績・仕組みの有無**\n- [ ] **他の正規代理店との差別化・光和工業のポジショニング**（同一エリアでの競合代理店の有無）\n\n### H. 介護・福祉・スポーツ向けエビデンス・事例資料\n\n- [ ] **介護施設・宿泊施設への導入事例・事例資料**（名称非開示のものも含め、商談で使える事例の提供可否）\n- [ ] **「回復睡眠」「睡眠の質向上」に関する論文・試験データ・研究機関との連携有無**（過度な医療的断定表現を避けながら科学的根拠を示せる形の資料）\n- [ ] **スポーツチーム・アスリートへの導入事例・公式サポート事例**（スポーツリカバリー市場向け提案の補強材料として）\n\n---\n\n## 2. 問い合わせ文の下書き\n\n> 宛先・差出人はプレースホルダー[ ]のままで、社長が送信時に補記してください。\n> メール・問い合わせフォーム・電話連絡いずれにも対応できる文面です。\n> 用途に応じて件名・書き出しを調整してください。\n\n---\n\n**件名：正規代理店としての価格・取り扱い条件の確認について（株式会社光和工業）**\n\n---\n\n[担当者様のお名前] 様\n\nお世話になっております。\n株式会社光和工業の[差出人の氏名・役職]と申します。\n\nこの度は、貴社ブレインスリープ製品の正規代理店として、BtoB向けの提案・販売活動を本格的に推進するにあたり、いくつか確認させていただきたい事項がございます。\n\n弊社は宮城県を拠点として、サウナ施工・販売（バレルサウナ・家庭用サウナ等）と、アイスバス（チラー水風呂）の法人向け販売を展開しております。また、自社施設「KÖWA SAUNA」を体験ショールームとして活用しながら、「サウナ＋水風呂＋ブレインスリープ寝具」の3点セット提案を温浴施設・宿泊施設・介護施設・スポーツ施設・企業の熱中症対策等のBtoBマーケットに向けて行う計画を立てております。\n\nこの3点セット提案を客先提出レベルの資料に仕上げるため、下記の項目についてご教示・資料のご提供をお願いできますでしょうか。\n\n---\n\n### ご確認いただきたい事項\n\n**1. 価格・ラインナップ**\n\n正規代理店向けの卸価格、ならびに希望小売価格（消費者向け定価）について、主力モデル（マットレス各サイズ・ピロー・掛布団類等）別の一覧をご共有いただけますでしょうか。\nあわせて、法人・施設向けの数量割引や特別価格条件がございましたらご案内ください。\n\n**2. 販促ガイドライン・使用可能な表現のルール**\n\n代理店が営業・販促資料で使用してよい表現の基準について、最新のガイドラインをご提供いただけますでしょうか。\n特に、「耐水」「濡れたまま使用可」「丸洗い可能」「回復睡眠」等の表現を提案書・チラシ・展示会資料に記載する際の可否と条件を確認させてください。\n\n**3. 施設向け安全規格（防炎・難燃等）**\n\n宿泊施設・介護施設・高齢者向け住宅への提案において、防炎・難燃性に関する公的規格の適合状況をご確認させてください。施設側の購買担当から「防炎規格の適合証明を提示してほしい」というケースが想定されます。証明書・試験報告書の入手方法もあわせてお教えください。\n\n**4. 「耐水・丸洗い・濡れたまま使用」の仕様・推奨条件**\n\n代理店の販促における「耐水」「丸洗い可能」「濡れた状態での使用許容」の公式な根拠資料をいただけますでしょうか。また、業務用洗濯機での洗濯に関する推奨条件・耐久性のデータがあればご共有いただけると幸いです。\n\n**5. リース・分割販売への対応可否**\n\n弊社は提携リース会社を通じて設備のリース提案を行っております。ブレインスリープ製品についても代理店経由でのリース・分割販売が可能かどうかをご確認ください。\n\n**6. 納期・発注ロット・在庫対応**\n\n通常の納期目安、最低発注ロット（モデル別）、および施設向けの大口発注に対する在庫・リードタイムの対応状況をお教えください。\n\n**7. バンドル販売・共同販促物**\n\n「サウナ＋水風呂＋ブレインスリープ」のセット提案を進めるにあたり、共同販促物（チラシ・商品画像・販促素材）の使用条件、ならびにメーカーとして共同販促の仕組みや展示会サポート等があればご案内ください。\nまた、商談の場で使用できる導入事例資料・エビデンス資料（介護施設向け・スポーツ施設向け等）がございましたら、あわせてご提供いただけますでしょうか。\n\n---\n\n大変お手数をおかけしますが、上記ご回答・資料の送付をご検討いただけますでしょうか。\nご不明な点がございましたら、遠慮なくお申し付けください。\n\n今後も貴社製品の販売拡大に注力してまいりますので、引き続きご支援・ご指導のほどよろしくお願い申し上げます。\n\n---\n\n株式会社光和工業\n[差出人の氏名]\n[役職・部署名]\n[電話番号]\n[メールアドレス]\n[会社住所：宮城県黒川郡大和町杜の丘1-10-1（本社）]\n\n---\n\n## 3. 取得後の対応表（取得項目→提案書の該当箇所）\n\n| 取得する情報 | チェックリスト項目 | 提案書（`提案_物販3点セット_`）の埋め先 | ⚠️確認事項 |\n|---|---|---|---|\n| モデル別卸価格・希望小売価格 | A. 価格・ラインナップ | §3「単品価格」表のブレインスリープ行（現在⚠️）→ 型番/価格を記入 | 客先転用版は原価列を除いて小売参考価格のみ掲載 |\n| 法人・数量割引条件 | A. 価格・ラインナップ | §3「3点セット バンドル提示」表のブレインスリープ合算額→ 3プランの「⚠️」欄を埋める | セット値引きは経理と粗利確認後に決定 |\n| リース月額（寝具分） | A. 価格・ラインナップ＋E. リース | §3「リース・分割の選択肢」表の「3点セット」行の⚠️欄 | リース会社料率と組み合わせて確定 |\n| 使用可能な表現・NG表現 | B. 販促ガイドライン | §1「3点セットの提案コンセプト」の記述の適否確認 / §2「強調するメッセージ」各行の文言修正 | 特に「濡れたまま寝られる」「回復睡眠」「整い寝具」の表現を確認 |\n| 使用可能な表現・NG表現 | B. 販促ガイドライン | §5「付録：3点セット 営業トーク1枚サマリー」の「耐水・通気・丸洗い。濡れたまま横になれる整い寝具」の文言確認 | 客先転用版に転記する前に必ず適否確認 |\n| 防炎・難燃規格の適合証明 | C. 施設向け安全規格 | §2-C「介護・高齢者施設」想定問答「防炎規格は合っているか」の回答欄（現在⚠️「社内確認要」）→ 確定回答に更新 | 宿泊・介護施設向け客先提出版には必ず添付or提示可能状態にする |\n| 「耐水・丸洗い・濡れたまま使用」の公式仕様 | D. 耐水・丸洗いの公式見解 | §1「使い方（社長確認 2026-06-04）」の注記の精度を上げる / §2-A・Bの「メッセージ」欄の根拠として裏取り | 「1商材で2役」のコンセプトの公式根拠として活用 |\n| 業務用洗濯機の洗濯条件・耐久性 | D. 耐水・丸洗いの公式見解 | §2-A「施設向けの丸洗い訴求」の詳細補強 / §5-B「客室に置ける寝具か」回答の精度向上 | 介護・宿泊施設向けにはプロ洗濯機前提の検証データがあると刺さる |\n| リース・分割の可否・条件 | E. リース | §3「リース・分割の選択肢」ならびに §2の各ターゲット「リース適性」欄の記述精度向上 | 提携リース会社側の受け入れ可否とセットで確認 |\n| 納期・MOQ・在庫対応 | F. 納期・発注ロット | §6「次アクション」表に実数を追記（現在は空欄） | 展示会向けサンプル確保・フラッグシップ無償設置の検討に必要 |\n| バンドル販売の条件・共同販促物 | G. バンドル・共同販促 | §4「営業導線」のリード獲得フロー「F. SNS・インフルエンサー起用」欄の補強 | 共同チラシ・画像の使用条件は必ず書面で確認してから集客PRチームに共有 |\n| 導入事例資料（介護・スポーツ等） | H. 事例・エビデンス | §2-C「介護向け」想定問答・§2-D「スポーツ向け」想定問答の裏付け資料として添付 | 事例の名称・写真使用は書面許可が前提（ブレインスリープ側の許諾条件も確認） |\n| エビデンス・研究データ | H. 事例・エビデンス | §1「3点セット相性の5つの理由」③「回復睡眠でサイクルが完結」の根拠補強 | 断定表現禁止ガイドライン遵守のうえで「参考データ」として引用 |\n\n---\n\n## 4. 問い合わせ後の次アクション（部長への申し送り）\n\n### 送信後・回答受領後に動くこと\n\n1. **回答受領 → 上記対応表に沿ってチェックリストを1項目ずつ埋める**\n   提案書の「⚠️未取得」マークを順次確定値に更新する。\n\n2. **販促ガイドライン適合チェックを最初に実施する**\n   価格が確定しても、表現がガイドライン違反なら客先転用版は作れない。\n   「使用可能な表現リスト」が届いた時点で提案書の文言を一括点検する。\n\n3. **防炎規格の確認が取れた時点で介護・宿泊向け提案を先行リリース可**\n   介護・宿泊はブレインスリープ単品が入り口になるため、規格確認さえ取れれば\n   サウナ・水風呂価格確定を待たずに介護向け単品提案から商談を開始できる。\n\n4. **価格・リース月額が確定したら経理チームへ連携**\n   3点セットの採算（粗利率・セット値引き上限）を経理に依頼して確定する。\n\n### 部長への次の一手（1つ）\n\n**「防炎・難燃規格の適合証明」が届いた段階で、介護施設ターゲットのブレインスリープ単品営業用1枚チラシ（叩き台）を作成する。**\n理由：介護施設はブレインスリープが最も独自性の高いセグメント（構想ファイルのC項）であり、サウナ・水風呂の価格確定を待たずに先に動ける。防炎規格の裏が取れれば即提案可能状態になるため、資料を先行して準備しておく。\n担当：物販・BtoB営業チームが叩き台を作成 → 部長確認 → 社長チェック。\n\n---\n\n> ⚠️ 確認事項まとめ（送信前に社長が判断）\n> - 送付方法：既存の正規代理店担当がいれば**その担当へ直接**、いなければ**CORPORATEフォーム**（https://brain-sleep.com/pages/c-contact ）から送る。どちらで行くか社長が判断\n> - 差出人欄（氏名・役職・電話・メール）の[ ]を埋める\n> - 問い合わせ7項目のうち「優先して早期回答がほしい項目」を社長が口頭で伝えると回答速度が上がる（推奨順：A価格 → B表現ルール → C防炎規格）\n\n> 作成：物販・BtoB営業チーム　確認：部長 → 社長チェック待ち\n"}, {"file": "台帳_補助金_2026-06.md", "cat": "台帳", "title": "補助金台帳（初版）光和グループ 全BtoB共通", "md": "# 補助金台帳（初版）光和グループ 全BtoB共通\n\n> 作成：補助金ウォッチ担当（kowa-subsidy-watch）　2026-06-04\n> 更新ルール：月次定期更新 + 公募期は随時更新\n> 次回更新目安：2026年7月上旬（省エネ2次・業務改善助成金申請開始・新事業進出5回公募確認）\n\n---\n\n## ⚠️ 免責・運用原則（必ず最初に読む）\n\n1. **本台帳は情報提供・提案まで**。申請代行・採択保証・要件可否の最終判断は行わない。\n   申請実務は認定支援機関または行政書士へ橋渡しする。\n2. **「必ず通る」とは絶対に言わない**。制度・予算は年度・公募回ごとに変動する。\n   顧客提案時は必ず最新の公募要領を確認してから使うこと。\n3. **補助金ありきで不要投資を勧めない**（顧客本位）。\n4. **公募期間・予算枠は締切・予算消化で予告なく終了**する場合がある。\n5. ⚠️「最新公募要領 未確認」と明記した項目は推測ではなく事実不明として扱い、\n   顧客提案前に必ず公式ソースで再確認すること。\n\n---\n\n## 橋渡し先（専門家）\n\n| 役割 | 備考 |\n|---|---|\n| 認定支援機関 | 中小企業庁 検索ページで近隣を探す → https://ninteishien.force.com/NSK_CertificationBody |\n| 行政書士 | 補助金申 ★ | 省エネ補助金（設備単位型）2次公募 | **2026-07-09** | チラー・乾燥機の省エネ提案に添える。残り1ヶ月 |\n| ★ | エイジフレンドリー補助金 熱中症対策コース | 2026-10-31 | 受付中。チラー水風呂提案に必ず添える |\n| ★ | 小規模事業者持続化補助金 第20回 | 2026-12-15 | 半年後。小規模開業者への準備案内を今から |\n| ★ | 業務改善助成金 | 2026-09〜11月 | 設備導入＋賃上げの顧客向け。9月開始前に計画立案促進 |\n\n---\n\n## 運用ルール・更新スケジュール\n\n| タイミング | 実施内容 |\n|---|---|\n| **月次（毎月上旬）** | 各補助金の公募状況を公式ソースで確認・台帳更新 |\n| **公募期中（随時）** | 新規公募の発見・締切変更を即時反映 |\n| **案件発生時** | 顧客業種・投資内容に合わせてマッチング表を参照し提案書に添付 |\n| **年度末（3〜4月）** | 次年度の公募予告を確認し台帳をリセット更新 |\n\n### 監視ソース（毎回確認）\n\n- 中小企業庁 公式：https://www.chusho.meti.go.jp/\n- ミラサポplus：https://mirasapo-plus.go.jp/\n- J-Net21：https://j-net21.smrj.go.jp/\n- jGrants：https://jgrants.go.jp/\n- 宮城県 補助金：https://www.pref.miyagi.jp/life/7/25/331/index.html\n- 大和町：大和町役場 産業振興課（直接確認）\n\n---\n\n> 作成：補助金ウォッチ担当（kowa-subsidy-watch）\n> 部長確認 → 社長チェック待ち\n> ✅ 方針(社長判断 2026-06-04)：専門家の連携先確保は「具体的な営業案件が出てから」。今は台帳整備＋月次ウォッチを優先する。\n> ⚠️ 次アクション：月次ウォッチの定着（次回更新=2026年7月上旬）。補助金が刺さる商談が立ったら、締切（デジタル化6/15・新事業進出6/19・省エネ2次7/9）から逆算して専門家を1社確保し橋渡し。\n"}];
const hasMarked = (typeof marked !== "undefined");
const main = document.getElementById("main");
const nav  = document.getElementById("navlist");
const empty= document.getElementById("empty");

function build(){
  let cur = null;
  ITEMS.forEach((it, i) => {
    if(it.cat !== cur){ cur = it.cat;
      const h=document.createElement("div"); h.className="navcat"; h.textContent=it.cat; nav.appendChild(h); }
    const a=document.createElement("a"); a.className="navlink"; a.href="#a"+i; a.textContent=it.title; a.dataset.idx=i; nav.appendChild(a);

    const sec=document.createElement("section"); sec.className="card"; sec.id="a"+i;
    const head=document.createElement("div"); head.className="cardhead";
    head.innerHTML='<span class="badge"></span><span class="fname"></span>';
    head.querySelector(".badge").textContent=it.cat;
    head.querySelector(".fname").textContent=it.file;
    sec.appendChild(head);
    const body=document.createElement("div"); body.className="md";
    if(hasMarked){ body.innerHTML = marked.parse(it.md); }
    else { const pre=document.createElement("pre"); pre.textContent=it.md; body.appendChild(pre); }
    sec.appendChild(body);
    main.appendChild(sec);
  });
}
function doSearch(q){
  q=q.trim().toLowerCase();
  const cards=document.querySelectorAll("section.card");
  const links=document.querySelectorAll(".navlink");
  let shown=0;
  cards.forEach(s=>{ const hit = q==="" || s.textContent.toLowerCase().indexOf(q)>=0;
    s.style.display = hit ? "" : "none"; if(hit) shown++; });
  links.forEach(l=>{ const s=document.getElementById("a"+l.dataset.idx);
    l.style.display = (s && s.style.display==="none") ? "none" : ""; });
  empty.style.display = shown ? "none" : "block";
}
build();
document.getElementById("count").textContent = ITEMS.length + " 件の成果物";
document.getElementById("q").addEventListener("input", e=>doSearch(e.target.value));
</script>
